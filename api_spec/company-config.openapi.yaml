          readOnly: true
          description: Role permission assignment ID. Same as `key` for this object.
          example: '1748'
        href:
          type: string
          description: URL endpoint for the role permission assignment.
          readOnly: true
          example: /objects/company-config/role-permission-assignment/1748
        role:
          type: object
          description: Role that the permission and access rights are assigned to.
          readOnly: true
          properties:
            key:
              type: string
              description: Role key.
              readOnly: true
              example: '528'
            id:
              type: string
              description: Role id.
              readOnly: true
              example: '::SYS::Multi Entity Shared-ROLE-FOR - EMP4-US'
            href:
              type: string
              description: URL for the roles.
              readOnly: true
              example: /objects/roles/528
        permission:
          type: object
          description: Permission assigned to the role.
          properties:
            key:
              type: string
              description: Permission key.
              example: '3295'
            id:
              type: string
              description: Permission id.
              example: '3295'
            module:
              $ref: '#/components/schemas/module'
            name:
              type: string
              allOf:
                - $ref: '#/components/schemas/permission-name'
            href:
              type: string
              description: URL endpoint for the permission.
              readOnly: true
              example: /objects/company-config/permission/3295
        accessRights:
          type: array
          description: Permission access rights.
          example:
            - list
            - readonly
            - add
            - modify
            - delete
          items:
            $ref: '#/components/schemas/permission-access-rights'
        audit:
          $ref: '#/components/schemas/audit'
    role-user-group-map:
      $ref: '#/components/schemas/company-config-role-user-group-map'
    company-config-role-user-group-map:
      type: object
      description: Map of roles assigned to user groups.
      properties:
        key:
          type: string
          description: System-assigned unique key for the role user group map.
          readOnly: true
          example: '761'
        id:
          type: string
          description: >-
            Unique identifier for the roll user group map. This value is the same as the `key` for this object.
          readOnly: true
          example: '761'
        href:
          type: string
          description: URL endpoint for the role user group map.
          readOnly: true
          example: /objects/company-config/role-user-group-map/761
        role:
          type: object
          description: Role assigned to the user group.
          readOnly: true
          properties:
            key:
              type: string
              description: Role key.
              readOnly: true
              example: '805'
            id:
              type: string
              description: Role name.
              readOnly: true
              example: '::SYS::Multi Entity Shared-ROLE-FOR - Aaron'
            href:
              type: string
              description: URL endpoint for the role.
              readOnly: true
              example: /objects/company-config/role/805
        userGroup:
          type: object
          description: User group that has the assigned role.
          readOnly: true
          properties:
            key:
              type: string
              description: User group key.
              readOnly: true
              example: '1'
            id:
              type: string
              description: User group name.
              readOnly: true
              example: Bypass group
            href:
              type: string
              description: URL endpoint for the user group.
              readOnly: true
              example: /objects/company-config/user-group/1
        audit:
          $ref: '#/components/schemas/audit'
    role-user-map:
      $ref: '#/components/schemas/company-config-role-user-map'
    company-config-role-user-map:
      type: object
      description: Map of roles assigned to users.
      properties:
        key:
          type: string
          description: System-assigned key for the role user map.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            Unique identifier for the roll user map. This value is the same as the `key` for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the role user map.
          readOnly: true
          example: /objects/company-config/role-user-map/23
        role:
          type: object
          description: A role assigned to the user.
          readOnly: true
          properties:
            key:
              type: string
              description: Role key.
              readOnly: true
              example: '469'
            id:
              type: string
              description: Role name.
              readOnly: true
              example: Admin role
            href:
              type: string
              description: URL endpoint for the role.
              readOnly: true
              example: /objects/company-config/role/469
        user:
          type: object
          description: User to whom the role is assigned.
          readOnly: true
          properties:
            key:
              type: string
              description: User key.
              readOnly: true
              example: '189'
            id:
              type: string
              description: User login ID.
              readOnly: true
              example: Admin
            href:
              type: string
              description: URL endpoint for the user.
              readOnly: true
              example: /objects/company-config/user/189
        audit:
          $ref: '#/components/schemas/audit'
    company-config-roleRequiredProperties:
      type: object
      required:
        - id
    company-config-role:
      type: object
      description: List of roles.
      properties:
        key:
          type: string
          description: >-
            System-assigned unique key for the role. Used to identify the role in URLs or JSON bodies for all operations on the role.
          readOnly: true
          example: '24'
        id:
          type: string
          description: >
            Unique ID for the role. Cannot be changed after the role is created.


            Note that the `id` values for system-generated roles begin with `::SYS::`.

          example: Employee
        href:
          type: string
          description: URL endpoint for the role.
          readOnly: true
          example: /objects/company-config/role/24
        description:
          type: string
          description: Description of the role.
          example: Full employee permissions including approvals
        roleType:
          type: string
          description: "The type of company in which the role will be used.\n\n* `enterprise`: A single entity company with unique chart of accounts. \n* `eConsole`: Accountant or Partner console. \n* `multiEntityDistributed`: Separate companies with different charts of accounts accessed from a Management console. \n* `multiEntityShared`: Multiple units or locations with the same chart of accounts. \n"
          example: enterprise
          enum:
            - enterprise
            - eConsole
            - multiEntityDistributed
            - multiEntityShared
          default: enterprise
        applyTo:
          type: string
          description: Role is applicable to users with specified access method.
          example: loginAndSlideIn
          enum:
            - loginAndSlideIn
            - loginOnly
            - slideInOnly
          default: loginAndSlideIn
        rolePermissionAssignments:
          type: array
          description: Array of permissions and access rights for the role.
          items:
            $ref: '#/components/schemas/company-config-role-permission-assignment'
        customRolePermissionAssignments:
          type: array
          description: Array of permissions for custom applications.
          items:
            type: object
            properties:
              application:
                type: object
                properties:
                  key:
                    type: string
                    description: Custom application key.
                    example: '10004'
                  id:
                    type: string
                    description: Custom application ID.
                    example: Custom Dimension
                  href:
                    type: string
                    description: URL endpoint for the custom application.
                    readOnly: true
                    example: /objects/platform/custom-application/404
                  permission:
                    description: Array of permissions for the custom application.
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Permission name.
                          example: view_object
                        group:
                          type: string
                          description: Area where the permission applies.
                          enum:
                            - actions
                            - objects
                            - menus
                          example: objects
              accessRights:
                type: array
                description: Permission access rights.
                example:
                  - list
                  - readonly
                  - add
                  - modify
                  - delete
                items:
                  $ref: '#/components/schemas/permission-access-rights'
        roleUsers:
          type: array
          description: Array of users assigned to the role.
          readOnly: true
          items:
            $ref: '#/components/schemas/company-config-role-user-map'
        roleGroups:
          type: array
          description: Array of user groups assigned to the role.
          readOnly: true
          items:
            $ref: '#/components/schemas/company-config-role-user-group-map'
        audit:
          $ref: '#/components/schemas/audit'
    company-config-user-groupRequiredProperties:
      type: object
      required:
        - id
        - description
    company-config-user-group:
      type: object
      description: List of users assigned to user groups.
      properties:
        key:
          type: string
          description: System-assigned unique key for the user group.
          readOnly: true
          example: '21'
        id:
          type: string
          description: >-
            Name of the user group. The name cannot be changed after the group is created.
          example: AP
        href:
          type: string
          description: URL endpoint for the user group.
          readOnly: true
          example: /objects/company-config/user-group/21
        description:
          type: string
          description: Description of the user group.
          example: Accounts Payable
        roles:
          type: array
          description: >-
            List of roles assigned to the user group. All users in the group inherit the permissions defined by the roles. Only applies to companies that use role-based permissions instead of user-based permissions.
          items:
            type: object
            properties:
              key:
                type: string
                description: Unique key of the role.
                example: '7'
              id:
                type: string
                description: Name of the role.
                example: Warehouse users
              href:
                type: string
                description: Endpoint of the role.
                readOnly: true
                example: /objects/company-config/role/7
        audit:
          $ref: '#/components/schemas/audit'
    company-config-userRequiredProperties:
      type: object
      required:
        - id
        - accountEmail
        - contact
    company-config-user:
      description: User information
      type: object
      properties:
        key:
          description: >-
            System-assigned unique key for the user. Used to identify the user in URLs or JSON bodies for all operations on the user.
          type: string
          example: '29'
          readOnly: true
        id:
          description: >-
            User login ID. This unique identifier cannot be changed after the user is created.
          type: string
          example: john.doe
        userName:
          description: >-
            The name that will be used to identify the user. This name is displayed in the user interface.
          type: string
          example: John Doe
        accountEmail:
          description: User email address.
          type: string
          example: john.doe@company.com
        userType:
          description: >
            The user type for this user. User types determines the _maximum_ set of features and activities that a user can access and perform in Intacct. The things a user can do also depend on the permissions that are assigned to the user. For more information see [User types](https://www.intacct.com/ia/docs/en_US/help_action/Administration/Users/user-types.htm)

          type: string
          enum:
            - business
            - employee
            - viewOnly
            - dashboard
            - projectManager
            - paymentApprover
            - platform
            - crm
            - warehouse
            - constructionManager
          default: business
          example: employee
        adminPrivileges:
          description: >
            User admin privileges.


            * `off` - No admin privileges

            * `full` - Complete administration privileges including the ability to create other full administrators and use Platform Services features. Requires that `userType` is set to `business`.

            * `limited` - All administration privileges, except for the previously mentioned items.  Requires that `userType` is set to `business`.

          type: string
          enum:
            - 'off'
            - limited
            - full
          default: 'off'
          example: 'off'
        status:
          type: string
          description: >-
            User status.


            - `active` - The user can log in and access Intacct.

            - `inactive` -  Retains the user information in the system, but hides the user from lists throughout Intacct. Cannot be used when creating a new user.

            - `lockedOut` - Set by Intacct due to too many failed login attempts, or by an administrator to prevent the user from logging in. The user cannot log in until an administrator sets the status to `active`.
          enum:
            - active
            - inactive
            - lockedOut
          default: active
          example: active
        webServices:
          type: object
          description: Whether the user can use Sage Intacct Web Services (API).
          properties:
            isEnabled:
              description: Set to `true` to allow the user to use web services.
              type: boolean
              default: true
              example: true
            isRestricted:
              description: >-
                Set to `true` to restrict the user to Web Services only. That is, the user cannot log in to the Sage Intacct user interface.
              type: boolean
              default: false
              example: true
        password:
          type: object
          description: Password properties.
          properties:
            neverExpires:
              type: boolean
              description: >-
                Set to `true` to prevent the user's password from expiring. Use this setting only for Web Services API users.
              example: true
              default: false
            requiresReset:
              type: boolean
              description: Set to `true` to trigger the password reset flow for the user.
              example: false
              default: false
            disablePassword:
              type: boolean
              description: Disable password requirements for the user.
              default: false
              example: false
        sso:
          type: object
          description: Single sign-on settings for the user.
          properties:
            isSSOEnabled:
              type: boolean
              description: Set to `true` to enable single sign-on for the user.
              example: true
              default: false
            federatedSSOId:
              type: string
              description: Federated SSO user ID.
              example: john.doe
        entityAccess:
          type: object
          description: Entity level restrictions.
          properties:
            allowUnrestrictedAccess:
              description: >-
                Set to `true` to allow the user to access all entities in the company.
              type: boolean
              default: true
              example: true
            allowTopLevelAccess:
              description: >-
                Set to `true` to enable access to the top-level. It's a best practice to enable access to the top level for all users who are restricted to a single entity in a multi-entity shared company.
              type: boolean
              default: false
              example: false
        contact:
          type: object
          description: The contact associated with this user.
          allOf:
            - $ref: '#/components/schemas/contact-ref'
            - type: object
        trustedDevices:
          type: string
          description: >-
            Whether to recognize trusted devices for the user-- always, never, or use the company setting.
          enum:
            - companyDefault
            - always
            - never
          default: companyDefault
          example: always
        isChatterDisabled:
          type: boolean
          description: >-
            Set to `true` to prevent this user from accessing the Intacct Collaborate feature.
          default: false
          example: false
        hideOtherDepartmentTransactions:
          type: boolean
          description: >-
            Set to `true` to hide transactions that do not belong to the departments listed in the `departments` array.
          default: false
          example: false
        locations:
          type: array
          description: This field is deprecated, please use entities.
          deprecated: true
          items:
            type: object
            properties:
              key:
                type: string
                description: Location key.
                example: '42'
              id:
                type: string
                description: Location ID.
                example: PNW
              href:
                type: string
                description: Endpoint URL for the location.
                readOnly: true
                example: /objects/company-config/location/21
        entities:
          type: array
          description: >-
            Locations that the user is allowed to view and work with. Leave empty to allow the user to work with all locations.
          items:
            type: object
            properties:
              key:
                type: string
                description: Location key.
                example: '42'
              id:
                type: string
                description: Location ID.
                example: PNW
              href:
                type: string
                description: Endpoint URL for the location.
                readOnly: true
                example: /objects/company-config/entity/21
        departments:
          type: array
          description: >-
            Departments that the user is allowed to view and work with. Leave empty to allow the user to work with all departments.
          items:
            type: object
            properties:
              key:
                type: string
                description: Department key.
                example: '79'
              id:
                type: string
                description: Department ID.
                example: Sales
              href:
                type: string
                description: URL endpoint for the department.
                readOnly: true
                example: /objects/company-config/department/7
        territories:
          type: array
          description: List of territories that the user is assigned to.
          items:
            type: object
            properties:
              key:
                type: string
                description: Territory key.
                example: '9'
              id:
                type: string
                description: Territory ID.
                example: T1
              href:
                type: string
                description: URL endpoint for the territory.
                readOnly: true
                example: /objects/accounts-receivable/territory/9
        roles:
          type: array
          description: >-
            List of roles assigned to the user. The array will be empty for companies that have user-based permissions.
          items:
            type: object
            properties:
              key:
                type: string
                description: Role key.
                example: '7'
              id:
                type: string
                description: Role ID.
                example: Employee
              href:
                type: string
                description: URL endpoint for the role.
                readOnly: true
                example: /objects/company-config/role/7
        permissionAssignments:
          type: array
          description: >-
            Array of objects that define the permissions and access rights assigned to the user.
          items:
            type: object
            properties:
              permission:
                type: object
                description: Reference to a permission that is assigned to the user.
                properties:
                  key:
                    type: string
                    description: Permission key.
                    example: '414'
                  id:
                    type: string
                    description: Permission ID.
                    example: '414'
                  href:
                    type: string
                    description: Endpoint URL for the permission.
                    readOnly: true
                    example: /objects/company-config/permission/404
              accessRights:
                type: array
                description: >-
                  List of functions or tasks that the user can perform for the specified permission.
                example:
                  - list
                  - readonly
                  - add
                  - modify
                  - delete
                items:
                  $ref: '#/components/schemas/permission-access-rights'
        customPermissionAssignments:
          type: array
          description: >-
            Array of objects that define the user's permissions and access rights for custom applications.
          items:
            type: object
            properties:
              application:
                type: object
                properties:
                  key:
                    type: string
                    description: Custom application key.
                    example: '10005'
                  id:
                    type: string
                    description: Custom application ID.
                    example: Custom Dimension
                  href:
                    type: string
                    description: URL endpoint for the custom application.
                    readOnly: true
                    example: /objects/platform/custom-application/404
                  permission:
                    type: array
                    description: >-
                      List of permissions for the custom application that are assigned to the user.
                    maxItems: 1
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Resource name.
                          example: custom_object
                        group:
                          type: string
                          description: Resource type.
                          enum:
                            - actions
                            - objects
                            - menus
                          example: objects
              accessRights:
                type: array
                description: Permission access rights.
                example:
                  - list
                  - readonly
                  - add
                  - modify
                  - delete
                items:
                  $ref: '#/components/schemas/permission-access-rights'
        audit:
          $ref: '#/components/schemas/audit'
        entity:
          type: object
          description: >-
            The entity that the user is associated with. Users created at the top level do not have an entity reference so the `key`, `id`, and `name` properties will be `null`.
          properties:
            key:
              type: string
              description: Entity Key.
              example: '54'
            id:
              type: string
              description: Entity ID.
              example: '313131'
            name:
              type: string
              description: Entity Name.
              readOnly: true
              example: Central Region
            href:
              type: string
              description: URL endpoint for the entity.
              readOnly: true
              example: /objects/company-config/entity/54
        href:
          type: string
          readOnly: true
          description: URL endpoint for user.
          example: /objects/company-config/user/21
  responses:
    400error:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error-response'
  securitySchemes:
    OAuth2:
      description: Sage Intacct OAuth 2.0 authorization code flow
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.intacct.com/ia/api/v1/oauth2/authorize
          tokenUrl: https://api.intacct.com/ia/api/v1/oauth2/token
          refreshUrl: https://api.intacct.com/ia/api/v1/oauth2/token
          scopes: {}
