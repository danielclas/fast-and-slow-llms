          type: object
          description: Parent employee type, for employee type hierarchies.
          properties:
            key:
              type: string
              description: Parent employee type key.
              nullable: true
              example: '7'
            id:
              type: string
              description: Parent employee type ID or name.
              nullable: true
              example: Contractor
            href:
              type: string
              description: URL endpoint for the parent employee type.
              readOnly: true
              example: /objects/company-config/employee-type/7
        form1099:
          type: object
          description: Details related to the 1099 form for the employee type.
          readOnly: true
          properties:
            type:
              type: string
              description: The type of the 1099 form applicable to the employee type.
              readOnly: true
              nullable: true
              example: MISC
            box:
              type: string
              description: >
                Specifies the category box on the 1099 form where vendor payments are reported. This categorization helps in identifying the nature of payments made, such as royalties, non-employee compensation, or rent, corresponding to different IRS reporting requirements.

              readOnly: true
              nullable: true
              example: '3'
        status:
          $ref: '#/components/schemas/status'
        audit:
          $ref: '#/components/schemas/audit'
        entity:
          $ref: '#/components/schemas/entity-ref'
