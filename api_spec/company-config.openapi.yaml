    company-config-employee:
      type: object
      description: Information about an employee.
      properties:
        key:
          type: string
          description: System-assigned unique key for the employee.
          readOnly: true
          example: '3086'
        id:
          type: string
          description: Unique ID of the employee.
          example: jsmith
        name:
          type: string
          description: Name of the employee.
          example: John Smith
        startDate:
          type: string
          format: date
          example: '2021-04-30'
          description: Employment start date.
          nullable: true
        jobTitle:
          type: string
          description: Job title.
          nullable: true
          example: VP Sales
        status:
          $ref: '#/components/schemas/status'
        birthDate:
          type: string
          description: Employee date of birth.
          format: date
          nullable: true
          example: '1984-04-13'
        endDate:
          type: string
          description: Employment termination date.
          format: date
          nullable: true
          example: '2026-04-01'
        postActualCostWithVariance:
          type: boolean
          description: >-
            Set to `true` to indicate that the actual cost with variance is posted when earning type is salary.
          example: false
          default: false
        mergePaymentRequests:
          type: boolean
          description: >-
            Set to `true` to indicate that the system can merge payment requests.
          example: true
          default: true
        sendAutomaticPaymentNotification:
          type: boolean
          description: >-
            Set to `true` to indicate that the system can send automatic payment notifications when the employee is issued an expense reimbursement.
          example: true
          default: false
        manager:
          type: object
          description: Manager of the employee.
          properties:
            key:
              type: string
              description: System-assigned unique key of the manager.
              nullable: true
              example: '1'
            id:
              type: string
              description: Manager ID.
              nullable: true
              example: jsmith
            name:
              type: string
              description: Manager name.
              nullable: true
              example: johnsmith
            href:
              type: string
              description: Endpoint URL for the manager.
              readOnly: true
              example: /objects/company-config/employee/1
        gender:
          type: string
          description: Gender.
          enum:
            - null
            - female
            - male
          nullable: true
          default: null
          example: female
        location:
          type: object
          description: >-
            Location where the employee works. Required when an employee is created at the top level in a multi-entity, multi-base-currency company.
          readOnly: true
          properties:
            key:
              type: string
              description: Location key.
              nullable: true
              example: '5'
            id:
              type: string
              description: Location ID.
              nullable: true
              example: US
            name:
              type: string
              description: Location name.
              nullable: true
              readOnly: true
              example: USA
            href:
              type: string
              description: URL endpoint for the location.
              readOnly: true
              example: /objects/company-config/location/1
        department:
          type: object
          description: The department that the employee works for.
          properties:
            key:
              type: string
              description: Department key.
              nullable: true
              example: '1'
            id:
              type: string
              description: Department ID.
              nullable: true
              example: HR
            name:
              type: string
              description: Department name.
              readOnly: true
              nullable: true
              example: HR
            href:
              type: string
              description: URL endpoint for the department.
              readOnly: true
              example: /objects/company-config/department/1
        class:
          type: object
          description: Class that the employee is associated with.
          properties:
            key:
              type: string
              description: Class key.
              nullable: true
              example: '1'
            id:
              type: string
              description: Class ID.
              nullable: true
              example: A
            name:
              type: string
              description: Class name.
              readOnly: true
              nullable: true
              example: A
            href:
              type: string
              description: URL endpoint for the class.
              readOnly: true
              example: /objects/company-config/class/1
        defaultCurrency:
          nullable: true
          type: string
          description: >-
            Currency to use for the employee's expense reports and payments, if different from the company's base currency. Only used if the company uses multiple transaction currencies.
          example: USD
        primaryContact:
          type: object
          description: The contact object that represents the employee.
          properties:
            key:
              type: string
              description: System-assigned unique key of the contact.
              example: '12345'
            id:
              type: string
              description: Unique ID of the contact.
              nullable: true
              example: rkincaid
            lastName:
              type: string
              readOnly: true
              description: Contact last name.
              example: Kincaid
            firstName:
              type: string
              readOnly: true
              description: Contact first name.
              example: Reuben
            middleName:
              type: string
              readOnly: true
              description: Contact middle name or initial.
              example: X
            prefix:
              type: string
              readOnly: true
              description: Prefix, such as Mr., Mrs., or Ms.
              example: Mr.
            email1:
              type: string
              readOnly: true
              description: Primary email address.
              example: reuben@mycompany.com
            email2:
              type: string
              readOnly: true
              description: Secondary email address.
              example: robert@mycompany.com
            phone1:
              type: string
              readOnly: true
              description: Primary phone number.
              example: '4151231234'
            phone2:
              type: string
              readOnly: true
              description: Secondary phone number.
              example: '4158661823'
            mobile:
              type: string
              readOnly: true
              description: Mobile phone number.
              example: '4159879876'
            pager:
              type: string
              readOnly: true
              description: Pager number.
              example: '4151112222'
            fax:
              type: string
              readOnly: true
              description: Fax number.
              example: '4152221111'
            URL1:
              type: string
              readOnly: true
              description: Web page address for this contact.
              example: https://mycompany.com
            URL2:
              type: string
              readOnly: true
              description: Secondary web page address.
              example: https://whitehouse.gov
            companyName:
              type: string
              readOnly: true
              description: Name of the company associated with this contact.
              example: AlcoSoft Inc
            printAs:
              type: string
              readOnly: true
              description: The contact name as it appears on bills, invoices, etc.
              example: Reuben Kincaid
            mailingAddress:
              type: object
              title: mailingAddress
              description: The mailing address of the contact.
              properties:
                addressLine1:
                  type: string
                  description: The first address line for shipping, billing, etc.
                  nullable: true
                  example: 300 Park Avenue
                  readOnly: true
                addressLine2:
                  type: string
                  description: The second address line for shipping, billing, etc.
                  nullable: true
                  example: Suite 1400
                  readOnly: true
                city:
                  type: string
                  readOnly: true
                  description: City.
                  example: San Jose
                state:
                  type: string
                  readOnly: true
                  description: State.
                  example: California
                postCode:
                  type: string
                  readOnly: true
                  description: Zip or Postal Code.
                  example: '95110'
                country:
                  type: string
                  readOnly: true
                  description: Country.
                  example: United States
                isoCountryCode:
                  type: string
                  readOnly: true
                  description: ISO country code.
                  example: US
            href:
              type: string
              readOnly: true
              description: URL endpoint for the contact.
              example: /objects/company-config/contact/12345
        employeeType:
          type: object
          description: >-
            Defines the status of employee, such as full time, part time, or contractor.
          properties:
            key:
              type: string
              description: Employee type key.
              nullable: true
              example: '1'
            id:
              type: string
              description: Employee type name.
              nullable: true
              example: hourly
            href:
              type: string
              description: URL endpoint for the employee type.
              readOnly: true
              example: /objects/company-config/employee-type/1
        earningType:
          type: object
          description: >-
            An earning type specifies the GL accounts that the employee's labor costs are posted to.
          properties:
            key:
              type: string
              description: Earning type key.
              nullable: true
              example: '1'
            id:
              type: string
              description: Earning type name.
              nullable: true
              example: Overtime pay
            href:
              type: string
              description: URL endpoint for the earning type.
              example: /objects/company-config/earning-type/1
              readOnly: true
        SSN:
          type: string
          nullable: true
          description: Employee social security number. Do not include dashes.
          example: '078051120'
        employeePosition:
          type: object
          description: Reference to an employee position. Only used for construction.
          properties:
            key:
              type: string
              description: Employee position key.
              nullable: true
              example: '1'
            id:
              type: string
              description: Employee position ID.
              nullable: true
              example: SV001
            name:
              type: string
              description: Name of the employee position.
              nullable: true
              readOnly: true
              example: permanent
            href:
              type: string
              description: URL endpoint for the employee position.
              readOnly: true
              example: /objects/construction/employee-position/1
        terminationType:
          type: string
          description: Termination status, if the employee has left the company.
          enum:
            - null
            - voluntary
            - involuntary
            - deceased
            - disability
            - retired
          nullable: true
          default: null
          example: voluntary
        form1099:
          type: object
          description: Form 1099 information for the employee.
          properties:
            name:
              type: string
              description: Employee name as it appears on the 1099 form.
              nullable: true
              example: John Smith
            type:
              type: string
              description: Type of form 1099.
              nullable: true
              example: MISC
            box:
              type: string
              description: Box value of form 1099.
              nullable: true
              example: '3'
        ach:
          type: object
          description: ACH details if the employee is paid by ACH.
          properties:
            enabled:
              type: boolean
              description: Enable ACH.
              example: false
            bankRoutingNumber:
              type: string
              nullable: true
              description: ACH bank routing number.
              example: '325070760'
            accountNumber:
              type: string
              nullable: true
              description: Account number.
              example: '3123123456'
            accountType:
              type: string
              nullable: true
              description: Account type.
              example: checkingAccount
              enum:
                - null
                - checkingAccount
                - savingsAccount
            remittanceType:
              type: string
              nullable: true
              description: Account classification.
              example: personalPPD
              enum:
                - null
                - personalPPD
                - businessCCD
                - businessCTX
        isPlaceholderResource:
          type: boolean
          description: >-
            Set to `true` to mark this employee as a placeholder resource. Only used for the Projects application.
          example: false
          default: false
        filePaymentService:
          type: string
          nullable: true
          description: File payment service type.
          example: ach
          enum:
            - null
            - ach
            - bankFile
            - none
          default: none
        bankFile:
          type: object
          properties:
            paymentCountryCode:
              type: string
              description: >-
                Bank file payment country code. Required when `filePaymentService` is `bankFile`.
              allOf:
                - $ref: '#/components/schemas/country-code'
              nullable: true
              example: gb
            paymentCurrency:
              type: string
              description: Bank file payment currency.
              nullable: true
              example: EUR
        bankFileSetup:
          type: array
          description: Bank file setup for the employee.
          items:
            $ref: '#/components/schemas/company-config-employee-bank-file-setup'
        preferredPaymentMethod:
          type: string
          description: Preferred payment method.
          enum:
            - null
            - printedCheck
            - eft
            - cash
            - ach
          nullable: true
          default: null
          example: cash
        attachmentFolder:
          type: object
          description: Attachment folder for storing documents related to the employee.
          properties:
            key:
              type: string
              description: Folder key.
              example: '1'
            id:
              type: string
              description: Folder ID.
              nullable: true
              example: RK495
            href:
              type: string
              description: URL endpoint for the folder.
              example: /objects/company-config/folder/1
        employeeRates:
          type: array
          description: Employee cost rates.
          items:
            $ref: '#/components/schemas/company-config-employee-rate'
        positionSkills:
          description: Array of positions and skills associated with an employee.
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Position skill key.
                example: '7'
              id:
                type: string
                description: Position skill ID.
                example: Care giver
              href:
                type: string
                description: URL endpoint for the position skill.
                example: /objects/projects/position-skill/7
                readOnly: true
        audit:
          $ref: '#/components/schemas/audit'
        entity:
          $ref: '#/components/schemas/entity-ref'
        href:
          type: string
          example: /objects/company-config/employee/28
          description: URL endpoint for the employee.
          readOnly: true
