    company-config-email-templateRequiredProperties:
      type: object
      properties:
        sender:
          type: object
          required:
            - replyTo
      required:
        - name
        - subject
        - body
    company-config-email-template:
      type: object
      description: >-
        Listing of the templates for sending out any electronic order entry transaction with the person who created it. (Legacy)
      properties:
        key:
          type: string
          description: System-assigned unique key for the email template.
          readOnly: true
          example: '23'
        id:
          type: string
          description: Email Template ID. This value is the same as `key` for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint of the email template.
          readOnly: true
          example: /objects/company-config/email-template/23
        status:
          $ref: '#/components/schemas/status'
        name:
          type: string
          description: Name for the email template.
          example: Sales invoice-Monthly
        description:
          type: string
          description: Description of the email template.
          example: Used to send monthly sales invoices.
        sender:
          type: object
          description: Sender information for the email template.
          properties:
            replyTo:
              type: string
              description: >-
                The email address you want recipients to reply to. This corresponds to the From email address the user sees in the Print/Email dialog box when they send an email from a transaction.
              example: JSmith@co.com
            senderName:
              type: string
              description: Display name for the reply to address.
              example: John Smith
        recipients:
          type: object
          description: >-
            Recipient information for the email template. You can put one or more email addresses in each field (use commas to separate multiple addresses), or you can use one or more [merge fields](https://www.intacct.com/ia/docs/en_US/help_action/Company/Email_templates/email-template-merge-fields.htm) in each field. The merge fields are replaced with the actual email addresses when the email is sent.
          properties:
            to:
              type: string
              description: The primary recipients of the email.
              example: someEmail@co.com
            cc:
              type: string
              description: Recipients who should receive a courtesy copy of the email.
              example: someEmail@co.com
            bcc:
              type: string
              description: >-
                Recipients who should receive a copy of the email but not be visible to other recipients.
              example: someEmail@co.com
        subject:
          type: string
          description: >-
            Enter a combination of text and merge fields as desired to create an informative subject line.
          example: Account statement due by {!ARINVOICE.WHENDUE!}
        body:
          type: string
          description: >-
            Enter a combination of text, merge fields, and HTML markup as desired to create and customize the message.
          example: Message for all to see
        logo:
          type: object
          description: >-
            Logo information for the email template. The logo is included in the email if the `isLogoIncluded` property is set to `true`.
          properties:
            isLogoIncluded:
              type: boolean
              description: >-
                Set to `true` to include the logo image file identified on the Company Information page in the email template.
              default: false
              example: true
            verticalPosition:
              type: string
              description: >-
                Vertical logo position. Sets whether the logo should appear at the top or bottom of the email.
              enum:
                - top
                - bottom
              default: bottom
              example: bottom
            horizontalPosition:
              type: string
              description: >-
                Horizontal logo position. Sets whether the logo should appear on the left or right side of the email.
              enum:
                - left
                - right
              default: left
              example: left
        includeTxnAttachments:
          type: boolean
          description: >-
            Set to `true` to include documents attached to the transaction, such as receipts, in emails sent from transactions. Attachments are emailed in the format in which they were attached to the transaction. For example, if you attached a TXT file, the file is sent as a TXT file.
          default: false
          example: true
        includeProjectInvoiceTxnAttachments:
          type: boolean
          description: >-
            Set to `true` to include all source document attachments linked to a project invoice when emailing the invoice. Attachments are emailed in the format in which they were attached to the transaction. For example, if you attached a TXT file, the file is sent as a TXT file.
          default: false
          example: true
        templateType:
          type: string
          description: >-
            The type of transaction to use this email template for. This value determines the merge fields available for use in the subject and body of the email template.
          enum:
            - arInvoice
            - arStatement
            - contract
            - orderEntryTxn
            - purchasingTxn
          default: arInvoice
          example: arInvoice
        useSendersPreferredDateFormat:
          type: boolean
          description: >-
            Set to `true` to use dates in the email in the user preference setting.
          default: false
          example: true
        combineAttachmentsToZip:
          type: string
          description: >-
            Combine attachments into a zip file

            - `none` - Do not combine attachments into a zip file

            - `single` - Combine attachments into a single zip file

            - `expenseType` - Combine attachments into a single zip file by expense type
          enum:
            - none
            - single
            - expenseType
          default: none
          example: none
        audit:
          $ref: '#/components/schemas/audit'
    company-config-employee-bank-file-setup:
      type: object
