    company-config-affiliate-entity-group:
      type: object
      description: >-
        A collection of associated entities. For example, parent entity E100 is associated with entities E200 and E500. Together, these affiliate entities are a reporting group.
      properties:
        key:
          type: string
          description: System-assigned unique key for the affiliate entity group.
          readOnly: true
          example: '23'
        id:
          type: string
          description: Unique identifier for the affiliate entity group.
          example: AF
        href:
          type: string
          description: URL endpoint for the affiliate entity group.
          readOnly: true
          example: /objects/company-config/affiliate-entity-group/23
        name:
          type: string
          description: Name for the affiliate entity group.
          example: MariposaBusinessEntities
        description:
          type: string
          description: Description for the affiliate entity group.
          example: E100 E200 E500 affiliate entity group
        groupType:
          type: string
          description: "Group membership type. The group type and related fields determine which affiliate entities are included in the group. If you are creating reports that use affiliate entities in rows or columns, these fields also determine the column headings and row headings that will appear, and the order in which they will be listed.\n\n* `specific` - Specify the affiliate entities to include and their order in the `groupMembers` array. You can optionally filter the array with the `memberFilter` settings.\n* `all` - All affiliate entities that match the `memberFilter` criteria. \n"
          example: specific
          enum:
            - all
            - specific
          default: all
        memberFilter:
          type: object
          description: >-
            One or more filters to select the affiliate entities to include in the group. Can be used in addition to the `groupMembers` array to filter from a selected list of affiliate entities.
          allOf:
            - $ref: '#/components/schemas/member-filter'
            - type: object
        groupMembers:
          type: array
          description: >-
            Members of the affiliate entity group. Only applicable when `groupType` = `specific`.
          items:
            type: object
            properties:
              key:
                type: string
                description: Affiliate entity key.
                example: '23'
              id:
                type: string
                description: Affiliate entity ID.
                example: E200
              name:
                type: string
                description: Affiliate entity name.
                readOnly: true
                example: Mariposa
              href:
                type: string
                description: URL endpoint for the affiliate entity.
                readOnly: true
                example: /objects/company-config/affiliate-entity/23
        isDimensionStructure:
          type: boolean
          description: >-
            Indicates whether a dimension structure is created from the group. If true, the group can be added to the rows or columns of a financial report.
          default: false
          example: false
        audit:
          $ref: '#/components/schemas/audit'
        entity:
          $ref: '#/components/schemas/entity-ref'
    status:
      type: string
      description: >-
        Object status. Active objects are fully functional. Inactive objects are essentially hidden and cannot be used or referenced.
      enum:
        - active
        - inactive
      default: active
      example: active
    company-config-affiliate-entity:
      type: object
      description: >-
        Affiliate entities are associated entities defined within your Intacct company. You use an affiliate entity to tag the related entity in a transaction. Tagging affiliate entities in transactions enables more detailed and rich reporting. Affiliate entity is a standard dimension based on the list of entities in your Intacct company. Because it's based on the entities in your company, the affiliate entity dimension is read-only.
      properties:
        key:
          type: string
          description: System-assigned unique key for the affiliate entity.
          readOnly: true
          example: '23'
        id:
          type: string
          description: Unique identifier for the affiliate entity.
          readOnly: true
          example: E200
        name:
          type: string
          description: The name of the affiliate entity.
          example: Mariposa
        href:
          type: string
          description: URL endpoint for the affiliate entity.
          readOnly: true
          example: /objects/company-config/affiliate-entity/23
        status:
          $ref: '#/components/schemas/status'
        audit:
          $ref: '#/components/schemas/audit'
