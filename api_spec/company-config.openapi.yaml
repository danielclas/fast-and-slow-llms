          example: AR Inv
        nextSequence:
          type: string
          description: The next sequence value.
          example: INV-16
        fiscalYear:
          type: integer
          description: The fiscal year that the sequence value belongs to.
          example: 2024
    company-config-dimensions-list-response:
      description: Dimension information
      type: object
      properties:
        dimensionName:
          type: string
          description: Dimension name used for integrations.
          example: DEPARTMENT
        dimensionLabel:
          type: string
          description: Default dimension label as it appears in the UI.
          example: Department
        termName:
          type: string
          description: Dimension label as defined in company terminology.
          example: Department
        isUserDefinedDimension:
          type: boolean
          description: This is `true` for user-defined dimensions.
          example: true
        isEnabledInGL:
          type: boolean
          description: >-
            This is `true` if the dimension is enabled in the General Ledger module for this company.
          example: true
        dimensionEndpoint:
          type: string
          description: URL endpoint of the dimension.
          example: /objects/company-config/department
    company-config-location-group-member:
      type: object
      description: Location group member represents the members in the location group
      properties:
        key:
          type: string
          description: System-assigned key for the location group member.
          readOnly: true
          example: '23'
        id:
          type: string
          description: Location group members ID. Same as `key` for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the location group member.
          readOnly: true
          example: /objects/company-config/location-group-member/23
        location:
          type: object
          description: Location that this member represents.
          properties:
            key:
              type: string
              description: Location key.
              example: '1'
            id:
              type: string
              description: Location ID.
              example: '1'
            name:
              type: string
              description: Location name.
              readOnly: true
              example: United States of America
            href:
              type: string
              description: URL endpoint for the location.
              readOnly: true
              example: /objects/company-config/location/23
        locationGroup:
          description: Location group that this member belongs to.
          type: object
          readOnly: true
          properties:
            key:
              type: string
              description: Location group key.
              readOnly: true
              example: '33'
            id:
              type: string
              description: Identifier for the Location group.
              readOnly: true
              example: WH1
            href:
              type: string
              description: URTL endpoint for the Location group.
              readOnly: true
              example: /objects/company-config/location-group/33
        sortOrder:
          type: integer
          description: >-
            Sort order of the location when the location group is displayed in reports.
          readOnly: true
          example: 2
        audit:
          $ref: '#/components/schemas/audit'
    company-config-location-groupRequiredProperties:
      type: object
      required:
        - id
        - name
    company-config-location-group:
      type: object
      description: >-
        A specified set of locations, or a set of locations that meet certain criteria.
      properties:
        key:
          type: string
          description: System-assigned unique key for the location group.
          readOnly: true
          example: '33'
        id:
          type: string
          description: >-
            Location group ID. Displayed together with the group name in Sage Intacct (_ID_--_Name_). Location group IDs cannot be changed after the group has been created.
          example: WH1
        href:
          type: string
          description: URL endpoint for the location group.
          readOnly: true
          example: /objects/company-config/location-group/33
        name:
          type: string
          description: >-
            Location group name. Displayed together with the group ID in Sage Intacct (_ID_--_Name_).
          example: Western Region Warehouses
        description:
          type: string
          description: Description of the location group.
          example: Western Region Warehouses
        primaryContact:
          type: object
          description: Default contact for this group.
          properties:
            key:
              type: string
              description: System-assigned key for the contact.
              example: '7'
            id:
              type: string
              description: Contact ID.
              example: Jeff Pinkerton
            href:
              type: string
              description: URL endpoint for the contact.
              readOnly: true
              example: /objects/company-config/contact/7
        groupType:
          type: string
          description: "Group membership type. The group type and related fields determine which locations are included in the group. If you are creating reports that use locations in rows or columns, these fields also determine the column headings and row headings that will appear, and the order in which they will be listed.\n\n* `specific` - Specify the locations to include and their order in the `groupMembers` array. You can optionally filter the array with the `memberFilter` settings.\n* `all` - All locations that match the `memberFilter` criteria. \n"
          example: specific
          enum:
            - all
            - specific
          default: all
        memberFilter:
          type: object
          description: >-
            One or more filters to select the locations to include in the location group. Can be used in addition to the `groupMembers` array to filter from a selected list of locations.
          allOf:
            - $ref: '#/components/schemas/member-filter'
            - type: object
        groupMembers:
          type: array
          description: >-
            Members of the location group and their sort order. Only applicable when `groupType` = `specific`.
          items:
            $ref: '#/components/schemas/company-config-location-group-member'
        isDimensionStructure:
          type: boolean
          description: >-
            Indicates whether a dimension structure is created from the group. If true, the group can be added to the rows or columns of a financial report.
          default: false
          example: false
        audit:
          $ref: '#/components/schemas/audit'
    company-config-locationRequiredProperties:
      type: object
      required:
        - id
        - name
    company-config-location:
      type: object
      description: >-
        Location is a dimension that is used to represent the geographic locations of offices or facilities. It can also be used for divisions in a company, if that is more significant than geographic locations. Once defined, locations can be set on transactions, and that information can be used to provide new insights in reports.
      properties:
        key:
          type: string
          description: >-
            System-assigned unique key for the location. Used to identify the location in URLs or JSON bodies for all operations on the location.
          readOnly: true
          example: '3345'
        id:
          type: string
          description: Unique identifier for the location.
          example: 1-Lyon
        href:
          type: string
          readOnly: true
          description: URL endpoint for this location.
          example: /objects/company-config/location/21
        name:
          type: string
          description: Name of the location.
          example: Lyon-France
        status:
          $ref: '#/components/schemas/dimension-status'
        taxId:
          type: string
          description: State tax ID or VAT registration number.
          example: US4321112
        startDate:
          type: string
          description: Start date of operation at this location.
          format: date
          example: '2021-01-01'
        endDate:
          type: string
          description: End date of operation at this location.
          format: date
          example: '2022-04-01'
        contacts:
          type: object
          description: The list of contacts for the location.
          properties:
            primary:
              type: object
              description: >-
                The primary location contact specifies the company name, address, and other details as they should appear on invoices, bills, and other forms.
              allOf:
                - $ref: '#/components/schemas/contact-ref'
                - type: object
            shipTo:
              type: object
              description: >-
                The address for receiving goods and services, if different from the primary contact address.
              allOf:
                - $ref: '#/components/schemas/contact-ref'
                - type: object
        locationReportingTitle:
          type: string
          description: >-
            Location information displayed in reports, in addition to the location name. For example, a location title might include the address and manager name.
          example: Seattle Sales Office
        parent:
          type: object
          description: Parent location, for location hierarchies.
          properties:
            key:
              description: Parent location key.
              type: string
              example: '65'
            id:
              description: Parent location ID.
              type: string
              example: 1-France
            href:
              description: URL endpoint of parent location.
              type: string
              readOnly: true
              example: /objects/company-config/location/65
            name:
              description: Name of the parent location.
              type: string
              readOnly: true
              example: California
        manager:
          type: object
          description: The employee that manages the location.
          properties:
            key:
              description: Manager's employee key.
              type: string
              example: '81'
            id:
              description: ID of the manager employee.
              type: string
              example: anne.jason
            href:
              description: URL endpoint of the manager employee.
              type: string
              readOnly: true
              example: /objects/company-config/employee/81
            name:
              description: Name of the manager.
              type: string
              readOnly: true
              example: Donations
        audit:
          $ref: '#/components/schemas/audit'
