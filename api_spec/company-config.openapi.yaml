    company-config-document-sequence-rollover:
      type: object
      description: >
        The rollover configuration holds the next number or alpha values used to generate sequences for the fiscal years.

        When rollover is enabled for a document sequence then a restart of the document sequence is initiated for each fiscal year.

        If the configuration for a fiscal year is missing then it is automatically generated by the system when the first sequence is generated.

        When the system generates a configuration the next number or alpha values are taken over from the base start values.

      properties:
        key:
          type: string
          description: System-assigned unique key for the document sequence rollover.
          readOnly: true
          example: '100'
        id:
          type: string
          description: >-
            Unique identifier for the document sequence rollover. This value is the same as the `key` for this object.
          readOnly: true
          example: '100'
        href:
          type: string
          description: URL endpoint for the document sequence rollover.
          readOnly: true
          example: /objects/company-config/document-sequence-rollover/100
        documentSequence:
          type: object
          description: Document sequence that the rollover configuration applies to.
          readOnly: true
          properties:
            key:
              type: string
              description: Document sequence key.
              readOnly: true
              example: '107'
            id:
              type: string
              description: Document sequence ID.
              readOnly: true
              example: BOA_ACH_BatchNo
            href:
              type: string
              description: URL endpoint for the document sequence.
              readOnly: true
              example: /objects/company-config/document-sequence/107
        fiscalYear:
          type: integer
          description: Fiscal year during which this rollover configuration is used.
          example: 2024
        nextNumber:
          type: integer
          description: >-
            Next number used to generate sequences for the fiscal year when the document-sequence `type` is `numeric`. Must be within the limits set by the `startingNumber` and `endingNumber` fields in the document-sequence.
          nullable: true
          example: 1
        nextSequence:
          type: string
          description: >-
            Next sequence used to generate sequences for the fiscal year when the document-sequence `type` is `alpha`. Must be within the limits set by the `startingSequence` and `endingSequence` fields in the document-sequence.
          nullable: true
          example: a
        audit:
          $ref: '#/components/schemas/audit'
    company-config-document-sequenceRequiredProperties:
      type: object
      required:
        - id
    company-config-document-sequence:
      type: object
      description: Document sequencing
      properties:
        key:
          type: string
          description: System-assigned unique key for the document sequence.
          readOnly: true
          example: '61'
        id:
          type: string
          description: Unique name for the document sequence.
          example: Vendors
        printTitle:
          type: string
          description: The sequence name that prints on invoice PDFs.
          example: Vendors
        type:
          type: string
          description: >-
            Numeric or alpha sequence. Alpha sequences are currently only available for use with Cash Management, or French companies.
          enum:
            - numeric
            - alpha
          example: numeric
          default: numeric
        fixedLength:
          type: string
          description: >-
            The total length of the primary sequence, includingn any padding characters, up to 16 characters. Numeric sequences will be padded with zeroes and alpha sequence will be padded with a's.
          nullable: true
          example: '16'
        fixedPrefix:
          type: string
          description: Characters that appear before the primary sequence.
          example: INV
        prefixSeparator:
          type: string
          description: >-
            Characters to use between the prefix and the auto-generated sequence.
          example: '-'
        fixedSuffix:
          type: string
          description: Characters that appear after the primary sequence.
          example: COMPANY
        suffixSeparator:
          type: string
          description: >-
            Characters to use between the auto-generated sequence and the suffix.
          example: '-'
        startingNumber:
          type: integer
          description: Starting number for `numeric` sequences.
          nullable: true
          example: 1
        endingNumber:
          type: integer
          description: Ending number for `numeric` sequences.
          nullable: true
          example: 100
        nextNumber:
          type: integer
          description: Next number
          nullable: true
          example: 1
        startingSequence:
          type: string
          description: Starting sequence
          nullable: true
          example: a
        endingSequence:
          type: string
          description: Ending sequence
          nullable: true
          example: zzz
        nextSequence:
          type: string
          description: Next sequence
          nullable: true
          example: a
        whenModified:
          type: string
          format: date-time
          description: Date and time when the document sequence was last modified.
          example: '2024-04-01T11:28:12Z'
        entity:
          type: object
          description: Entity that the document sequence can be used in.
          readOnly: true
          properties:
            key:
              type: string
              description: Entity Key.
              example: '54'
            id:
              type: string
              description: Entity ID.
              example: Western Region
            name:
              type: string
              description: Entity Name.
              readOnly: true
              example: Western Region
            href:
              type: string
              readOnly: true
              description: URL endpoint for the entity.
              example: /objects/company-config/entity/54
        rollover:
          type: object
          description: >-
            Fiscal year rollover configuration for the document sequence, which will automatically restart the document sequence for each fiscal year.

            Use the `fiscalYears` to configure the next number or alpha values used to generate sequences for the fiscal years.

            If the configuration for a fiscal year is missing then it will be generated by the system when the first sequence is generated. The next number or alpha values will be taken from the base start values.
          properties:
            isEnabled:
              type: boolean
              description: Set to `true` to enable sequence rollover by fiscal years.
              example: false
              default: false
            enabledDate:
              type: string
              readOnly: true
              format: date
              description: >-
                The date the rollover configuration was enabled for the first time.
              example: '2021-01-23'
            fiscalYearAffixPosition:
              type: string
              description: |
                Where to insert the fiscal year in document sequence values.

                ** Valid values **

                  - `none` Do not automatically insert the fiscal year into the document sequence.
                  - `prefix` Use the fiscal year and the rollover `separator`` as a prefix to the document sequence.
                  - `suffix` Append the rollover `separator`` and the fiscal year as a suffix to the document sequence.
              example: prefix
              enum:
                - none
                - prefix
                - suffix
              default: none
            separator:
              type: string
              description: >-
                Rollover separator used when the `fiscalYearAffixPosition` is set to `prefix` or `suffix`
              example: '-'
            fiscalYears:
              type: array
              description: >-
                Array of document-sequence-rollover objects that define the next number or alpha values to use to generate sequences for specific fiscal years.
              items:
                $ref: '#/components/schemas/company-config-document-sequence-rollover'
        status:
          $ref: '#/components/schemas/status'
        href:
          type: string
          readOnly: true
          description: URL endpoint of the document-sequence
          example: /objects/company-config/document-sequence/61
        audit:
          $ref: '#/components/schemas/audit'
    company-config-earning-typeRequiredProperties:
