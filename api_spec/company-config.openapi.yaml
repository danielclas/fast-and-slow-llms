          $ref: '#/components/schemas/status'
        audit:
          $ref: '#/components/schemas/audit'
    company-config-exchange-rate-lineRequiredProperties:
      type: object
      required:
        - effectiveStartDate
        - rate
        - exchangeRate
    company-config-exchange-rate-line:
      type: object
      description: >-
        Detailed information about exchange rates such as effective start date, exchange rate, and reciprocal rate.
      properties:
        key:
          type: string
          description: System-assigned unique key for the exchange rate line.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            Unique identifier for the exchange rate line. This value is the same as `key` for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the exchange rate line.
          readOnly: true
          example: /objects/company-config/exchange-rate-line/23
        effectiveStartDate:
          type: string
          format: date
          description: The date the exchange rate becomes effective.
          example: '2021-01-31'
        rate:
          type: number
          description: The conversion rate to use, beginning with the effective start date.
          nullable: false
          example: 2
        reciprocalRate:
          type: number
          description: >-
            The reverse of the conversion rate (`rate`). For example, if you are establishing a `rate` to convert dollars to Euros, the `reciprocalRate` is used to convert Euros to dollars.
          example: 0.5
        exchangeRate:
          type: object
          description: Reference to the exchange rate that this line belongs to.
          properties:
            key:
              type: string
              description: Unique key for the exchange rate.
              example: '23'
            id:
              type: string
              description: Unique identifier for the exchange rate.
              example: '23'
            href:
              type: string
              description: URL endpoint for the exchange rate.
              readOnly: true
              example: /objects/company-config/exchange-rate/23
        audit:
          $ref: '#/components/schemas/audit'
    company-config-exchange-rate-typeRequiredProperties:
      type: object
      required:
        - name
    company-config-exchange-rate-type:
      type: object
      description: Exchange rate type definition.
      properties:
        key:
          type: string
          description: System-assigned unique key for the exchange rate type.
          readOnly: true
          example: '23'
        id:
          type: string
          description: Unique identifier for the exchange rate type.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the the exchange rate type.
          readOnly: true
          example: /objects/company-config/exchange-rate-type/23
        name:
          type: string
          description: Name or other unique identifier for the exchange rate type.
          nullable: false
          example: GBP-Rate
        isDefault:
          type: boolean
          description: >-
            Indicates whether the system should use the exchange rate type as the default. Setting `isDefault` to `true` for an exchange rate type will automatically set it to `false` for the current default exchange rate type.
          example: false
          default: false
        audit:
          $ref: '#/components/schemas/audit'
    company-config-exchange-rateRequiredProperties:
      type: object
      required:
        - fromCurrency
        - toCurrency
        - exchangeRateType
    company-config-exchange-rate:
      type: object
      description: Exchange rate definition.
      properties:
        key:
          type: string
          description: System-assigned key for the exchange rate.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            Unique identifier for the exchange rate. Same as `key` for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the exchange rate.
          readOnly: true
          example: /objects/company-config/exchange-rate/23
        fromCurrency:
          type: string
          description: The transaction currency to convert from.
          nullable: false
          example: USD
        toCurrency:
          type: string
          description: The transaction currency to convert to.
          nullable: false
          example: GBP
        exchangeRateType:
          type: object
          description: Exchange rate type.
          properties:
            key:
              type: string
              description: Exchange rate type.
              example: '123'
            id:
              type: string
              description: Exchange rate type.
              example: '123'
            name:
              type: string
              description: Exchange rate type name.
              readOnly: true
              example: GBP-Rate
            href:
              type: string
              description: URL endpoint for the exchange rate type.
              readOnly: true
              example: /objects/company-config/exchange-rate-type/123
        lines:
          description: >-
            Exchange rate lines in this exchange rate. Each line represents a rate and an effective starting date.
          type: array
          items:
            $ref: '#/components/schemas/company-config-exchange-rate-line'
        audit:
          $ref: '#/components/schemas/audit'
    company-config-folderRequiredProperties:
      type: object
      required:
        - id
    company-config-folder:
      type: object
      description: Folder for holding one or more attachments.
      properties:
        key:
          type: string
          description: >-
            System-assigned unique key for the folder. Used to identify the folder in URLs or JSON bodies for all operations on the folder.
          readOnly: true
          example: '88'
        id:
          type: string
          description: >-
            Unique name for the folder. Cannot be changed after the folder is created.
          example: 2024 Taxes
        description:
          type: string
          description: Description of the folder.
          example: 2024 tax forms
        parent:
          type: object
          description: Parent folder, for folder hierarchies.
          properties:
            key:
              type: string
              description: Unique key of the parent folder.
              example: '3'
            id:
              type: string
              description: Name of the parent folder.
              example: fld3
            href:
              type: string
              description: Endpoint URL for the parent folder.
              readOnly: true
              example: /objects/company-config/folder/3
        entity:
          type: object
          description: >-
            The entity that the folder is associated with. Attachment folders created at the top level do not have an entity reference so the `key`, `id`, and `name` properties will be `null`.
          properties:
            key:
              description: Entity key.
              type: string
              example: '30'
            id:
              description: Entity ID.
              type: string
              example: SEA
            name:
              description: Entity name.
              type: string
              readOnly: true
              example: Seattle
            href:
              type: string
              description: URL endpoint for the entity.
              readOnly: true
              example: /objects/company-config/entity/30
        href:
          type: string
          description: URL endpoint for the folder.
          readOnly: true
          example: /objects/company-config/folder/1
        status:
          $ref: '#/components/schemas/status'
        audit:
          type: object
          allOf:
            - $ref: '#/components/schemas/audit'
            - type: object
              properties:
                createdDateTime:
                  description: Date-time of the submission.
                  type: string
                  format: date-time
                  example: '2024-04-20T16:20:00Z'
                  readOnly: true
                modifiedDateTime:
                  description: Date-time of the modification.
                  type: string
                  format: date-time
                  example: '2024-04-20T17:40:00Z'
                  readOnly: true
                modifiedBy:
                  description: User who modified this.
                  type: string
                  example: User2
                  readOnly: true
    company-config-document-sequence-get-next-sequence-request:
      description: get-next-sequence request
      type: object
      oneOf:
        - required:
            - key
        - required:
            - id
      properties:
        key:
          type: string
          description: Document sequence key.
          example: '14'
        id:
          type: string
          description: Document sequence ID.
          example: AR Inv
        fiscalYear:
          type: integer
          description: >-
            Fiscal year. If fiscal year rollover is not enabled for the document sequence, this field has no effect.
          example: 2024
    company-config-document-sequence-get-next-sequence-response:
      description: get-next-sequence response
      type: object
      properties:
        key:
          type: string
          description: Document sequence key.
          example: '14'
        id:
          type: string
