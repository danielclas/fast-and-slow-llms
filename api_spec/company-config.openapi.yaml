openapi: 3.0.3
info:
  title: Company and Configuration
  description: >
    This section deals with providing information about a company or setting configurations.  These objects are mainly for system administrators, but end users do interact with some of these.

  version: '1'
servers:
  - url: https://api.intacct.com/ia/api/v1
tags:
  - name: Affiliate entity groups
    description: >-
      A collection of associated entities that form a reporting group. For example, entities E200 and E500 may be associated with the parent entity E100.
    x-displayName: Affiliate entity groups
  - name: Affiliate entities
    description: >
      An affiliate entity is a separate legal entity that is related to another entity, often due to common ownership or control. In Sage Intacct, affiliate entities are a standard dimension based on the list of entities in your Sage Intacct company and used to simplify inter-entity transaction reporting and consolidation reporting. You can use an affiliate entity to indicate a related entity in a transaction. Adding affiliate entities to transactions enables more detailed and rich reporting.


      Because affiliate entities are based on the entities in your company, the affiliate entity dimension is read-only.

    x-displayName: Affiliate entities
  - name: Attachments
    description: >-
      An attachment object contains an array of one more files that are stored in Sage Intacct. You can attach multiple files of any type to a transaction using an attachment, such as scanned images, spreadsheets, and word-processor documents. For example, you might add ten scanned images to a single attachment for a bill. You can also add attachments to some other objects, such as customers, vendors, and employees.


      It's important to note that each transaction or object can only have one attachment assigned to it. After you add an attachment, you can add or delete individual files to and from the attachment, ensuring your supporting documents are always up-to-date.


      All attachments are stored in attachment [folders](/openapi/co/company-config.folder/tag/Attachment-folders). The folder to hold an attachment must exist before you create the attachment. You can also move an attachment to a different folder after it's created.
    x-displayName: Attachments
  - name: Classes
    description: >-
      [Class](https://www.intacct.com/ia/docs/en_US/help_action/Reporting/Setup/Dimensions/Managing_classes/class-information.htm) is a flexible [dimension](https://www.intacct.com/ia/docs/en_US/help_action/Reporting/Setup/Dimensions/dimensions-overview-ns.htm) that can be defined in a company and used to track just about anything. You can rename the class dimension and add custom fields if needed, and then select a class and provide values for the fields in applicable transactions. You can use the data to create custom reports that provide important business insights.


      Note that renaming the class dimension in the UI does not change the name of this object in the API. You still use `class` in API requests.
    x-displayName: Classes
  - name: Contacts
    description: >
      Contacts serve as a common, shared address book that's used across a company by many people for a variety of purposes. Contacts hold all the information needed to contact an individual or business, including name, email address, phone number, mailing address, and more.


      Contacts are almost always used with other Sage Intacct objects, such as vendors, customers, or locations. For example, you specify a contact in Order Entry and Purchasing transactions to set a ship-to, bill-to, pay-to, or return-to addresses, and to determine tax on transactions.

    x-displayName: Contacts
  - name: Department group members
    description: Department group member represents a department in a department group.
    x-displayName: Department group members
  - name: Department groups
    description: >-
      A department group is a specified set of departments, or a set of departments that meet certain criteria. You can use groups to filter or display information in multiple ways, for instance by showing data from only certain departments.
    x-displayName: Department groups
  - name: Departments
    description: >-
      Department is an optional [dimension](https://www.intacct.com/ia/docs/en_US/help_action/Reporting/Setup/Dimensions/dimensions-overview-ns.htm) that can be used for tagging, filtering, and categorizing data in many areas of Sage Intacct.


      The list of departments is shared by all entities in a company. Users can be restricted to only work with and see specific departments, which might affect what data they can see in reports, transactions, and other data records.


      You can create a hierarchy of departments to reflect how departments are organized within a company. To set up a hierarchy, create the parent departments first and then specify a parent department when adding child departments.
    x-displayName: Departments
  - name: Document sequence rollovers
    description: >
      The document sequence rollover configuration holds the next number or alpha values used to generate sequences for each fiscal year. When rollover is enabled for a document sequence, a restart of the document sequence is initiated for each fiscal year.


      If the configuration for a fiscal year is missing, it is automatically generated by the system when the first sequence is generated. When the system generates a configuration, the next number or alpha values from the base start values are used.

    x-displayName: Document sequence rollovers
  - name: Document sequences
    description: >-
      Use document sequencing to generate new IDs automatically for common transactions and records, such as new customers, vendors, invoices, and more. For example, you can create a document sequence for invoices. This new sequence automatically creates a new ID, such as 'INV-0100' and increments the number each time a new invoice is created.


      Note: Document sequences are called "accounting sequences" in the General Ledger.
    x-displayName: Document sequences
  - name: Earning types
    description: >-
      Earning types are a key component in configuring the system to post project labor costs to one or more General Ledger journals. After creating earning types, they must be assigned to employees.
    x-displayName: Earning types
  - name: Email templates
    description: >-
      Use email templates to organize email content and add style to make emails stand out to customers and vendors. You can create a variety of email templates to use for different types of transactions, different vendors, or different customers. You can add merge fields to populate emails with dynamic data from Sage Intacct, such as the vendor name, contact information, and so on.
    x-displayName: Email templates
  - name: Employee bank file setups
    description: >-
      An employee bank file setup contains the information needed to send electronic payments to a specified employee using bank files. Bank files are standard files used by banks to make multiple payments. Bank files are generated in Sage Intacct and then uploaded to the bank's online banking portal and the bank processes the payments with the bank file.
    x-displayName: Employee bank file setups
  - name: Employee rates
    description: >-
      The employee rate object provides information about compensation for a specified employee and date range. The rate can be either hourly or annual.
    x-displayName: Employee rates
  - name: Employee types
    description: >
      Defining and assigning types to different employees allows you to report on and assess the value being delivered to a project, location, or other dimension on a per-employee type basis. Default employee types include:


      - Contractor

      - Full-time

      - Part-time

    x-displayName: Employee types
  - name: Employees
    description: >-
      An employee object represents someone who executes work for a company and is associated with financial transactions such as timesheet entries or expenses. If the employee is also a user in Sage Intacct (which is required if they will be entering time or expenses), the employee and user must be associated with the same Sage Intacct contact.
    x-displayName: Employees
  - name: Entities
    description: >-
      In a multi-entity shared company, entities represent a separate tax identification or a separately secured, fully balancing set of books. Entities typically represent divisions, franchises, affiliates, associations, locations, chapters, self-balancing funds or subsidiaries, with a shared chart of accounts.
    x-displayName: Entities
  - name: Exchange rate lines
    description: Exchange rate line items represent entries in an exchange rate object.
    x-displayName: Exchange rate lines
  - name: Exchange rate types
    description: >-
      An exchange rate type enables an organization to process foreign currency transactions, such as foreign currency invoices and bills, using exchange rates specific to the business requirements. You can use a custom exchange rate type for global consolidation, or to override the standard Intacct daily rate type. See [Exchange rate types](https://www.intacct.com/ia/docs/en_US/help_action/Company/Currencies_and_exchange_rates/Exchange_rate_types/exchange-rate-types.htm) for more information.
    x-displayName: Exchange rate types
  - name: Exchange rates
    description: >-
      A custom exchange rate to convert one currency to another, if a company does not want to use the Intacct Daily Rate. An exchange rate contains an array of lines that each contain an effective start date, rate, and reciprocal rate to be used for transactions.
    x-displayName: Exchange rates
  - name: Attachment folders
    description: >-
      Folders are used to store [attachments](/openapi/co/company-config.attachment/tag/Attachments) for easy grouping. For example, you can create an attachment folder for a project and store every supporting document for the project in that folder.


      Attachment folders can be nested. The folder hierarchy can be as broad or deep as needed.
    x-displayName: Attachment folders
  - name: Get next value
    x-displayName: Get next value
  - name: Dimensions
    description: >-
      Dimensions are a classification system used to organize, sort, and report on company information in meaningful ways. You can think of each dimension as a category with a set of values that you can apply to transactions and entries. Every transaction can be tagged with multiple dimension values to identify and report on it. For example, you can tag transactions with pre-defined locations, and then generate reports to show sales by each location.
    x-displayName: Dimensions
  - name: Location group members
    description: Location group member represents a location in a location group.
    x-displayName: Location group members
  - name: Location groups
    description: >-
      A location group is a specified set of locations, or a set of locations that meet certain criteria. You can use groups to filter or display information in multiple ways, for instance by showing data from only certain locations.
    x-displayName: Location groups
  - name: Locations
    description: >
      Location is a [dimension](https://www.intacct.com/ia/docs/en_US/help_action/Reporting/Setup/Dimensions/dimensions-overview-ns.htm) that is used to represent the geographic locations of offices or facilities, or to represent divisions in a company. Once you have defined some locations, you can set locations on transactions, and that information can be used to provide new insights in reports.


      You can create a hierarchy of locations to reflect how locations are organized within your company.

    x-displayName: Locations
  - name: Permissions
    description: "Permissions enable users to perform a particular function or task within a specific area of the product. For example, a user might have permission within the General Ledger to view financial reports but not to create, edit, or delete them. \n\nA permission specifies a module, such as `accountsPayable`, a specific permission name, such as `vendors`, and the allowed access rights for that permission, such as `list`, `view`, `add`, and `edit`.\n\nYou use [role-permission-assignment objects](/openapi/co/company-config.role-permission-assignment/tag/Role-permission-assignments) to assign permissions to roles.\n"
    x-displayName: Permissions
  - name: Role permission assignments
    description: >
      A role permission assignment shows a single permission and set of access rights for a role. It is an owned object of a [role object](/openapi/co/company-config.role/tag/Roles). You create, update, and delete role permission assignment objects through operations on the owning role.


      Roles are used in companies that have role-based permissions. Companies with user-based permissions do not use roles.

    x-displayName: Role permission assignments
  - name: Role user group maps
    description: "A role user group map associates a role with a user group. A user group can have more than one assigned role. \n\nRoles are used in companies that have role-based permissions. Companies with user-based permissions do not use roles.\n"
    x-displayName: Role user group maps
  - name: Role user maps
    description: >
      A role user map associates a role with a user. It is an owned object of a [role object](/openapi/co/company-config.role/tag/Roles). You create, update, and delete role user maps through operations on the owning role.


      Roles are used in companies that have role-based permissions. Companies with user-based permissions do not use roles.

    x-displayName: Role user maps
  - name: Roles
    description: >
      Roles are used in companies that have role-based permissions. Companies with user-based permissions do not use roles.


      A role is basically a group of permissions. Roles save time and make it easier to assign the same set of permissions to multiple users and to ensure that permissions are consistent across users. Permissions to perform certain tasks are assigned to specific roles, and roles can then be assigned to users or user groups. You use [role-permission-assignment objects](/openapi/co/company-config.role-permission-assignment/tag/Role-permission-assignments) to assign permissions to roles.


      You can define roles for various job functions. For example, you can assign all Accounts Receivable clerks the same role instead of assigning permissions to each of them individually. Or when an employee leaves the company, you can assign their role to their replacement. This ensures that the new employee has the same permissions.


      You can assign more than one role to a user. The user will then have all permissions for each role. For example, you assign Role A and Role B to a user. Role A has permissions that Role B does not. The user has all permissions in Role A plus the ones in Role B. A user can be individually assigned roles and also be part of a group that has a role. The user gets the total permissions from all assigned roles.


      If a company uses role-based permissions, you must assign each user to a role or to a user group that's assigned to a role. If a user does not have an associated role, they will not be able to access applications and features.

    x-displayName: Roles
  - name: User groups
    description: >-
      User groups help you manage the permissions and access of users that have the same roles or responsibilities in a company. After you add a user to a user group, they automatically inherit all permissions and access defined by the roles assigned to that user group. User the user-group-member object to add and delete users from user groups.
    x-displayName: User groups
  - name: Users
    description: >-
      Users are individuals who have access to some part of Sage Intacct. Most users are employees, but users might also be outside the company, such as accountants, attorneys, bankers, vendors, customers, or auditors.


      Any person that wants to log in through the UI or API must have a unique user record.
    x-displayName: Users
paths:
  /objects/company-config/affiliate-entity-group:
    get:
      summary: List affiliate entity groups
      description: >-
        Returns a collection with a key, ID, and link for each affiliate entity group. This operation is mostly for use in testing; use query to find objects that meet certain criteria and to specify properties that are returned.
      tags:
        - Affiliate entity groups
      operationId: list-company-config-affiliate-entity-group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: List of affiliate entity group objects
                properties:
                  ia::result:
                    type: array
                    items:
                      $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata-pages'
              examples:
                List affiliate entity groups:
                  value:
                    ia::result:
                      - key: '3'
                        id: u
                        href: /objects/company-config/affiliate-entity-group/3
                      - key: '1'
                        id: Aff_Grp_USA
                        href: /objects/company-config/affiliate-entity-group/1
                      - key: '2'
                        id: Aff_Group_Other
                        href: /objects/company-config/affiliate-entity-group/2
                    ia::meta:
                      totalCount: 3
                      start: 1
                      pageSize: 100
                      next: null
                      previous: null
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
    post:
      summary: Create an affiliate entity group
      description: Creates a new affiliate entity group.
      tags:
        - Affiliate entity groups
      operationId: create-company-config-affiliate-entity-group
      requestBody:
        description: Creates a new affiliate entity group.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/company-config-affiliate-entity-group'
                - $ref: '#/components/schemas/company-config-affiliate-entity-groupRequiredProperties'
            examples:
              Create an affiliate entity group:
                value:
                  id: Aff_3M
                  name: Aff_Grp_specific
                  description: affiliate group with 3 members
                  groupType: specific
                  groupMembers:
                    - key: '2'
                    - key: '1'
                    - id: GM
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                title: New affiliate-entity-group
                properties:
                  ia::result:
                    $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Reference to new affiliate entity group:
                  value:
                    ia::result:
                      key: '9'
                      id: Aff_3M
                      href: /objects/company-config/affiliate-entity-group/9
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
  /objects/company-config/affiliate-entity-group/{key}:
    parameters:
      - name: key
        description: System-assigned unique key for the affiliate entity group.
        in: path
        required: true
        example: '9'
        schema:
          type: string
    get:
      summary: Get an affiliate entity group
      description: Returns detailed information for a specified affiliate entity group.
      tags:
        - Affiliate entity groups
      operationId: get-company-config-affiliate-entity-group-key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Details of the affiliate entity group
                properties:
                  ia::result:
                    $ref: '#/components/schemas/company-config-affiliate-entity-group'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Get an affiliate entity group:
                  value:
                    ia::result:
                      key: '9'
                      id: Aff_3M
                      name: Aff_Grp_specific
                      description: affiliate group with 3 members
                      groupType: specific
                      audit:
                        createdDateTime: '2025-02-13T19:12:14Z'
                        modifiedDateTime: '2025-02-13T19:12:14Z'
                        createdByUser:
                          key: '1'
                          id: Admin
                          href: /objects/company-config/user/1
                        createdBy: '1'
                        modifiedByUser:
                          key: '1'
                          id: Admin
                          href: /objects/company-config/user/1
                        modifiedBy: '1'
                      groupMembers:
                        - key: '2'
                          id: E200
                          name: India
                          href: /objects/company-config/affiliate-entity/2
                        - key: '1'
                          id: E100
                          name: United States of America
                          href: /objects/company-config/affiliate-entity/1
                        - key: '11'
                          id: E111
                          name: Gulf of Mexico
                          href: /objects/company-config/affiliate-entity/11
                      isDimensionStructure: true
                      memberFilter:
                        object: company-config/affiliate-entity
                        filterExpression: and
                        orderBy:
                          - name: asc
                      href: /objects/company-config/affiliate-entity-group/9
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
    patch:
      summary: Update an affiliate entity group
      description: >-
        Updates an existing affiliate entity group by setting field values. Any fields not provided remain unchanged.
      tags:
        - Affiliate entity groups
      operationId: update-company-config-affiliate-entity-group-key
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/company-config-affiliate-entity-group'
                - type: object
                  properties:
                    id:
                      readOnly: true
            examples:
              Update an affiliate entity group:
                value:
                  name: Aff_Grp_specific
                  description: Affiliate entity group udpated to member 1 only
                  groupType: specific
                  groupMembers:
                    - key: '1'
                      id: '1'
        description: Updates an affiliate entity group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Updated affiliate entity group
                properties:
                  ia::result:
                    $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Reference to updated affiliate entity group:
                  value:
                    ia::result:
                      key: '9'
                      id: Aff_3M
                      href: /objects/company-config/affiliate-entity-group/9
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
    delete:
      summary: Delete an affiliate entity group
      description: Deletes an affiliate entity group.
      tags:
        - Affiliate entity groups
      operationId: delete-company-config-affiliate-entity-group-key
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
  /objects/company-config/affiliate-entity:
    get:
      summary: List affiliate entities
      description: >-
        Returns a collection with a key, ID, and link for each affiliate entity. This operation is mostly for use in testing; use query to find objects that meet certain criteria and to specify properties that are returned.
      tags:
        - Affiliate entities
      operationId: list-company-config-affiliate-entity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: List of affiliate entity objects
                properties:
                  ia::result:
                    type: array
                    items:
                      $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata-pages'
              examples:
                List affiliate entities:
                  value:
                    ia::result:
                      - key: '1'
                        id: '1'
                        href: /objects/company-config/affiliate-entity/1
                      - key: '2'
                        id: '2'
                        href: /objects/company-config/affiliate-entity/2
                      - key: '3'
                        id: '3'
                        href: /objects/company-config/affiliate-entity/3
                    ia::meta:
                      totalCount: 3
                      start: 1
                      pageSize: 100
                      next: null
                      previous: null
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
  /objects/company-config/affiliate-entity/{key}:
    parameters:
      - name: key
        description: System-assigned unique key for the affiliate entity.
        in: path
        required: true
        example: '25'
        schema:
          type: string
    get:
      summary: Get an affiliate entity
      description: Returns detailed information for a specified affiliate entity.
      tags:
        - Affiliate entities
      operationId: get-company-config-affiliate-entity-key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Details of the affiliate entity
                properties:
                  ia::result:
                    $ref: '#/components/schemas/company-config-affiliate-entity'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Get an affiliate entity:
                  value:
                    ia::result:
                      key: '1'
                      id: '1'
                      name: Mariposa LLC
                      status: active
                      audit:
                        createdDateTime: '2016-06-28T00:00:00Z'
                        modifiedDateTime: '2024-12-20T00:00:00Z'
                        createdByUser:
                          key: '1'
                          href: /objects/company-config/user/1
                        createdBy: '1'
                        modifiedByUser:
                          key: '158'
                          href: /objects/company-config/user/158
                        modifiedBy: '158'
                      href: /objects/company-config/affiliate-entity/1
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
  /objects/company-config/attachment:
    get:
      summary: List attachments
      description: >
        Returns a collection with a key, ID, and link for each attachment. This operation is mostly for use in testing; use the query service to find attachments that meet certain criteria and specify the properties that are returned.

      tags:
        - Attachments
      operationId: list-company-config-attachment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: List of attachment objects
                properties:
                  ia::result:
                    type: array
                    items:
                      $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata-pages'
              examples:
                List attachments:
                  value:
                    ia::result:
                      - key: '8'
                        id: PROJ-159
                        href: /objects/company-config/attachment/8
                      - key: '1'
                        id: INVOICES
                        href: /objects/company-config/attachment/1
                      - key: '2'
                        id: 2024 Taxes
                        href: /objects/company-config/attachment/2
                    ia::meta:
                      totalCount: 3
                      start: 1
                      pageSize: 100
                      next: null
                      previous: null
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
    post:
      summary: Create an attachment
      description: >-
        Creates a new attachment in a specified folder. The folder must exist before you create the attachment. You can add files when you create an attachment, or use a PATCH request to add files later.
      tags:
        - Attachments
      operationId: create-company-config-attachment
      requestBody:
        description: Attachment to create
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/company-config-attachment'
                - $ref: '#/components/schemas/company-config-attachmentRequiredProperties'
            examples:
              Create an empty attachment:
                value:
                  id: 2024 Tax
                  name: 2024 Tax Forms
                  folder:
                    key: '27'
              Create an attachment that contains a file:
                value:
                  id: attach-02
                  name: Short text file
                  folder:
                    key: '1'
                  files:
                    - name: short file.txt
                      data: aGVsbG8gd29ybGQhIHRoaXMgaXMgYmFzZTY0IGVuY29kZWQgZGF0YQ==
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                title: Reference to new attachment
                properties:
                  ia::result:
                    $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Reference to new attachment:
                  value:
                    ia::result:
                      key: '17'
                      id: 2022 Tax
                      href: /objects/company-config/attachment/17
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
  /objects/company-config/attachment/{key}:
    parameters:
      - name: key
        description: System-assigned key for the attachment.
        in: path
        required: true
        example: '43'
        schema:
          type: string
    get:
      summary: Get an attachment
      description: >-
        Returns detailed information for a specified attachment, including Base64-encoded versions of all files in the attachment.
      tags:
        - Attachments
      operationId: get-company-config-attachment-key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Details of the attachment
