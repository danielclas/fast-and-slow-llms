    company-config-department-group:
      type: object
      description: >-
        A specified set of departments, or a set of departments that meet certain criteria.
      properties:
        key:
          type: string
          description: System-assigned unique key for the department group.
          readOnly: true
          example: '46'
        id:
          type: string
          description: >-
            Department group ID. Displayed together with the group name in Sage Intacct (_ID_--_Name_). Department group IDs cannot be changed after the group has been created.
          example: SA01
        href:
          type: string
          description: URL endpoint for the department group.
          readOnly: true
          example: /objects/company-config/department-group/46
        name:
          type: string
          description: >-
            Department group name. Displayed together with the group ID in Sage Intacct (_ID_--_Name_).
          example: Sales
        description:
          type: string
          description: Description of the department group.
          example: All sales groups
        groupType:
          type: string
          description: "Group membership type. The group type and related fields determine which departments are included in the group. If you are creating reports that use departments in rows or columns, these fields also determine the column headings and row headings that will appear, and the order in which they will be listed.\n\n* `specific` - Specify the departments to include and their order in the `groupMembers` array. You can optionally filter the array with the `memberFilter` settings.\n* `all` - All departments that match the `memberFilter` criteria. \n"
          example: specific
          enum:
            - all
            - specific
          default: all
        memberFilter:
          type: object
          description: >-
            One or more filters to select the departments to include in the department group. Can be used in addition to the `groupMembers` array to filter from a selected list of departments.
          allOf:
            - $ref: '#/components/schemas/member-filter'
            - type: object
        groupMembers:
          type: array
          description: >-
            Members of the department group and their sort order. Only applicable when `groupType` = `specific`.
          items:
            $ref: '#/components/schemas/company-config-department-group-member'
        isDimensionStructure:
          type: boolean
          description: >-
            Indicates whether a dimension structure is created from the group. If true, the group can be added to the rows or columns of a financial report.
          default: false
          example: false
        audit:
          $ref: '#/components/schemas/audit'
