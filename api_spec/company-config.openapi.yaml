components:
  schemas:
    company-config-affiliate-entity-groupRequiredProperties:
      type: object
      required:
        - id
        - name
    object-reference:
      type: object
      description: Reference to created or updated object
      properties:
        key:
          type: string
          example: '12345'
        id:
          type: string
          example: ID123
        href:
          type: string
          readOnly: true
          example: /objects/<application>/<name>/12345
    metadata-pages:
      description: Metadata for collection response
      type: object
      properties:
        totalCount:
          type: integer
          description: Total count
          readOnly: true
          example: 3
        start:
          type: integer
          description: Start element number
          readOnly: true
          example: 1
        pageSize:
          type: integer
          description: Page size
          readOnly: true
          example: 100
        next:
          type: integer
          description: Next element number
          readOnly: true
          nullable: true
          example: 101
        previous:
          type: integer
          description: Previous element number
          readOnly: true
          nullable: true
          example: null
    metadata:
      description: Metadata for response
      type: object
      properties:
        totalCount:
          type: integer
          description: Total count
          readOnly: true
          example: 3
        totalSuccess:
          type: integer
          description: Total success
          readOnly: true
          example: 2
        totalError:
          type: integer
          description: Total errors
          readOnly: true
          example: 1
    error-response:
      type: object
      description: Error response
      properties:
        ia::result:
          type: object
          properties:
            ia::error:
              type: object
              properties:
                code:
                  type: string
                  example: invalidRequest
                message:
                  type: string
                  example: Payload contains errors
                supportId:
                  type: string
                  example: sQrM9%7EYdh5oDEWVb80mrn9xuHjoAAAABBQ
                errorId:
                  type: string
                  example: REST-1064
                additionalInfo:
                  type: object
                  properties:
                    messageId:
                      type: string
                      example: IA.PAYLOAD_CONTAINS_ERRORS
                    placeholders:
                      type: object
                      example: {}
                    propertySet:
                      type: object
                      example: {}
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalidRequest
                      message:
                        type: string
                        example: /newDate is not a valid field
                      errorId:
                        type: string
                        example: REST-1043
                      target:
                        type: string
                        example: /newDate
                      additionalInfo:
                        type: object
                        properties:
                          messageId:
                            type: string
                            example: IA.NOT_A_VALID_FIELD
                          placeholders:
                            type: object
                            example: {}
                          propertySet:
                            type: object
                            example: {}
            ia::meta:
              $ref: '#/components/schemas/metadata'
      example:
        ia::result:
          ia::error:
            code: invalidRequest
            message: A POST request requires a payload
            errorId: REST-1028
            additionalInfo:
              messageId: IA.REQUEST_REQUIRES_A_PAYLOAD
              placeholders:
                OPERATION: POST
              propertySet: {}
            supportId: Kxi78%7EZuyXBDEGVHD2UmO1phYXDQAAAAo
        ia::meta:
          totalCount: 1
          totalSuccess: 0
          totalError: 1
    member-filter:
      description: Member filter.
      type: object
      properties:
        object:
          type: string
          description: Object type to filter on.
          example: accounts-payable/vendor
        filters:
          type: array
          description: >-
            Filters to select the records to return based on their field values. You use operators and conditions to build your filter, such as `{"$eq":{"status":"active"}}` to select records in which `status` is equal to "active".
          example:
            - $eq:
                status: active
            - $gt:
                totalDue: '1000'
            - $contains:
                name: Acme
          items:
            anyOf:
              - title: equal
                type: object
                description: Field value must be equal to this specified value.
                properties:
                  $eq:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                          nullable: true
                        - type: integer
                          nullable: true
                        - type: number
                          nullable: true
                        - type: boolean
                example:
                  $eq:
                    status: active
              - title: not equal
                type: object
                description: Field value must not be equal to this specified value.
                properties:
                  $ne:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                          nullable: true
                        - type: integer
                          nullable: true
                        - type: number
                          nullable: true
                        - type: boolean
                example:
                  $ne:
                    status: inactive
              - title: less than
                type: object
                description: Field value must be less than this specified value.
                properties:
                  $lt:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $lt:
                    totalDue: '100'
              - title: less than or equal
                type: object
                description: >-
                  Field value must be less than or equal to this specified value.
                properties:
                  $lte:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                        - type: boolean
                example:
                  $lte:
                    totalDue: '500'
              - title: greater than
                type: object
                description: Field value must be greater than this specified value.
                properties:
                  $gt:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $gt:
                    totalDue: '1000'
              - title: greater than or equal
                type: object
                description: >-
                  Field value must be greater than or equal to this specified value.
                properties:
                  $gte:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                        - type: boolean
                example:
                  $gte:
                    totalDue: '999'
              - title: in
                type: object
                description: Field value is one of the specified values.
                properties:
                  $in:
                    type: object
                    description: >-
                      The field name and list of values to be compared with object values.
                    additionalProperties:
                      type: array
                      items:
                        oneOf:
                          - type: string
                          - type: integer
                          - type: number
                          - type: boolean
                example:
                  $in:
                    firstName:
                      - Tim
                      - Anjali
                      - Gabriel
              - title: not in
                type: object
                description: Field value is not one of the specified values.
                properties:
                  $notIn:
                    type: object
                    description: >-
                      The field name and list of values to be compared with object values.
                    additionalProperties:
                      type: array
                      items:
                        oneOf:
                          - type: string
                          - type: integer
                          - type: number
                          - type: boolean
                example:
                  $notIn:
                    country:
                      - United States
                      - Canada
              - title: contains
                type: object
                description: >-
                  Field value contains the given string or number. Cannot be used with date fields.
                properties:
                  $contains:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $contains:
                    name: Acme
              - title: does not contain
                type: object
                description: >-
                  Field value does not contain the given string or number. Cannot be used with date fields.
                properties:
                  $notContains:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $notContains:
                    name: llc
              - title: starts with
                type: object
                description: >-
                  Field value starts with this string or number. Cannot be used with date fields.
                properties:
                  $startsWith:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $startsWith:
                    name: A
              - title: does not start with
                type: object
                description: >-
                  Field value does not start with this string or number. Cannot be used with date fields.
                properties:
                  $notStartsWith:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $notStartsWith:
                    name: Q
              - title: ends with
                type: object
                description: >-
                  Field value ends with this string or number. Cannot be used with date fields.
                properties:
                  $endsWith:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $endsWith:
                    name: inc
              - title: does not end with
                type: object
                description: >-
                  Field value does not end with this string or number. Cannot be used with date fields.
                properties:
                  $notEndsWith:
                    type: object
                    description: >-
                      The field name and value to be compared with object values.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: integer
                        - type: number
                example:
                  $notEndsWith:
                    name: llc
        filterExpression:
          description: >
            Logical operators to apply when there are multiple filter conditions. The conditions in the `filters` array are implicitly numbered starting at 1. Supports `and`, `or`, and grouping with parentheses.


            Shortcuts:

            + `and` by itself means that all conditions must be true.

            + `or` by itself means that at least one condition must be true.

          type: string
          example: (1 and 2) or 3
          default: and
        orderBy:
          description: >-
            Sort order for the results that match the `filters` when the group is displayed in reports. The entry consists of a field name to sort by and whether it should be sorted in ascending or descending order.
          type: array
          maxItems: 1
          items:
            type: object
            title: field name and sort order
            additionalProperties:
              type: string
              enum:
                - asc
                - desc
          example:
            - id: asc
        size:
          description: >-
            The maximum number of records that match the `filters` to include in the group when it is displayed in reports.
          type: integer
          example: 100
