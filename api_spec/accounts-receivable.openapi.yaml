          properties:
            href:
              type: string
              description: URL endpoint for the summary.
              readOnly: true
              example: /objects/accounts-receivable/summary/280
            key:
              type: integer
              description: System-assigned key to uniquely identify the summary.
              example: 280
            id:
              type: string
