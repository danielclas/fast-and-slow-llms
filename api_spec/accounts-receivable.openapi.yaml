        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                title: New invoice
                properties:
                  ia::result:
                    $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                New invoice:
                  value:
                    ia::result:
                      id: '2091'
                      key: '2091'
                      href: /objects/accounts-receivable/invoice/2091
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
