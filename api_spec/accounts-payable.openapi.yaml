                    - memo: DNO Recurring Bill line 01
                      glAccount:
                        id: '6000'
                      baseAmount: '120'
                      hasForm1099: 'false'
                      currency:
                        txnCurrency: USD
                        baseCurrency: AUD
                      txnAmount: '150'
                    - memo: DNO Recurring Bill line 02
