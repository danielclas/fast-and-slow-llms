    accounts-payable-bill-summary:
      type: object
      description: >-
        Accounts Payable (AP) summaries are collections of the same type of transactions, grouped together for processing.
      properties:
        key:
          type: string
          description: System-assigned key for the bill summary.
          readOnly: true
          example: '1'
        id:
          type: string
          description: >-
            Unique identifier for the bill summary. This value is the same as the `key` for this object.
          readOnly: true
          example: '1'
        href:
          type: string
          description: URL endpoint for the bill summary.
          readOnly: true
          example: /objects/accounts-payable/bill-summary/1
        name:
          type: string
          description: >-
            Name of the bill summary. This name is used to identify the summary throughout the Accounts Payable application.
          example: Bill Batch Jan 2021
        summaryCreationType:
          type: string
          enum:
            - system
            - manual
          description: >-
            Specifies the creation type of the bill summary. If set to `manual`, the summary was created by a user. If set to `system`, the summary was automatically created by Intacct based on the specified summary frequency.
          default: manual
          example: manual
          readOnly: true
        status:
          $ref: '#/components/schemas/status'
        recordType:
          $ref: '#/components/schemas/record-type'
          description: The bill summary type.
          readOnly: true
          example: apBill
        totalAmount:
          type: string
          format: decimal-precision-2
          description: The bill summary total amount.
          readOnly: true
          example: '656.82'
        parent:
          type: object
          description: Parent bill summary.
          properties:
            key:
              type: string
              description: System-assigned key for the parent bill summary.
              example: '22'
              nullable: true
            id:
              type: string
              description: >-
                Unique identifier for the parent bill summary. This value is the same as the `key` for this object.
              example: '22'
              nullable: true
            href:
              type: string
              description: URL endpoint for the bill summary.
              readOnly: true
              example: /objects/accounts-payable/summary/22
        preventGLPosting:
          type: boolean
          description: Specifies whether to allow posting to the general ledger (GL).
          default: false
          readOnly: true
          example: true
        bankAccount:
          type: object
          description: Bank account.
          properties:
            key:
              type: string
              description: System-assigned key for the bank account.
              example: BOA
              nullable: true
            id:
              type: string
              description: >-
                Identifier for the bank account. This value is the same as the `key` for this object.
              example: BOA
              nullable: true
            href:
              type: string
              description: URL endpoint for the bank account.
              readOnly: true
              example: /objects/cash-management/bank-account/23
        glPostingDate:
          type: string
          format: date
          description: >-
            The date that the items in the bill summary should post to the general ledger.
          example: '2022-08-02'
          readOnly: true
        state:
          type: string
          enum:
            - open
            - closed
          description: >-
            State of the bill summary, which can be `open` or `closed`. An open bill summary can have items added to it.
          example: open
        isQuickPaymentSummary:
          type: boolean
          description: >-
            This field is set to `true` only for manual and quick payment summaries. It is set to `false` for transactions of type bill/adjustment.
          default: false
          example: false
        isSummaryOpen:
          type: string
          description: >-
            A summary can be open or closed. Items, such as invoices, can be added to open summaries.
          enum:
            - open
            - closed
          example: open
          default: open
          readOnly: true
        isSummaryPosted:
          type: boolean
          description: If `true`, the summary has been posted to the General Ledger.
          readOnly: true
          example: false
    accounts-payable-joint-payeeRequiredProperties:
      type: object
      required:
        - name
