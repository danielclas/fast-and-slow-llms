          type: string
          description: "Approval state when vendor approval is enabled.\n* `s` - submitted - The vendor record is new or was updated and is now awaiting approval. Accounts Payable and Purchasing transactions for the vendor can be saved as drafts but cannot be posted.\n* `a` - approved - The vendor has been approved. You can post Accounts Payable and Purchasing transactions for the vendor. \n* `r` - declined - The vendor was declined during the approval process. Until the vendor is approved, you cannot post Accounts Payable or Purchasing transactions for the vendor. \n"
          example: s
          default: a
          enum:
            - s
            - a
            - r
        vendorType:
          type: object
          description: >-
            Optional vendor type, which is a category of vendors used for reporting purposes. Valid values include any vendor type ID defined by the company.
          properties:
            key:
              type: string
              description: Unique key for the vendor type.
              nullable: true
              example: '12'
            id:
              type: string
              description: Unique ID for the vendor type.
              nullable: true
              example: Wholesaler
            href:
              type: string
              description: URL endpoint for the vendor type.
              readOnly: true
              example: /objects/accounts-payable/vendor-type/12
        parent:
          type: object
          description: >-
            If the vendor is a subsidiary of another vendor, parent vendor of the subsidiary vendor.
          properties:
            key:
              type: string
              description: Unique key for the vendor.
              nullable: true
              example: '500'
            id:
              type: string
              description: Unique ID for the vendor.
              example: 202
              nullable: true
            name:
              type: string
              description: Name of the vendor.
              readOnly: true
              nullable: true
              example: Pac Bell
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/500
        accountGroup:
          type: object
          description: General Ledger (GL) account group that the vendor is part of.
          properties:
            key:
              type: string
              description: Unique key for the vendor account group.
              nullable: true
              example: '8'
            id:
              type: string
              description: Unique ID for the vendor account group.
              nullable: true
              example: OR151
            href:
              type: string
              description: URL endpoint for the vendor account group.
              readOnly: true
              example: /objects/purchasing/vendor-gl-group/8
        accountlabel:
