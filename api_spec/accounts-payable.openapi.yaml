                      title: tax
                      properties:
                        isTaxable:
                          type: boolean
                          description: Defines whether the contact is taxable.
                          default: false
                          example: false
                        group:
                          type: object
                          description: Tax group for the contact.
                          properties:
                            key:
                              type: string
                              description: Unique key for the tax group.
                              example: '6'
                            id:
                              type: string
                              description: Unique ID for the tax group.
                              example: New York
                            href:
                              type: string
                              description: URL endpoint for the tax group.
                              readOnly: true
                              example: /objects/tax/contact-tax-group/6
                    electronicInvoiceDetails:
                      type: object
                      description: >-
                        For businesses operating in France, the following fields are required to comply with local electronic invoicing regulations.
                      properties:
                        legalCategory:
                          type: string
                          description: >-
                            Identifies the type of organization under French law, encompassing various recognized forms for both private and public entities.
                          example: 24 Fiduciary
                        mainActivity:
                          type: string
                          description: >-
                            Specifies the primary economic activities the business engages in, helping classify the nature of operations.
