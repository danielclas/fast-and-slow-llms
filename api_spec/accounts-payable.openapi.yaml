                  properties:
                    key:
                      type: string
                      description: System-assigned key for the department.
                      example: '1'
                      nullable: true
                    id:
                      type: string
                      description: >-
                        Unique identifier for the department. This value is the same as the `key` for this object.
                      example: '1'
                      nullable: true
                    name:
                      type: string
                      description: The name of the department assigned to the transaction.
                      readOnly: true
                      example: Accounting
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the department.
                      readOnly: true
                      example: /objects/company-config/department/1
                location:
                  type: object
                  description: Location to assign the expense to.
                  properties:
                    key:
                      type: string
                      description: System-assigned key for the location.
                      example: '10'
                      nullable: true
                    id:
                      type: string
                      description: Unique identifier for the location.
                      example: '1'
                      nullable: true
                    name:
                      type: string
                      description: The name of the location assigned to the transaction.
                      readOnly: true
                      example: India
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the location.
                      readOnly: true
                      example: /objects/company-config/location/1
        memo:
          type: string
          description: >-
            Additional notes or comments about the advance line item for reference.
          example: Service charges
          nullable: true
        currency:
          type: object
          description: Currency details for multi-currency companies.
          properties:
            baseCurrency:
              type: string
              description: Base currency for the AP advance line.
              readOnly: true
              example: USD
            txnCurrency:
              type: string
              description: The currency used for the transaction.
              readOnly: true
              example: GBP
            exchangeRate:
              type: object
              title: exchangeRate
              description: Exchange rate details used to calculate the base amount.
              properties:
                date:
                  type: string
                  format: date
                  example: '2021-01-23'
                  description: >-
                    Exchange rate date for this transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
                  readOnly: true
                  nullable: true
                rate:
                  type: string
                  description: >-
                    Exchange rate used to calculate the base amount from the transaction amount.
                  readOnly: true
                  example: '1.0789'
                  nullable: true
                typeId:
                  type: string
                  description: >-
                    The type of exchange rate used to calculate the base amount from the transaction amount.
                  readOnly: true
                  example: '-1'
                  nullable: true
              readOnly: true
          readOnly: true
        lineNumber:
          type: integer
          description: Line number
          readOnly: true
          example: 1
        paymentInformation:
          type: object
          description: Payment information for the AP advance line item.
          properties:
            totalPaid:
              type: string
              format: decimal-precision-2
              description: The total amount paid in the base currency for the line item.
              readOnly: true
              example: '100'
            txnTotalPaid:
              type: string
              format: decimal-precision-2
              description: >-
                The total amount paid for the line item in the transaction currency.
              readOnly: true
              example: '200'
            totalSelected:
              type: string
              format: decimal-precision-2
              description: >-
                The total amount selected in the base currency for the line item.
              readOnly: true
              example: '100'
            txnTotalSelected:
              type: string
              format: decimal-precision-2
              description: >-
                The total amount selected in the transaction currency for the line item.
              readOnly: true
              example: '100'
          readOnly: true
        baseLocation:
          type: object
          description: Base location for the line item.
          allOf:
            - $ref: '#/components/schemas/location-ref'
            - type: object
              properties:
                key:
                  type: string
                  description: Base location key.
                  example: '4'
        accountLabel:
          type: object
          description: Meaningful name of the account.
          properties:
            key:
              type: string
              description: System-assigned key for the account label.
              example: '14'
              nullable: true
            id:
              type: string
              description: Unique identifier for the account label.
              example: Accounting Fees
              nullable: true
            href:
              type: string
              readOnly: true
              example: /objects/accounts-payable/account-label/14
        apAdvance:
          type: object
          description: Header level details for the AP advance's line items.
          properties:
            href:
              type: string
              description: URL endpoint for the AP advance.
              readOnly: true
              example: /objects/apadvance/23
            id:
              type: string
              description: Unique identifier for the AP advance.
              readOnly: true
              example: '1'
            key:
              type: string
              description: >-
                System-assigned key for the AP advance. This value is the same as the `key` for this object.
              example: '1'
            recordType:
              type: string
              description: Record type. AP advances have a record type of `pa`.
              readOnly: true
              example: pa
          readOnly: true
        glAccount:
          $ref: '#/components/schemas/gl-account-ref'
        audit:
          $ref: '#/components/schemas/audit.s1'
    accounts-payable-advance:
      type: object
      description: Header information for AP advance transactions.
      properties:
        key:
          type: string
          description: System-assigned unique key for the AP advance.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            Unique identifier for the AP advance. This value is the same as the `key` for this object.
          readOnly: true
          example: '23'
        recordType:
          type: string
          description: >-
            Record type to identify the type of transaction. AP advances have a record type of `pa`.
          readOnly: true
          example: pa
        href:
          type: string
          description: URL endpoint for the AP advance.
          readOnly: true
          example: /objects/accounts-payable/advance/23
        paymentMethod:
          type: string
          description: >-
            Payment method for the AP advance. A payment method for AP advances defines how funds are transferred to a vendor, which determines the approval process and workflow steps needed to complete the advance payment.
          example: printedCheck
          enum:
            - printedCheck
            - creditCard
            - eft
            - cash
            - ach
        referenceNumber:
          type: string
          description: >-
            A number, such as a purchase order or account number, useful for searches or reports. This number appears on the GL Details report and is printed on checks and vendor stubs.
          example: INV-902852
          nullable: true
        description:
          type: string
          description: Description of the AP advance.
          nullable: true
          example: >-
            Computer Hardware & Software Expenses 03/01/20 - 08/31/21 Subscription charges.
        advanceSummary:
          type: object
          description: >-
            Summary details for this advance. Summaries are collections of the same types of transactions grouped together for processing.
          readOnly: true
          properties:
            key:
              type: string
              description: System-assigned key for the summary.
              readOnly: true
              example: '399'
            id:
              type: string
              description: Identifier for the summary.
              readOnly: true
              example: '399'
            href:
              type: string
              description: URL endpoint of the adjustment summary.
              readOnly: true
              example: /objects/accounts-payable/summary/399
        state:
          type: string
          description: >-
            Processing state of the AP advance.

            The state can be modified through workflow operations like Submit and Reverse, but cannot be changed using the PATCH operation.
          enum:
            - draft
            - inProcess
            - pendingApproval
            - partiallyApproved
            - declined
            - fullyApplied
            - partiallyApplied
            - advancePaid
            - void
            - voided
          example: draft
          default: draft
        totalEntered:
          type: string
          format: decimal-precision-2
          description: Total amount of the AP advance.
          readOnly: true
          example: '100.20'
        txnTotalEntered:
          type: string
          format: decimal-precision-2
          description: Total transaction amount entered.
          readOnly: true
          example: '1000.20'
        advanceDate:
          type: string
          format: date
          example: '2021-01-23'
          description: Date the advance payment was made.
        paymentInformation:
          type: object
          description: Payment information for the AP advance.
          readOnly: true
          properties:
            paidDate:
              type: string
              format: date
              example: '2021-01-23'
              description: Date the AP advance was paid.
              readOnly: true
            totalPaid:
              type: string
              format: decimal-precision-2
              description: Total amount paid for the AP advance.
              readOnly: true
              example: '100'
            totalSelected:
              type: string
              format: decimal-precision-2
              description: Total amount selected for the AP advance.
              readOnly: true
              example: '100.10'
            txnTotalSelected:
              type: string
              format: decimal-precision-2
              description: The total transaction amount selected for payment.
              readOnly: true
              example: '1000.05'
            txnTotalPaid:
              type: string
              format: decimal-precision-2
              description: The total transaction amount paid.
              readOnly: true
              example: '2000.50'
        totalDue:
          type: string
          format: decimal-precision-2
          description: >-
            For multi-currency companies, the transaction amount in the base currency.
          readOnly: true
          example: '251464.01'
        txnTotalDue:
          type: string
          format: decimal-precision-2
          description: Total transaction amount due for the AP advance.
          readOnly: true
          example: '10'
        location:
          $ref: '#/components/schemas/location-ref'
        dueDate:
          type: string
          format: date
          example: '2021-01-23'
          description: Due date for the AP advance.
        financialEntity:
          type: object
          description: Financial account from which the reconciliation is done.
          properties:
            id:
              type: string
              description: Account number or other unique identifier for the bank account.
              example: BOA
        reconciliationGroup:
          type: object
          properties:
            clearingDate:
              type: string
              format: date
              description: >-
                The date when reconciliation is completed. This value is automatically populated.
              example: '2021-01-23'
              nullable: true
            cleared:
              type: string
              enum:
                - 'true'
                - 'false'
                - matched
              description: Indicates the reconciliation status.
              default: 'false'
              example: 'false'
        isSystemGenerated:
          type: string
          description: >-
            Indicates whether the advance record is created by the system. A value of `true` means it is system-generated and not based on user input.
          example: 'true'
          default: 'false'
          enum:
            - 'true'
            - 'false'
        currency:
          type: object
          description: Currency details for this AP advance.
          properties:
            baseCurrency:
              type: string
              description: Base currency for the AP advance.
              example: USD
            txnCurrency:
              type: string
              description: >-
                The transaction currency to use for this advance. If this currency is different from the base currency, provide an exchange rate.
              example: USD
            exchangeRate:
              type: object
              description: Exchange rate details used to calculate the base amount.
              title: exchangeRate
              properties:
                date:
                  type: string
                  format: date
                  example: '2021-01-23'
                  description: >-
                    Exchange rate date for this transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
                  nullable: true
                rate:
                  type: number
                  description: >-
                    Exchange rate used to calculate the base amount from the transaction amount.
                  example: 1.0789
                  nullable: true
                typeId:
                  type: string
                  description: >-
                    The type of exchange rate used to calculate the base amount from the transaction amount.
                  example: '1'
                  nullable: true
        attachment:
          type: object
          description: Supporting document ID for this attachment.
          properties:
            key:
              type: string
              example: '21'
              nullable: true
            id:
              type: string
              example: Sales01
              nullable: true
            href:
              type: string
              readOnly: true
              example: /objects/company-config/attachment/21
        vendor:
          type: object
          description: Vendor associated with the AP advance.
          properties:
            id:
              type: string
              description: Unique identifier for the vendor.
              example: Vendor_01
            key:
              type: string
              description: System-assigned unique key for the vendor.
              example: '15'
            name:
              type: string
              description: Name of the vendor.
              example: Logic Solutions
            totalDue:
              type: string
              format: decimal-precision-2
              description: Total amount due to the vendor for the transaction.
              readOnly: true
              example: '100'
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/15
        lines:
          type: array
          description: Line items of the advance.
          items:
            $ref: '#/components/schemas/accounts-payable-advance-line'
        audit:
          readOnly: true
          type: object
          allOf:
            - $ref: '#/components/schemas/audit.s1'
            - type: object
              properties:
                createdDateTime:
                  type: string
                  description: Time of the submission.
                  format: date-time
                  example: '2024-01-23T11:28:12Z'
                  readOnly: true
        entity:
          $ref: '#/components/schemas/entity-ref'
    accounts-payable-advance-lineRequiredProperties:
      type: object
      required:
        - apAdvance
        - txnAmount
        - accountLabel
      properties:
        dimensions:
          type: object
          required:
            - location
    accounts-payable-billRequiredProperties:
      type: object
      required:
        - dueDate
        - createdDate
      properties:
        vendor:
          type: object
          required:
            - id
        currency:
          type: object
          required:
            - txnCurrency
        lines:
          type: array
          items:
            required:
              - txnAmount
              - glAccount
            properties:
              dimensions:
                type: object
                required:
                  - location
    accounts-payable-bill-tax-entry:
      type: object
      description: For VAT enabled transactions, bill line items will have tax entries.
      allOf:
        - title: Tax entries
          description: Tax entries for line items.
          type: object
          properties:
            key:
              type: string
              description: System-assigned key for the tax entry.
              example: '7149'
              readOnly: true
            id:
              type: string
              description: Unique identifier for the tax entry.
              example: '7149'
              readOnly: true
            baseTaxAmount:
              type: string
              description: Base tax amount.
              format: decimal-precision-2
              example: '100.00'
            txnTaxAmount:
              type: string
              description: >-
                Transaction tax amount. For a PATCH request, set to `null` if you want Sage Intacct to recalculate the amount, or set to the value you want if you don't want the system to recalculate.
              format: decimal-precision-2
              example: '100.00'
            taxRate:
              type: number
              description: Tax rate.
              example: 1.0299
        - type: object
          properties:
            purchasingTaxDetail:
              type: object
              description: Purchasing tax details associated with the bill tax entry.
              properties:
                key:
                  type: string
                  description: Unique key for the Purchasing tax detail.
                  example: '1'
                id:
                  type: string
                  description: Unique identifier for the Purchasing tax detail.
                  example: Alaska Tax Detail
                href:
                  type: string
                  description: URL endpoint for the Purchasing tax detail.
                  readOnly: true
                  example: /objects/tax/purchasing-tax-detail/1
            billLine:
              title: bill-line
              description: Line item that the tax entries are associated with.
              readOnly: true
              type: object
              properties:
                id:
                  type: string
                  description: >-
                    Unique identifier for the bill line. This value is the same as the `key` for this object.
                  example: '100'
                  readOnly: true
                key:
                  type: string
                  description: Unique key for the bill line.
                  example: '100'
                  readOnly: true
                href:
                  type: string
                  description: URL endpoint for the bill line.
                  readOnly: true
                  example: /objects/accounts-payable/bill-line/100
            isPartialExemption:
              type: boolean
              description: >
                If `true`, this entry is eligible for partial exemption, which separates the recoverable and non-recoverable portions of the input value added tax (VAT).

              example: true
              default: false
    accounts-payable-bill-line:
      type: object
      description: Line items for an Accounts Payable (AP) bill.
      properties:
        id:
          type: string
          description: System-assigned ID for the line item.
          readOnly: true
          example: '62'
        key:
          type: string
          description: System-assigned key for the line item.
          example: '62'
        href:
          type: string
          description: URL endpoint for the AP bill line.
          readOnly: true
          example: /objects/accounts-payable/bill-line/1955
        lineNumber:
          type: string
          description: Number of the AP bill line.
          readOnly: true
          example: '1'
        hasForm1099:
          type: string
          description: >
            If the vendor is set up for 1099 tracking and enabled for 1009 flag override, you can set to `true` to enable individual line items for 1099 treatment. If `false`, this line item does not have associated 1099 form type and box values.

          example: 'false'
        form1099:
          type: object
          description: Form 1099 information for the line item.
          properties:
            type:
              type: string
              description: |
                Type of form 1099.
              example: NEC
              nullable: true
            box:
              type: string
              description: |
                Box value of form 1099.
              example: 15A
              nullable: true
        createdDate:
          type: string
          format: date
          example: '2021-01-23'
          description: Date the line item was created.
          readOnly: true
        billNumber:
          type: string
          description: >
            Vendor-assigned identifier for the bill.

            This is the vendor-assigned number provided on the bill. This number is unique and can be used to look up bill details.

            You must specify a bill number when creating a bill unless document sequencing is configured, in which case the number is auto-generated.

          example: Bill-001
          nullable: true
        vendor:
          type: object
          description: Vendor to which this bill is linked.
          properties:
            key:
              type: string
              description: System-assigned key for the vendor.
              example: '15'
            id:
              type: string
              description: Unique identifier of the vendor.
              example: V-00014
            name:
              type: string
              description: Name of the vendor.
              readOnly: true
              example: Pac bell
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/15
        glAccount:
          type: object
          description: General Ledger (GL) account associated with the line item.
          properties:
            key:
              type: string
              description: System-assigned key for the GL account.
              example: '256'
            id:
              type: string
              description: User-assigned number for the GL account.
              example: '6252'
            name:
              type: string
              description: Name of the GL account.
              readOnly: true
              example: Entertainment
            href:
              type: string
              description: URL endpoint for the GL account.
              readOnly: true
              example: /objects/general-ledger/account/256
        overrideOffsetGLAccount:
          type: object
          description: >-
            An alternative account to override the default GL AP account for the bill.
          properties:
            key:
              type: string
              description: System-assigned key for the account.
              example: '384'
            id:
              type: string
              description: Offset account number.
              example: '1234.36'
            name:
              type: string
              description: Offset account name.
              readOnly: true
              example: AP ACCOUNT
            href:
              type: string
              description: URL endpoint for the account.
              readOnly: true
              example: /objects/general-ledger/account/384
        accountLabel:
          type: object
          description: AP account label associated with the line item.
          properties:
            key:
              type: string
              description: System-assigned key for the account label.
              example: '14'
              nullable: true
            id:
              type: string
              description: Meaningful name for the account.
              example: Accounting Fees
              nullable: true
            href:
              type: string
              description: URL endpoint for the account label.
              readOnly: true
              example: /objects/accounts-payable/account-label/14
        billAmount:
          type: string
          format: decimal-precision-2
          description: >-
            Amount for the line item in your company's base currency, which is calculated based on the exchange rate defined in the header.
          readOnly: true
          example: '100.00'
        baseAmount:
          type: string
          format: decimal-precision-2
          description: >-
            Amount for the line item in your company's base currency, which is calculated based on the exchange rate defined in the header.
          readOnly: true
          example: '100.00'
        txnAmount:
          type: string
          format: decimal-precision-2
          description: >-
            For multi-currency companies, provide a transaction amount, which is the amount in the transaction currency.
          example: '100.00'
        totalTxnAmount:
          type: string
          format: decimal-precision-2
          description: For tax inclusive bills, provide a total transaction amount.
          example: '100.00'
        memo:
          type: string
          description: Memo about the line item.
          example: Service charges
          nullable: true
        allocation:
          type: object
          description: >-
            Transaction allocation template for the line item, which distributes the bill amount across specified dimensions.
          properties:
            key:
              type: string
              description: System-assigned key for the allocation.
              example: '1'
              nullable: true
            id:
              type: string
              description: System-assigned ID for the allocation.
              example: Alloc1-WBS-US
              nullable: true
            href:
              type: string
              readOnly: true
              example: /objects/general-ledger/txn-allocation-template/21
        currency:
          type: object
          description: Currency details for the bill.
          properties:
            baseCurrency:
              type: string
              description: Base currency for the company.
              readOnly: true
              example: USD
            txnCurrency:
              type: string
              description: Transaction currency for the bill.
              readOnly: true
              example: GBP
            exchangeRate:
              type: object
              title: exchangeRate
              description: Exchange rate details used to calculate the base amount.
              properties:
                date:
                  type: string
                  format: date
                  example: '2024-01-23'
                  description: >-
                    Exchange rate date used to calculate the base amount from the transaction amount.
                  readOnly: true
                  nullable: true
                rate:
                  type: number
                  description: >-
                    Exchange rate used to calculate the base amount from the transaction amount.
                  readOnly: true
                  example: 1.0789
                  nullable: true
                typeId:
                  type: string
                  description: >-
                    Exchange rate type used to calculate the base amount from the transaction amount.
                  readOnly: true
                  example: '1'
                  nullable: true
        paymentInformation:
          type: object
          description: Payment information for the line item.
          properties:
            totalBaseAmountPaid:
              type: string
              format: decimal-precision-2
              description: Total base amount that was paid.
              readOnly: true
              example: '100.00'
            totalTxnAmountPaid:
              type: string
              format: decimal-precision-2
              description: Total transaction amount that was paid.
              readOnly: true
              example: '100.00'
            totalBaseAmountSelectedForPayment:
              type: string
              format: decimal-precision-2
              description: Total base amount selected for the payment.
              readOnly: true
              example: '100.00'
            totalTxnAmountSelectedForPayment:
              type: string
              format: decimal-precision-2
              description: Total transaction amount selected for the payment.
              readOnly: true
              example: '100.00'
        releaseToPay:
          type: boolean
          description: |
            If `true`, then this line item is available for the payment.
          example: true
          default: false
          nullable: true
        isSubTotal:
          type: string
          description: |
            Indicates if the line item is a subtotal or tax.
          enum:
            - subtotal
            - tax
            - null
          readOnly: true
          example: subtotal
          nullable: true
          default: null
        baseLocation:
          type: object
          allOf:
            - $ref: '#/components/schemas/location-ref'
            - type: object
              properties:
                key:
                  type: string
                  description: Base location key.
                  example: '4'
        retainage:
          type: object
          description: >-
            Retainage information for the line item. (For Construction subscriptions only.) Retainage is a portion of the agreed upon contract price withheld until the work is substantially complete.
          readOnly: true
          properties:
            hasRetainage:
              type: boolean
              description: If `true`, retainage applies to the line item.
              readOnly: true
              example: true
              default: false
              nullable: true
            percentage:
              type: string
              format: decimal-precision-2
              description: Retainage percentage for the line item.
              readOnly: true
              example: '2'
              nullable: true
            baseAmountRetained:
              type: string
              format: decimal-precision-2
              description: Base amount retained for the line item.
              readOnly: true
              example: '20.00'
              nullable: true
            txnAmountRetained:
              type: string
              format: decimal-precision-2
              description: Transaction amount retained for the line item.
              readOnly: true
              example: '20.00'
              nullable: true
            txnAmountReleased:
              type: string
              format: decimal-precision-2
              description: Transaction amount released for the line item.
              readOnly: true
              example: '10.00'
              nullable: true
            release:
              type: boolean
              description: Indicates whether retainage is released to pay.
              readOnly: true
              example: true
              default: false
              nullable: true
        project:
          type: object
          description: Project-related information for the line item.
          properties:
            isBillable:
              type: boolean
              description: Indicates whether the line item is marked as billable.
              example: true
              default: false
            isBilled:
              type: boolean
              description: Indicates whether the line item is billed.
              readOnly: true
              example: true
              default: false
        fixedAsset:
          type: object
          description: Asset information for the line item.
          properties:
            nameOfAcquiredAsset:
              type: string
              description: Identifier for the asset.
              example: ergonomic chair
              nullable: true
            includeTaxInAssetCost:
              type: boolean
              description: Indicates whether tax is included in the asset cost.
              readOnly: false
              default: false
              example: true
        purchasing:
          type: object
          description: Purchasing document information for the line item.
          properties:
            document:
              type: object
              title: purchasingDocument
              properties:
                key:
                  type: string
                  description: System-assigned key of the primary purchasing document.
                  example: '2437'
                  nullable: true
                id:
                  type: string
                  description: User assigned document number.
                  example: Sales Invoice-INV0110
                  nullable: true
                href:
                  type: string
                  description: URL endpoint for the purchasing document.
                  readOnly: true
                  example: /objects/purchasing/document/2437
            documentLine:
              type: object
              description: Line details for the purchasing document.
              title: purchasingDocumentLine
              properties:
                key:
                  type: string
                  description: System-assigned key for the line in the primary document.
                  example: '750'
                  nullable: true
                id:
                  type: string
                  description: Number of the line in the primary document.
                  example: '3'
                  nullable: true
                href:
                  type: string
                  description: URL endpoint for the purchasing document line.
                  readOnly: true
                  example: /objects/purchasing/document-line/750
        taxEntries:
          type: array
          description: Tax Entries of the AP bill
          items:
            $ref: '#/components/schemas/accounts-payable-bill-tax-entry'
        dimensions:
          type: object
          allOf:
            - $ref: '#/components/schemas/dimension-ref'
            - type: object
              properties:
                location:
                  type: object
                  description: >-
                    Standard Sage Intacct dimension that allows you to create a hierarchy of locations to reflect how your company is organized.
                  title: location
                  properties:
                    key:
                      type: string
                      description: System-assigned key for the location.
                      example: '4'
                      nullable: true
                    id:
                      type: string
                      description: Unique identifier of the location.
                      example: AU
                      nullable: true
                    name:
                      type: string
                      description: Name of the location.
                      readOnly: true
                      example: Australia
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the location.
                      readOnly: true
                      example: /objects/company-config/location/4
                department:
                  type: object
                  description: >-
                    Standard Sage Intacct dimension that allows you to create a hierarchy of departments to reflect how your company is organized.
                  title: department
                  properties:
                    key:
                      type: string
                      description: System-assigned key for the department.
                      example: '9'
                      nullable: true
                    id:
                      type: string
                      description: Unique identifier for the department.
                      example: '01'
                      nullable: true
                    name:
                      type: string
                      description: Name of the department.
                      readOnly: true
                      example: Accounting
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the department.
                      readOnly: true
                      example: /objects/company-config/department/9
        bill:
          type: object
          description: Header level details for the bill's line entries.
          properties:
            id:
              type: string
              description: System-assigned ID for the bill.
              example: '19876'
            key:
              type: string
              description: System-assigned key for the bill.
              example: '19876'
            href:
              type: string
              description: URL endpoint for the bill.
              readOnly: true
              example: /objects/accounts-payable/bill/19876
    accounts-payable-bill:
      type: object
      description: >-
        An AP bill is a statement of charges for money owed to a vendor for goods or services.
      properties:
        key:
          type: string
          description: System-assigned key for the bill.
          readOnly: true
          example: '986'
        id:
          type: string
          description: System-assigned ID for the bill.
          readOnly: true
          example: '986'
        href:
          type: string
          description: Endpoint for the AP bill.
          readOnly: true
          example: /objects/accounts-payable/bill/740
        billNumber:
          type: string
          description: >
            Vendor-assigned identifier for the bill.

            This is the vendor-assigned number provided on the bill. This number is unique and can be used to look up bill details.

            You must specify a bill number when creating a bill unless document sequencing is configured, in which case the number is auto-generated.

          example: Bill-001
          nullable: true
        state:
          type: string
          description: >
            A bill's state shows the current status of the bill within the workflow. For details about each state, see [Bill state descriptions](https://www.intacct.com/ia/docs/en_US/help_action/Accounts_Payable/Bills/bill-state-descriptions.htm).

            The state can be modified through workflow operations like Submit and Reverse, but cannot be changed using the PATCH operation.

          default: draft
          enum:
            - reversed
            - reversal
            - analyzing
            - partiallyApproved
            - submitted
            - declined
            - noValue
            - posted
            - paid
            - partiallyPaid
            - selected
            - draft
          example: posted
        recordType:
          type: string
          description: >-
            The record type for the bill. Accounts Payable bills are record type `pi`.
          readOnly: true
          example: pi
        vendor:
          type: object
          description: Vendor to which this bill is linked.
          properties:
            key:
              type: string
              description: System-assigned key for the vendor.
              example: '15'
            id:
              type: string
              description: Unique identifier of the vendor.
              example: V-00014
            name:
              type: string
              description: Name of the vendor.
              readOnly: true
              example: Pac bell
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/15
            vendorDue:
              type: string
              format: decimal-precision-2
              description: Total transaction amount due for the vendor.
              readOnly: true
              example: '100'
            form1099:
              type: object
              description: Form 1099 information for the vendor.
              title: Form1099
              readOnly: true
              properties:
                type:
                  type: string
                  description: Type of 1099 form for the vendor.
                  readOnly: true
                  example: NEC
                  nullable: true
                box:
                  type: string
                  description: Box number for form 1099.
                  readOnly: true
                  example: 15A
                  nullable: true
                vendorTypeForm1099Type:
                  type: string
                  description: Type of 1099 form for the vendor.
                  readOnly: true
                  example: MISC
                  nullable: true
        term:
          type: object
          description: Term details for the bill.
          properties:
            key:
              type: string
              description: System-assigned key for the term.
              example: '16'
              nullable: true
            id:
              type: string
              description: Name of the term.
              example: Net 75
              nullable: true
            href:
              type: string
              description: URL endpoint for the term.
              readOnly: true
              example: /objects/accounts-payable/term/16
        referenceNumber:
          type: string
          description: >-
            This is a number such as a purchase order or account number that might be useful in searches or reports. This number shows on the GL Details report and prints on the check and vendor Stubs.
          example: INV-902852
          nullable: true
        description:
          type: string
          description: Additional information about the bill.
          example: Annual maintenance charge
          nullable: true
        dueInDays:
          type: string
          description: Number of days until due date for the bill.
          readOnly: true
          example: '8'
        postingDate:
          type: string
          format: date
          example: '2024-01-23'
          description: GL Posting date of the bill.
        discountCutOffDate:
          type: string
          format: date
          example: '2024-02-15'
          description: Date after which the discount for the bill is no longer valid.
          nullable: true
        dueDate:
          type: string
          format: date
          example: '2024-02-23'
          description: Due date for the bill.
        recommendedPaymentDate:
          type: string
          format: date
          example: '2024-01-23'
          description: >-
            Recommended payment date for the bill. If a Default bill payment date is set on the vendor record, Sage Intacct calculates the recommended payment date.\nYou can override the calculated date or, if there is no Default payment date for the vendor, provide a date when you create a bill.
          nullable: true
        createdDate:
          type: string
          format: date
          example: '2024-01-23'
          description: Date that the bill was created.
        isOnHold:
          type: boolean
          description: Set to `true` to place this bill on hold.
          example: false
          default: false
        isTaxInclusive:
          type: boolean
          description: Set to `true` if bill amounts already include taxes.
          example: false
          default: false
        paymentPriority:
          type: string
          enum:
            - urgent
            - high
            - normal
            - low
          description: >
            The payment priority for this bill, which enables you to easily identify and pay the most urgent bills first.

          example: urgent
          default: normal
        totalBaseAmount:
          type: string
          format: decimal-precision-2
          description: >-
            Total base amount calculated for the bill. For multi-currency companies, Intacct calculates this amount in your company's base currency by applying the exchange rate to the total transaction amount.
          readOnly: true
          example: '100'
        totalBaseAmountDue:
          type: string
          format: decimal-precision-2
          description: >-
            For multi currency companies, the total amount due for the bill in your company's base currency.
          readOnly: true
          example: '10'
        totalTxnAmount:
          type: string
          format: decimal-precision-2
          description: Total transaction amount of the bill.
          readOnly: true
          example: '100'
        totalTxnAmountDue:
          type: string
          format: decimal-precision-2
          description: Total amount due for the bill.
          readOnly: true
          example: '10'
        isSystemGenerated:
          type: boolean
          readOnly: true
          description: >
            If `true`, then this bill record is created by the system internally and not created based on user input.

          example: false
          default: false
        purchasing:
          type: object
          description: This field deprecated. Use the `purchasingDocument` field instead.
          deprecated: true
          properties:
            id:
              type: string
              description: Document ID of the vendor invoice.
