    accounts-payable-payment-line:
      type: object
      description: AP payment line items represent entries in an AP payment object.
      properties:
        key:
          type: string
          description: System-assigned unique key for the AP payment line item.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            ID for the AP payment line item. This value is the same as the key for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the AP payment line item.
          readOnly: true
          example: /objects/accounts-payable/payment-line/23
        description:
          type: string
          description: Memo or brief description of the AP payment line item.
          nullable: true
          example: Penalty
        exchangeRate:
          type: object
          description: Exchange rate details used to calculate the base amount.
          readOnly: true
          properties:
            date:
              type: string
              format: date
              example: '2023-01-23'
              description: >-
                Exchange rate date for this transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
              readOnly: true
            rate:
              type: string
              description: >-
                Exchange rate used to calculate the base amount from the transaction amount.
              readOnly: true
              example: '1.0789'
            typeId:
              type: string
              description: >-
                Exchange rate type used to calculate the base amount from the transaction amount.
              readOnly: true
              example: '1'
              nullable: true
        lineNumber:
          type: integer
          description: Line number of the AP payment line item.
          readOnly: true
          example: 1
        baseCurrency:
          type: object
          description: Line item amounts in base currency.
          readOnly: true
          properties:
            currency:
              type: string
              description: Base currency.
              readOnly: true
              example: USD
            amount:
              type: string
              format: decimal-precision-2
              description: Base amount.
              readOnly: true
              example: '10.00'
            totalPaid:
              type: string
              format: decimal-precision-2
              description: Total base amount paid for the line item.
              readOnly: true
              example: '10.00'
            totalSelected:
              type: string
              format: decimal-precision-2
              description: Total base amount selected for the line item.
              readOnly: true
              example: '0.00'
        txnCurrency:
          type: object
          description: Line item amounts in transaction currency.
          readOnly: true
          properties:
            currency:
              type: string
              description: Transaction currency.
              readOnly: true
              example: USD
            amount:
              type: string
              format: decimal-precision-2
              description: Transaction amount.
              readOnly: true
              example: '10.00'
            totalPaid:
              type: string
              format: decimal-precision-2
              description: Transaction total paid for the line item.
              readOnly: true
              example: '10.00'
            totalSelected:
              type: string
              format: decimal-precision-2
              description: Transaction total selected for the line item.
              readOnly: true
              example: '0.00'
        paymentLineRecord:
          type: string
          description: |
            Record type of the line item:
            * `pp` - AP payment record
            * `po` - applied advance record
          readOnly: true
          example: pp
        baseLocation:
          type: string
          description: Key for the base location associated with the payment line.
          readOnly: true
          example: '2'
        isTax:
          type: boolean
          description: Indicates whether the line item amount includes taxes.
          readOnly: true
          example: true
          default: false
        taxDetail:
          type: object
          description: >-
            Purchasing tax detail for the line item. A tax schedule map applies tax details to taxable lines.
          readOnly: true
          properties:
            key:
              type: string
              description: Unique key for the tax detail.
              readOnly: true
              example: '13'
              nullable: true
            id:
              type: string
              description: ID for the tax detail.
              readOnly: true
              example: AUS-TAX
              nullable: true
            href:
              type: string
              description: URL endpoint for the tax detail.
              readOnly: true
              example: /objects/tax/purchasing-tax-detail/13
        glAccount:
          type: object
          description: General Ledger (GL) account associated with the payment line.
          readOnly: true
          properties:
            key:
              type: string
              description: Unique key for the GL account.
              readOnly: true
              example: '23'
            id:
              type: string
              description: ID for the GL account.
              readOnly: true
              example: '6330'
            name:
              type: string
              description: Title of the GL account.
              readOnly: true
              example: Compensation- Salary
            href:
              type: string
              description: URL endpoint for the GL account.
              readOnly: true
              example: /objects/general-ledger/account/23
        dimensions:
          type: object
          allOf:
            - $ref: '#/components/schemas/dimension-ref'
            - type: object
              properties:
                department:
                  type: object
                  description: Department associated with the AP payment line item.
                  readOnly: true
                  properties:
                    key:
                      type: string
                      description: Unique key for the department.
                      readOnly: true
                      example: '12'
                      nullable: true
                    id:
                      type: string
                      description: ID for the department.
                      readOnly: true
                      example: '12'
                      nullable: true
                    name:
                      type: string
                      description: Name of the department.
                      readOnly: true
                      example: Accounts
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the department.
                      readOnly: true
                      example: /objects/company-config/department/12
                location:
                  type: object
                  description: Location associated with the AP payment line item.
                  readOnly: true
                  properties:
                    key:
                      type: string
                      description: Unique key for the location.
                      readOnly: true
                      example: '22'
                      nullable: true
                    id:
                      type: string
                      description: ID for the location.
                      readOnly: true
                      example: LOC-22
                      nullable: true
                    name:
                      type: string
                      description: Name of the location.
                      readOnly: true
                      example: India
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the location.
                      readOnly: true
                      example: /objects/company-config/location/22
        apPayment:
          type: object
          description: Header level details for the AP payment's line entries.
          readOnly: true
          properties:
            key:
              type: string
              description: Unique key for the AP payment.
              readOnly: true
              example: '3220'
            id:
              type: string
              description: ID for the AP payment.
              readOnly: true
              example: '3220'
            href:
              type: string
              description: URL endpoint for the AP payment.
              readOnly: true
              example: /objects/accounts-payable/payment/3220
        audit:
          $ref: '#/components/schemas/audit.s1'
    accounts-payable-payment:
      type: object
      description: >-
        An AP payment is a transaction that records a payment against an AP bill or AP adjustment.
      properties:
        key:
          type: string
          description: System-assigned unique key for the AP payment.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            ID for the AP payment. This value is the same as the key for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the AP payment.
          readOnly: true
          example: /objects/accounts-payable/payment/23
        recordType:
          type: string
          $ref: '#/components/schemas/ap-record-type'
          description: Record type of the transaction.
          readOnly: true
          example: apPayment
        financialEntity:
          type: object
          description: Financial account from which the payment is made.
          properties:
            id:
              type: string
              description: Account number or other unique identifier for the bank account.
              example: BOA
        action:
          type: string
          description: >
            This field has been deprecated. Use the `state` field instead.

            The action to take when the payment is created or updated.

            * `submit` - Submit or post the payment, depending on the approval workflow.

            * `draft` - Move the payment to the outbox in the system.

          enum:
            - draft
            - submit
          default: draft
          deprecated: true
        systemGenerated:
          type: string
          description: Indicates whether the payment is system generated.
          readOnly: true
          example: 'true'
          enum:
            - 'true'
            - 'false'
          default: 'false'
        state:
          type: string
          description: >-
            Current state of the AP payment.

            The state can be modified through workflow operations like Submit and Reverse, but cannot be changed using the PATCH operation.
          enum:
            - partiallyApproved
            - submitted
            - voided
            - confirmed
            - approved
            - draft
            - declined
            - delivered
            - printVoided
            - quickDelivery
          example: approved
          default: draft
        documentNumber:
          type: string
          description: >-
            Reference number for the payment, which can be the check number or the transaction number, depending on the payment method used.
          nullable: true
          example: '3086'
        description:
          type: string
          description: Description of the payment (memo).
          nullable: true
          example: From billing through August 31
        documentId:
          type: string
          description: Document ID for the payment.
          nullable: true
          example: Prim-Vendor-Invoice-VI#0008#doc
        txnDate:
          type: string
          format: date
          example: '2024-11-03'
          description: Date the payment was created.
          readOnly: true
        txnPaidDate:
          type: string
          format: date
          example: '2024-11-04'
          description: Date the payment transaction was paid.
          readOnly: true
        paymentDate:
          type: string
          format: date
          example: '2024-11-23'
          description: The date to make the payment.
          nullable: false
        baseCurrency:
          type: object
          description: Transaction totals in the base currency.
          properties:
            currency:
              type: string
              description: The company's base currency.
              example: USD
            amountToPay:
              type: string
              format: decimal-precision-2
              description: Amount to pay in the base currency.
              example: '500'
            totalAmount:
              type: string
              format: decimal-precision-2
              description: Total amount.
              readOnly: true
              example: '10.00'
            totalSelected:
              type: string
              format: decimal-precision-2
              description: Total amount selected.
              readOnly: true
              example: '10.00'
            totalPaid:
              type: string
              format: decimal-precision-2
              description: Total amount paid.
              readOnly: true
              example: '10.00'
            totalDue:
              type: string
              format: decimal-precision-2
              description: Amount due.
              readOnly: true
              example: '10.00'
        txnCurrency:
          type: object
          description: >-
            For companies that use multi-currency transactions, totals in the transaction currency.
          properties:
            currency:
              type: string
              description: The currency in which the payment was made.
              example: USD
            amountToPay:
              type: string
              format: decimal-precision-2
              description: Amount to pay in the transaction currency.
              example: '500'
            totalAmount:
              type: string
              format: decimal-precision-2
              description: Total transaction amount.
              readOnly: true
              example: '10.00'
            totalSelected:
              type: string
              format: decimal-precision-2
              description: Total transaction amount selected.
              readOnly: true
              example: '10.00'
            totalPaid:
              type: string
              format: decimal-precision-2
              description: Total transaction amount paid.
              readOnly: true
              example: '10.00'
            totalDue:
              type: string
              format: decimal-precision-2
              description: Transaction amount due.
              readOnly: true
              example: '10.00'
        cleared:
          type: string
          description: >-
            Indicates whether the payment has been reconciled. If set to cleared, the payment is reconciled. Otherwise, the payment is pending reconciliation.
          readOnly: true
          example: matched
          enum:
            - cleared
            - uncleared
            - matched
          default: uncleared
        clearedDate:
          type: string
          format: date
          example: '2024-01-23'
          description: Reconciliation date.
          readOnly: true
          nullable: true
        isInclusiveTax:
          type: boolean
          description: Indicates whether the transaction is tax inclusive.
          readOnly: true
          example: false
          default: false
        paymentSummary:
          type: object
          description: >
            Summary that the payment is part of. Summaries are collections of transactions grouped together for processing.

          readOnly: true
          properties:
            key:
              type: string
              description: Unique key for the summary.
              readOnly: true
              example: '399'
            id:
              type: string
              description: ID for the summary.
              readOnly: true
              example: '399'
            name:
              type: string
              description: Name of the summary.
              readOnly: true
              example: Hidden AP Batch
            postingDate:
              type: string
              format: date
              description: GL posting date.
              readOnly: true
              example: '2024-07-21'
            href:
              type: string
              description: URL endpoint for the summary.
              readOnly: true
              example: /objects/accounts-payable/summary/399
        exchangeRate:
          type: object
          description: Exchange rate details used to calculate the base amount.
          properties:
            date:
              type: string
              format: date
              example: '2024-01-23'
              description: >-
                Exchange rate date for this transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
              nullable: true
            rate:
              type: string
              description: >-
                Exchange rate used to calculate the base amount from the transaction amount.
              readOnly: true
              example: '1.0789'
              nullable: true
            typeId:
              type: string
              description: >-
                Exchange rate type used to calculate the base amount from the transaction amount.
              example: '1'
              nullable: true
        paymentProvider:
          type: object
          description: Payment provider who processed the payment.
          readOnly: true
          properties:
            key:
              type: string
              description: Unique key for the payment provider.
              readOnly: true
              example: '3'
            id:
              type: string
              description: Unique ID for the payment provider.
              readOnly: true
              example: CSI
            href:
              type: string
              description: URL endpoint for the payment provider.
              readOnly: true
              example: /objects/cash-management/payment-provider/3
        paymentMethod:
          type: string
          description: Payment method for the payment.
          nullable: false
          example: printedCheck
        payTo:
          type: object
          description: >-
            Contact that the payment will be made to. Leave blank to use the `payTo` contact set for the vendor.
          readOnly: true
          properties:
            href:
              type: string
              description: URL endpoint for the contact.
              readOnly: true
              example: /objects/company-config/contact/6886
            key:
              type: string
              description: Unique key for the contact.
              readOnly: true
              example: '6886'
            id:
              type: string
              description: Contact ID.
              readOnly: true
              example: ksmith
        taxSolution:
          type: object
          description: Tax solution used to calculate and capture taxes on the payment.
          readOnly: true
          properties:
            key:
              type: string
              description: Unique key for the tax solution.
              readOnly: true
              example: '5'
              nullable: true
            id:
              type: string
              description: ID of the tax solution.
              readOnly: true
              example: GST
              nullable: true
            taxCalculationMethod:
              type: string
              description: Tax calculation method used for the payment.
              readOnly: true
              example: simpleTax
              nullable: true
            href:
              type: string
              description: URL endpoint for the tax solution.
              readOnly: true
              example: /objects/tax/tax-solution/5
        vendor:
          type: object
          description: Vendor to receive the payment.
          nullable: false
          properties:
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/201
            entity:
              type: string
              description: Vendor entity.
              readOnly: true
              example: V201
            key:
              type: string
              description: Unique key for the vendor.
              example: '201'
            id:
              type: string
              description: ID of the vendor.
              example: V-00014
            name:
              type: string
              description: Name of the vendor.
              readOnly: true
              example: PG & E
        jointPayee:
          type: object
          description: Joint payee for the payment.
          readOnly: true
          properties:
            href:
              type: string
              description: URL endpoint for the joint payee.
              readOnly: true
              example: /object/accounts-payable/joint-payee/11
            key:
              type: string
              description: Unique key for joint payee.
              readOnly: true
              nullable: true
              example: '11'
            id:
              type: string
              description: ID for the joint payee.
              readOnly: true
              nullable: true
              example: '11'
        paymentRequestMethod:
          type: string
          description: Specifies how payment requests are generated.
          enum:
            - null
            - useVendorPreference
            - generateOneRequestPerBill
            - mergeRequestsIntoOnePerVendor
            - mergeRequestIntoOnePerVendorPayToContact
          example: generateOneRequestPerBill
          nullable: true
          default: useVendorPreference
        details:
          type: array
          description: >-
            Payment deails, including transaction payment amounts, line items, and discounts.
          minItems: 1
          items:
            $ref: '#/components/schemas/accounts-payable-payment-detail'
        lines:
          type: array
          description: Line items in the payment.
          items:
            $ref: '#/components/schemas/accounts-payable-payment-line'
        entity:
          $ref: '#/components/schemas/entity-ref'
        audit:
          type: object
          allOf:
            - $ref: '#/components/schemas/audit.s1'
            - type: object
              properties:
                createdDateTime:
                  type: string
                  description: Time of the submission.
                  format: date-time
                  example: '2014-01-08T11:28:12Z'
                  readOnly: true
    accounts-payable-payment-detailRequiredProperties:
      type: object
      required:
        - moduleKey
        - paymentDate
        - txnPaymentAmount
    accounts-payable-recurring-billRequiredProperties:
      type: object
      properties:
        vendor:
          type: object
          required:
            - id
        schedule:
          type: object
          required:
            - startDate
            - repeatInterval
            - repeatBy
        currency:
          type: object
          required:
            - txnCurrency
        term:
          type: object
          required:
            - id
        lines:
          type: array
          items:
            required:
              - txnAmount
              - glAccount
    accounts-payable-recurring-bill-tax-entry:
      type: object
      description: Tax entries for an AP recurring bill line.
      allOf:
        - title: Tax entries
          description: Tax entries for line items.
          type: object
          properties:
            key:
              type: string
              description: System-assigned key for the tax entry.
              example: '7149'
              readOnly: true
            id:
              type: string
              description: Unique identifier for the tax entry.
              example: '7149'
              readOnly: true
            baseTaxAmount:
              type: string
              description: Base tax amount.
              format: decimal-precision-2
              example: '100.00'
            txnTaxAmount:
              type: string
              description: >-
                Transaction tax amount. For a PATCH request, set to `null` if you want Sage Intacct to recalculate the amount, or set to the value you want if you don't want the system to recalculate.
              format: decimal-precision-2
              example: '100.00'
            taxRate:
              type: number
              description: Tax rate.
              example: 1.0299
        - type: object
          properties:
            purchasingTaxDetail:
              type: object
              description: >-
                Purchasing entry tax details describe a specific type of tax that applies to lines in Accounts Payable transactions.
              properties:
                key:
                  type: string
                  description: System-assigned key for the tax detail object.
                  example: '19'
                id:
                  type: string
                  description: Unique ID for the tax detail object.
                  example: Alaska Tax Detail
                href:
                  type: string
                  description: URL endpoint for the tax detail object.
                  readOnly: true
                  example: /objects/tax/purchasing-tax-detail/19
            recurringBillLine:
              title: recurring-bill-line
              description: The recurring bill line associated with the tax entries.
              readOnly: true
              type: object
              properties:
                id:
                  type: string
                  description: Unique ID for the recurring bill line.
                  example: '100'
                  readOnly: true
                key:
                  type: string
                  description: Unique key for the recurring bill line.
                  example: '100'
                  readOnly: true
                href:
                  type: string
                  description: URL endpoint for the recurring bill line.
                  readOnly: true
                  example: /objects/accounts-payable/recurring-bill-line/100
    accounts-payable-recurring-bill-line:
      type: object
      description: >-
        Line items in a recurring bill represent transactions captured in that recurring bill.
      properties:
        key:
          type: string
          description: System-assigned key for the line item.
          readOnly: true
          example: '34'
        id:
          type: string
          description: >-
            Unique identifier for the line item. This value is the same as the `key` for this object.
          readOnly: true
          example: '34'
        href:
          type: string
          description: URL endpoint for the line item.
          readOnly: true
          example: /objects/accounts-payable/recurring-bill-line/34
        memo:
          type: string
          description: >-
            Memo that appears on the check stub and provides information about the line item.
          example: Service charges
          nullable: true
        baseAmount:
          type: string
          format: decimal-precision-2
          description: >-
            For multi-currency companies, the transaction amount in the base currency.
          readOnly: true
          example: '100'
        lineNumber:
          type: integer
          description: Line number of the line item.
          readOnly: true
          example: 15
        hasForm1099:
          type: string
          description: Set to `true` to add the line item amount to the vendor 1099 form.
          example: 'false'
        form1099:
          type: object
          description: Details related to the 1099 form for the line item.
          properties:
            type:
              type: string
              description: Type of 1099 form.
              example: NEC
              nullable: true
            box:
              type: string
              description: Box number for form 1099.
              example: 15A
              nullable: true
        txnAmount:
          type: string
          format: decimal-precision-2
          description: Amount of the line item in the transaction currency.
          example: '100'
        totalTxnAmount:
          type: string
          format: decimal-precision-2
          description: For tax inclusive recurring bills, total transaction amount.
          example: '112.00'
        isBillable:
          type: boolean
          description: Set to `true` if the line item will be billed to the customer.
          default: false
          example: true
        glAccount:
          type: object
          description: GL account associated with the line item.
          properties:
            key:
              type: string
              description: Unique key for the GL account.
              example: '220'
            id:
              type: string
              description: Unique ID for the GL account.
              example: '1501.04'
            name:
              type: string
              description: Name or title of the GL account.
              readOnly: true
              example: Entertainment
            href:
              type: string
              description: URL endpoint for the GL account.
              readOnly: true
              example: /objects/general-ledger/account/220
        currency:
          type: object
          description: Currency details for the recurring bill line.
          properties:
            baseCurrency:
              type: string
              description: Base currency for the company.
              example: USD
            txnCurrency:
              type: string
              description: Transaction currency for the recurring bill.
              example: USD
            exchangeRate:
              type: object
              description: >-
                For multi-currency companies, the exchange rate for this line item.
              title: exchangeRate
              properties:
                date:
                  type: string
                  format: date
                  example: '2024-01-23'
                  description: >-
                    Exchange rate date for the transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
                rate:
                  type: number
                  description: Exchange rate to use.
                  example: 1.0789
                typeId:
                  type: string
                  description: Exchange rate type to use, such as the Intacct Daily Rate.
                  example: INR-Rate
        allocation:
          type: object
          description: >-
            Transaction allocation template for the line item, which distributes the bill amount across specified dimensions. When creating a recurring bill line, you must include either an `allocation` in the request, or `dimensions`.
          properties:
            key:
              type: string
              description: Unique key for the allocation template.
              example: '16'
              nullable: true
            id:
              type: string
              description: Unique ID for the allocation template.
              example: '16'
              nullable: true
            href:
              type: string
              description: URL endpoint for the allocation template.
              readOnly: true
              example: /objects/general-ledger/txn-allocation-template/16
            name:
              type: string
              description: Name of the allocation.
              readOnly: true
              example: Alloc1-WBS-US
              nullable: true
        accountLabel:
          type: object
          description: Label of the AP account to assign the expense to.
          properties:
            key:
              type: string
              description: Unique key for the account label.
              example: '14'
              nullable: true
            id:
              type: string
              description: Unique ID for the account label.
              example: Accounting Fees
              nullable: true
            href:
              type: string
              description: URL endpoint for the account label.
              readOnly: true
              example: /objects/accounts-payable/account-label/14
        dimensions:
          type: object
          description: >-
            Dimensions associated with the line item. When creating a recurring bill line, you must include either an `allocation` in the request, or `dimensions`. A `location` is required if you include dimensions in the request.
          allOf:
            - $ref: '#/components/schemas/dimension-ref'
            - type: object
              properties:
                department:
                  type: object
                  description: Department to assign the expense to.
                  properties:
                    key:
                      type: string
                      description: Unique key for the department.
                      example: '21'
                      nullable: true
                    id:
                      type: string
                      description: Unique ID for the department.
                      example: '21'
                      nullable: true
                    name:
                      type: string
                      description: The name of the department.
                      example: Accounting
                      readOnly: true
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint for the department.
                      readOnly: true
                      example: /objects/company-config/department/21
                location:
                  type: object
                  description: Location to assign the expense to.
                  properties:
                    key:
                      type: string
                      description: Unique key for the location.
                      example: '9'
                      nullable: true
                    id:
                      type: string
                      description: Unique ID for the location.
                      example: '9'
                      nullable: true
                    name:
                      type: string
                      description: Name of the location.
                      example: India
                      readOnly: true
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint of the location.
                      readOnly: true
                      example: /objects/company-config/location/9
        overrideOffsetGLAccount:
          type: object
          description: >-
            An alternative account to override the default GL account for the bill.
          properties:
            key:
              type: string
              description: Unique key for the GL account.
              example: '384'
            id:
              type: string
              description: Unique ID for the GL account.
              example: '1234.36'
            name:
              type: string
              description: Name of the GL account.
              readOnly: true
              example: AP ACCOUNT
            href:
              type: string
              description: URL endpoint for the GL account.
              readOnly: true
              example: /objects/general-ledger/account/384
        taxEntries:
          type: array
          description: >-
            For companies subscribed to the Taxes application, tax entries for the recurring bill line.
          items:
            $ref: '#/components/schemas/accounts-payable-recurring-bill-tax-entry'
        recurringBill:
          type: object
          description: Header level details for the recurring bill's line entries.
          properties:
            id:
              type: string
              description: Unique ID for the recurring bill.
              example: '199'
            key:
              type: string
              description: Unique key for the recurring bill.
              example: '199'
            href:
              type: string
              description: URL endpoint for the recurring bill.
              readOnly: true
              example: /objects/accounts-payable/recurring-bill/199
          readOnly: true
        status:
          $ref: '#/components/schemas/status'
        audit:
          $ref: '#/components/schemas/audit.s1'
    accounts-payable-recurring-bill:
      type: object
      description: Header information for recurring bills.
      properties:
        key:
          type: string
          description: System-assigned key for the recurring bill.
          readOnly: true
          example: '56'
        id:
          type: string
          description: >-
            Unique identifier for the recurring bill. This value is the same as the `key` for this object.
          readOnly: true
          example: '56'
          nullable: true
        href:
          type: string
          description: URL endpoint for the recurring bill.
          readOnly: true
          example: /objects/accounts-payable/recurring-bill/56
        description:
          type: string
          description: Additional information about the recurring bill.
          example: Recurring Bill for 2025-01-23 services
          nullable: true
        referenceNumber:
          type: string
          description: >-
            A reference number, such as a purchase order or account number, used for searches and reports. This number appears on the General Ledger Details report and prints on checks and vendor stubs.
          example: RecurBill-100
          nullable: true
        moduleKey:
          type: string
          description: Internal identifier for the module.
          readOnly: true
          example: 3.AP
        contract:
          type: object
          description: Represents a contract associated with the recurring bill.
          properties:
            key:
              type: string
              description: Unique key for the contract.
              example: '2'
              nullable: true
            id:
              type: string
              description: Unique ID for the contract.
              example: CON-2
              nullable: true
            description:
              type: string
              description: Description of the contract.
              example: CON-2 for trade
              nullable: true
              readOnly: true
            href:
              type: string
              description: URL endpoint for the contract.
              readOnly: true
              example: /objects/contracts/contract/2
        billNumber:
          type: string
          description: >-
            Each occurrence of the bill is numbered incrementally based on the sequence type defined in Company Setup - Document Sequence.
          deprecated: true
          example: AP-ADJ
        billSequenceNumber:
          type: string
          description: >-
            Specify the initial value for the bill number, which will be incremented for each bill based on the sequence type defined in Company Setup - Document Sequence. For example, if you specify AP-ADJ in this field, the number for each recurring bill will start with AP-ADJ and will be incremented based on the sequence type. For example, AP-ADJ001, APAP-ADJ002, APAP-ADJ003, etc.
          example: AP-ADJ
        totalEntered:
          type: string
          format: decimal-precision-2
          description: Total amount of the recurring bill.
          readOnly: true
          example: '100'
        txnTotalEntered:
          type: string
          format: decimal-precision-2
          description: Total transaction amount.
          example: '100'
          readOnly: true
        currency:
          type: object
          description: Currency details for this recurring bill.
          properties:
            baseCurrency:
              type: string
              description: Base currency for the company.
              example: USD
            txnCurrency:
              type: string
              description: >-
                The transaction currency to use for the recurring bill. If this currency is different from the base currency, provide an exchange rate.
              example: USD
            exchangeRate:
              type: object
              description: Exchange rate information for the recurring bill.
              title: exchangeRate
              properties:
                date:
                  type: string
                  format: date
                  example: '2025-01-23'
                  description: >-
                    Exchange rate date for this transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
                  nullable: true
                rate:
                  type: number
                  description: >-
                    Exchange rate used to calculate the base amount from the transaction amount.
                  example: 1.0789
                  nullable: true
                typeId:
                  type: string
                  description: >-
                    Exchange rate type used to calculate the base amount from the transaction amount.
                  example: '1'
                  nullable: true
        isTaxInclusive:
          type: boolean
          description: Set to `true` if bill amounts already include taxes.
          example: false
          default: false
        attachment:
          type: object
          description: Supporting document attached to the bill.
          properties:
            key:
              type: string
              description: System-assigned key for the supporting document.
              example: '18'
              nullable: true
            id:
              type: string
              description: System-assigned ID for the supporting document.
              example: '18'
              nullable: true
            href:
              type: string
              description: URL endpoint for the attachment.
              readOnly: true
              example: /objects/company-config/attachment/18
        taxSolution:
          type: object
          description: Tax solution details for the bill.
          properties:
            key:
              type: string
              description: Unique key for the tax solution.
              example: '4'
              nullable: true
            id:
              type: string
              description: Unique ID for the tax solution.
              example: Australia GST
              nullable: true
            showMultiLineTax:
              type: string
              description: If set to `true`, enables multiple taxes per line to be shown.
              example: 'true'
              nullable: true
              readOnly: true
            method:
              type: string
              description: Tax method used for the bill.
              example: VAT
              nullable: true
              readOnly: true
            href:
              type: string
              description: URL endpoint for the tax solution.
              readOnly: true
              example: /objects/tax/tax-solution/4
        contacts:
          type: object
          description: Contacts for the recurring bill.
          properties:
            payTo:
              type: object
              description: The vendor contact to be paid.
              title: payTo
              properties:
                key:
                  type: string
                  description: Unique key for the contact.
                  example: '916'
                id:
                  type: string
                  description: Unique ID for the contact.
                  example: Power Aerospace Materials(C1)
                tax:
                  type: object
                  title: tax
                  readOnly: true
                  description: Tax related information for the pay-to contact.
                  properties:
                    taxId:
                      type: string
                      description: Tax identification number.
                      example: 252-85-7897
                      nullable: true
                    group:
                      type: object
                      description: Contact tax group associated with the pay-to contact.
                      properties:
                        key:
                          type: string
                          description: Unique key for the group.
                          example: '288'
                          nullable: true
                        id:
                          type: string
                          description: Unique ID for the group.
                          example: Goods Zero Rate - CA
                          nullable: true
                        href:
                          type: string
                          description: URL endpoint for the group.
                          readOnly: true
                          example: /objects/tax/contact-tax-group/288
                href:
                  type: string
                  description: URL endpoint for the contact.
                  readOnly: true
                  example: /objects/company-config/contact/916
            returnTo:
              type: object
              description: The vendor contact for return of the purchase.
              title: returnTo
              properties:
                key:
                  type: string
                  description: Unique key for the contact.
                  example: '341'
                id:
                  type: string
                  description: Unique ID for the contact.
                  example: Power Aerospace Materials(C1)
                href:
                  type: string
                  description: URL endpoint for the contact.
                  readOnly: true
                  example: /objects/company-config/contact/341
        schedule:
          type: object
          description: >-
            Defines the scheduling details for the recurring bill, including start date, frequency, next execution date, and end conditions. The schedule provides a comprehensive view of when and how often the recurring bill will be generated.
          properties:
            startDate:
              type: string
              format: date
              description: >-
                Specifies the initial date for generating the recurring bill. This date remains editable until the first bill is processed.
              example: '2025-01-01'
            endDate:
              type: string
              format: date
              description: >-
                Specify the end date for generating the recurring bill. A repeatCount can be specified instead of an endDate, but not both.
              example: '2026-01-01'
            nextExecutionDate:
              type: string
              format: date
              description: >-
                Shows the next date for the scheduled execution of the recurring bill.
              readOnly: true
              example: '2025-02-01'
            lastExecutionDate:
              type: string
              format: date
              description: >-
                Shows the last date for the scheduled execution of the recurring bill.
              readOnly: true
              example: '2025-12-01'
            recurringDueDate:
              type: string
              format: date
              description: >-
                Shows the recurring due date for the scheduled execution of the recurring bill.
              readOnly: true
              example: '2025-06-01'
            executionCount:
              type: string
              description: >-
                Shows the number of attempts to generate the recurring bill. This value reflects the number of times the system has tried to create the bill, which may differ from the number of successful transactions due to potential errors during execution.
              readOnly: true
              example: '100'
            repeatCount:
              type: string
              description: >-
                Specifies the number of times the recurring bill should be generated. Either this field or the `endDate` field must be specified to define the end condition for the recurring bill, not both.
              example: '50'
            repeatBy:
              type: string
              description: >-
                Specifies the regular interval at which the recurring bill should repeat. This field works in conjunction with the `repeatInterval` field, where you specify the number of intervals. For example, if you set `repeatBy` to `months` and set the `repeatInterval` to `3`, the schedule will run every 3 months.
              enum:
                - none
                - days
                - weeks
                - months
                - years
                - endOfMonth
              default: days
              example: days
            repeatInterval:
              type: string
              description: >-
                Specifies the interval at which the bill repeats. This field works in conjunction with the `repeatBy` field, where you specify the regular interval at which the recurring bill should repeat. For example, if you set `repeatBy` to `months` and set the `repeatInterval` to `3`, the schedule will run every 3 months.
              default: '1'
              example: '1'
        recurringSchedule:
          type: object
          description: Recurring schedule used to automate the billing process.
          properties:
            key:
              type: string
              description: Unique key for the recurring schedule.
              readOnly: true
              example: '20'
            id:
              type: string
              description: Unique ID for the recurring schedule.
              readOnly: true
              example: '20'
            href:
              type: string
              description: URL endpoint for the recurring schedule.
              readOnly: true
              example: /objects/core/schedule/20
          readOnly: true
        term:
          type: object
          description: >-
            Payment terms, which are used to calculate due date, discounts, and penalties associated with this bill.
          properties:
            key:
              type: string
              description: Unique key for the payment term.
              example: '3'
              nullable: true
            id:
              type: string
              description: Name or other unique identifier for the payment term.
              example: N15
              nullable: true
            href:
              type: string
              description: URL endpoint for the payment term.
              readOnly: true
              example: /objects/accounts-payable/term/3
        vendor:
          type: object
          description: Vendor associated with the recurring bill.
          properties:
            id:
              type: string
              description: Unique ID for the vendor.
              example: Vendor_01
            key:
              type: string
              description: Unique key for the vendor.
              example: '15'
            name:
              type: string
              description: Name of the vendor.
              example: Logic Solutions
              readOnly: true
            vendorDue:
              type: string
              format: decimal-precision-2
              description: Total amount due to the vendor for the transaction.
              readOnly: true
              example: '100'
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/15
        lines:
          type: array
          description: Line items of the recurring bill.
          items:
            $ref: '#/components/schemas/accounts-payable-recurring-bill-line'
        audit:
          readOnly: true
          type: object
          allOf:
            - $ref: '#/components/schemas/audit.s1'
            - type: object
              properties:
                createdDateTime:
                  type: string
                  description: Time of the submission.
                  format: date-time
                  example: '2024-01-23T11:28:12Z'
                  readOnly: true
        status:
          $ref: '#/components/schemas/status'
        entity:
          $ref: '#/components/schemas/entity-ref'
    accounts-payable-recurring-bill-lineRequiredProperties:
      oneOf:
        - type: object
          required:
            - txnAmount
            - recurringBill
            - glAccount
            - allocation
        - type: object
          required:
            - txnAmount
            - recurringBill
            - glAccount
            - dimensions
          properties:
            dimensions:
              type: object
              required:
                - location
    accounts-payable-summaryRequiredProperties:
      type: object
      required:
        - name
        - glPostingDate
        - recordType
    accounts-payable-summary:
      type: object
      description: >-
        Summaries are collections of the same types of transactions grouped together for processing.
      properties:
        key:
          type: string
          description: System-assigned key for the summary.
          readOnly: true
          example: '12'
        id:
          type: string
          description: Unique identifier for the summary.
          readOnly: true
          example: '12'
        href:
          type: string
          description: URL endpoint for the summary.
          readOnly: true
          example: /objects/accounts-payable/summary/12
        name:
          type: string
          description: >-
            Name for the AP summary. The system uses this name to identify the summary throughout the Accounts Payable application.
          example: Jan 2024 Bill Summary
        summaryCreationType:
          type: string
          description: >-
            If set to 'manual', then the summary was created by a user and if set to 'system', then the summary was created by Sage Intacct based on the summary frequency.
          enum:
            - system
            - manual
          default: manual
          example: manual
          readOnly: true
        glPostingDate:
          type: string
          format: date
          description: >-
            The date that items in the summary should post to the general ledger.
          example: '2024-06-02'
        summaryType:
          type: string
          description: Record type for AP summary
          enum:
            - apAdjustment
            - apBill
          example: apBill
          default: apBill
        totalAmount:
          type: string
          description: Total amount of all transactions contained in the summary.
          format: decimal-precision-2
          example: '7000.22'
          readOnly: true
        state:
          type: string
          description: >-
            State of the summary, which can be `open` or `closed`. An open summary can have items added to it.
          enum:
            - open
            - closed
          example: open
          default: open
          readOnly: true
        parent:
          type: object
          description: Parent summary
          properties:
            key:
              type: string
              description: System-assigned key for the parent summary.
              example: '23'
              nullable: true
            id:
              type: string
              description: Unique identifier for the parent summary.
              example: '23'
              nullable: true
            href:
              type: string
              description: URL endpoint for the parent summary.
              readOnly: true
              example: /objects/accounts-payable/summary/23
        preventGLPosting:
          type: boolean
          description: >-
            Set to 'true' to prevent summary items from posting to the general ledger.
          example: false
          readOnly: true
        isQuickPaymentSummary:
          type: boolean
          description: >-
            Set to 'true' for manual and quick payment summary types. Set to 'false' for bill and adjustment summary types.
          example: false
          default: false
        status:
          $ref: '#/components/schemas/status'
        entity:
          $ref: '#/components/schemas/entity-ref'
        audit:
          $ref: '#/components/schemas/audit.s1'
    accounts-payable-termRequiredProperties:
      type: object
      required:
        - id
        - description
    accounts-payable-term:
      type: object
      description: >-
        An Accounts Payable (AP) term is a rule that a vendor establishes for extending credit to your company.
      properties:
        key:
          type: string
          description: System-assigned key for the AP term.
          readOnly: true
          example: '1'
        id:
          type: string
          description: Unique identifier for the AP term.
          example: Net 60
        href:
          type: string
          description: Endpoint for the AP term.
          readOnly: true
          example: /objects/accounts-payable/term/6
        status:
          $ref: '#/components/schemas/status'
        description:
          type: string
          description: A note about the purpose and use of the AP term.
          example: 60 Days term
        audit:
          $ref: '#/components/schemas/audit.s1'
        due:
          type: object
          description: >-
            Define the calculation for the due date by specifying the number of days and either the date or month to reference.
          properties:
            days:
              type: integer
              description: The number of days used to calculate the due date.
              example: 60
            from:
              type: string
              enum:
                - null
                - fromBillDate
                - ofTheMonthOfBillDate
                - ofNextMonthFromBillDate
                - of2ndMonthFromBillDate
                - of3rdMonthFromBillDate
                - of4thMonthFromBillDate
                - of5thMonthFromBillDate
                - of6thMonthFromBillDate
                - afterEndOfMonthOfBillDate
                - fromBillDateExtendingToEom
              description: The date or month to reference to calculate the due date.
              nullable: true
              example: fromBillDate
              default: null
        discount:
          type: object
          description: Terms of the discount extended by the vendor.
          properties:
            days:
              type: integer
              description: >-
                Number of days from the specified date that the discount is valid.
              example: 30
            amount:
              type: string
              format: decimal-precision-2
              description: Amount of the discount.
              example: '4'
            from:
              type: string
              enum:
                - null
                - fromBillDate
                - ofTheMonthOfBillDate
                - ofNextMonthFromBillDate
                - of2ndMonthFromBillDate
                - of3rdMonthFromBillDate
                - of4thMonthFromBillDate
                - of5thMonthFromBillDate
                - of6thMonthFromBillDate
                - afterEndOfMonthOfBillDate
                - fromBillDateExtendingToEom
              description: Date used to determine if the discount is valid.
              example: fromBillDate
              nullable: true
              default: null
            unit:
              type: string
              enum:
                - null
                - amount
                - percentage
              description: Type of discount.
              example: amount
              nullable: true
              default: null
            graceDays:
              type: integer
              description: Number of days before the vendor withdraws the discount.
              example: 6
            calculateOn:
              type: string
              enum:
                - null
                - lineItemsTotal
                - billTotal
              description: The total to use when calculating the discount.
              example: billTotal
              nullable: true
              default: null
        penalty:
          type: object
          description: Penalty for paying after the due date.
          properties:
            cycle:
              type: string
              enum:
                - null
                - noPenalty
                - daily
                - weekly
                - biweekly
                - monthly
                - bimonthly
                - quarterly
                - halfYearly
                - annually
              description: The time span in which the penalty accrues.
              example: daily
              nullable: true
              default: null
            amount:
              type: string
              format: decimal-precision-2
              description: The penalty amount.
              example: '10'
            unit:
              type: string
              enum:
                - null
                - amount
                - percentage
              description: Type of penalty.
              example: amount
              nullable: true
              default: null
            graceDays:
              type: integer
              description: >-
                The number of days after the due date that the vendor applies the penalty.
              example: 1
    accounts-payable-check-runRequiredProperties:
      type: object
      required:
        - id
    accounts-payable-check-run:
      type: object
      description: >-
        Use a check run to process up to 1,000 checks at a time in an offline process.
      properties:
        key:
          type: string
          description: System-assigned unique key for the check run.
          readOnly: true
          example: '28'
        id:
          type: string
          description: >-
            Unique ID for the check run. This value is the same as the `key` for this object.
          readOnly: true
          example: '28'
        title:
          type: string
          description: Name of the check run.
          maxLength: 80
          example: All Checks For Mar 2025
        href:
          type: string
          description: URL endpoint for the check run.
          readOnly: true
          example: /objects/accounts-payable/check-run/28
        sortOrder:
          type: array
          description: Sort order for the list of checks included in the check run.
          example:
            - Check
            - Vendor
            - Entity
          default:
            - Check
            - Vendor
            - Entity
          items:
            type: string
        checksPerPage:
          type: string
          description: Number of checks to be printed per page.
          example: '1'
          enum:
            - '1'
            - '3'
          default: '1'
        printCheckStubDetail:
          type: boolean
          description: >-
            Indicates whether to add transaction details, such as bills or expenses paid with the check, to the check stub for your records.
          example: true
          default: false
        printVendorStubDetail:
          type: boolean
          description: >-
            Indicates whether to add transaction details, such as bills or expenses paid with the check, to the check stub for the vendor records.
          example: true
          default: false
        checkStock:
          type: string
          description: >-
            Check stock used for printing. With the `blankCheckStockMicr` (blank check stock with MICR) option, checks can be printed from more that one checking account. With the `prePrintedCheckStock` (preprinted check stock) option, checks are printed from a single checking account.
          example: blankCheckStockMicr
          enum:
            - blankCheckStockMicr
            - prePrintedCheckStock
          default: blankCheckStockMicr
        checkingAccount:
          type: object
          description: >-
            Checking account associated with the check run, which is required when the `blankCheckStockMicr` option is set for the `checkStock` field.
          properties:
            href:
              type: string
              description: URL endpoint for the checking account.
              readOnly: true
              example: /objects/cash-management/bank-account/12
            key:
              type: string
              description: Unique key for the checking account.
              readOnly: true
              example: '12'
            id:
              type: string
              description: Checking account ID.
              example: CITI
        whenCreated:
          type: string
          description: Date that the check run was created.
          format: date
          readOnly: true
          example: '2025-01-04'
        status:
          $ref: '#/components/schemas/status'
    accounts-payable-vendorRequiredProperties:
      type: object
      required:
        - id
        - name
    dimension-status:
      description: >
