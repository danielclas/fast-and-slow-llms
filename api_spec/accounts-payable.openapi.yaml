          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ia::result:
                    $ref: '#/components/schemas/accounts-payable-vendor-actions-approve-response'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
