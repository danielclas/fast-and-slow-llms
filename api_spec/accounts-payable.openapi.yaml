              description: >-
                System-assigned key to uniquely identify the purchasing document.
              readOnly: true
              example: '416'
            href:
              type: string
              description: URL endpoint for the purchasing document.
              readOnly: true
              example: /objects/purchasing/document/416
        recurringSchedule:
          type: object
          description: Recurring schedule used to automate the billing process.
          properties:
            key:
              type: string
              description: System-assigned key to uniquely identify the recurring schedule.
              readOnly: true
              nullable: true
