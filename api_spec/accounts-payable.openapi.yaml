    accounts-payable-joint-payee:
      type: object
      description: Information about each joint payee for AP Bill
      properties:
        key:
          type: string
          description: System-assigned key for the joint payee.
          readOnly: true
          example: '1'
        id:
          type: string
          description: >-
            Unique ID for the joint payee. This value is the same as `key` for this object.
          readOnly: true
          example: '1'
        href:
          type: string
          description: URL endpoint for the joint payee.
          readOnly: true
          example: /objects/accounts-payable/joint-payee/1
        name:
          type: string
          description: >
            Name of the joint payee. The `name` value cannot be changed after a payment that uses the `printAs` field has been made.

          example: John Smith
        printAs:
          type: string
          description: >
            Name that will print on the check. Usually, this value is the vendor's pay-to contact name and the joint payee name.

            This value must be unique per bill. This value cannot be changed after a payment has been made.

          example: Orchard Supply Hardware & John Smith
        bill:
          type: object
          description: The bill associated with this joint payee.
          properties:
            key:
              type: string
              description: Bill key.
              example: '1'
            id:
              type: string
              description: Bill ID.
              example: INV-1285
            href:
              type: string
              description: URL endpoint for the bill.
              readOnly: true
              example: /objects/accounts-payable/bill/1
