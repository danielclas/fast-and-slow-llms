        audit:
          $ref: '#/components/schemas/audit.s1'
    accounts-payable-adjustment:
      type: object
      description: >-
        Adjustments are used to increase or decrease the amount you owe a vendor.
      properties:
        key:
          type: string
          description: System-assigned unique key for the adjustment.
          readOnly: true
          example: '1371'
        id:
          type: string
          description: >-
            Unique identifier for the adjustment. This value is the same as the `key` for this object.
          readOnly: true
          example: '1371'
        href:
          type: string
          description: Endpoint for AP adjustment.
          readOnly: true
          example: /objects/accounts-payable/adjustment/1371
        adjustmentNumber:
          type: string
          description: >
            Adjustment number associated with the adjustment.

            You must specify a unique adjustment number unless document sequencing is configured, in which case the ID is auto-generated.

          example: ADJ124
        recordType:
          type: string
          description: Record type to identify the type of transaction.
          readOnly: true
          example: pa
        action:
          type: string
          description: |-
            This field has been deprecated. Use the `state` field instead.
            The action state of the adjustment:
            - `submit` - Default action state.
            - `draft` - Draft action state.
          enum:
            - draft
            - submit
          default: submit
          deprecated: true
        state:
          type: string
          description: >-
            Processing state of the adjustment:

            - `reversed` - Reversed state.

            - `reversal` - Reversal state.

            - `draft` - Draft state.

            - `noValue` - State when multiple lines cancel each other out, such as 10 and -10, resulting in a net zero value for the bill.

            - `posted` - Posted state.

            - `paid` - Paid state.

            - `partiallyPaid` - Partially paid state.

            - `selected` - Selected state.

            The state can be modified through workflow operations like Submit and Reverse, but cannot be changed using the PATCH operation.
          enum:
            - reversed
            - reversal
            - draft
            - noValue
            - posted
            - paid
            - partiallyPaid
            - selected
          example: paid
          default: draft
        vendor:
          type: object
          description: Vendor associated with the adjustment.
          properties:
            id:
              type: string
              description: ID for the vendor.
              example: Vendor_01
            key:
              type: string
              description: Unique key for the vendor.
              example: Vendor_01
            name:
              type: string
              description: Name of the vendor.
              example: Logic Solutions
              readOnly: true
            totalDue:
              type: string
              format: decimal-precision-2
              description: Total amount due to the vendor for a transaction.
              readOnly: true
              example: '100'
            href:
              type: string
              description: URL endpoint of the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/1
        description:
          type: string
          description: Detailed explanation of the adjustment.
          example: >-
            Computer Hardware & Software Expenses 03/01/20 - 08/31/21 Subscription charges.
        createdDate:
          type: string
          format: date
          example: '2021-01-23'
          description: The date when the adjustment was created.
        isTaxInclusive:
          type: boolean
          description: Set to `true` if the adjustment amount already includes taxes.
          example: false
          default: false
        totalEntered:
          type: string
          format: decimal-precision-2
          description: Total amount of the adjustment entered by the user.
          readOnly: true
          example: '100.20'
        totalBaseAmountDue:
          type: string
          format: decimal-precision-2
          description: Total base amount due after the adjustment is applied.
          readOnly: true
          example: '251464.01'
        txnTotalEntered:
          type: string
          format: decimal-precision-2
          description: Total transaction amount entered.
          readOnly: true
          example: '1000.20'
        txnTotalDue:
          type: string
          format: decimal-precision-2
          description: Total transaction amount due after the adjustment.
          readOnly: true
          example: '100.50'
        taxSolution:
          type: object
          description: Tax solution details for this adjustment.
          properties:
            key:
              type: string
              description: Unique key for the tax solution.
              example: '4'
              nullable: true
            id:
              type: string
              description: ID or name of the tax solution.
              example: Australia GST
              nullable: true
            enableMultilineTax:
              type: boolean
              description: Set to `true` to enable multiple taxes per line.
              example: true
              nullable: true
              readOnly: true
              default: false
            taxCalculationMethod:
              type: string
              description: Tax method used in this adjustment.
              example: VAT
              nullable: true
              readOnly: true
            href:
              type: string
              description: URL endpoint for the tax solution.
              readOnly: true
              example: /objects/tax/tax-solution/4
        attachment:
          type: object
          description: Supporting document for the adjustment.
          properties:
            key:
              type: string
              description: Unique key for the attachment.
              example: '1'
            id:
              type: string
              description: ID for the attachment.
              example: adj-01
            href:
              type: string
              description: URL endpoint for the attachment.
              readOnly: true
              example: /objects/company-config/attachment/1
        adjustmentSummary:
          type: object
          description: >-
            Details of the summary for this adjustment. Summaries are collections of the same types of transactions grouped together for processing.
          properties:
            key:
              type: string
              description: Unique key for the adjustment summary.
              example: '280'
            id:
              type: string
              description: ID for the adjustment summary.
              example: '280'
            name:
              type: string
              description: Name of the adjustment summary.
              readOnly: true
              example: 'Adjustments: 2022/01/01 Batch'
            glPostingDate:
              type: string
              format: date
              example: '2021-01-23'
              description: >-
                The date when the adjustment summary was posted to the general ledger.
            state:
              type: string
              description: >-
                Indicates whether the adjustment summary is open or closed. Items, such as invoices, can be added to adjustment summaries that are open.
              enum:
                - open
                - closed
              example: open
              readOnly: true
              default: open
            preventGLPosting:
              type: boolean
              description: >-
                If `true`, the  adjustment summary has been posted to the general ledger.
              readOnly: true
              example: false
              default: false
            href:
              type: string
              description: URL endpoint for the adjustment summary.
              readOnly: true
              example: /objects/accounts-payable/adjustment-summary/280
        moduleKey:
          type: string
          description: >-
            Key identifying the source module from which the transaction was created.
          readOnly: true
          example: 3.AP
        currency:
          $ref: '#/components/schemas/currency'
        contacts:
          type: object
          description: >-
            Contacts for this adjustment. If not specified, the vendor contacts will be used.
          properties:
            payTo:
              type: object
              description: The vendor contact to be paid.
              title: payTo
              properties:
                key:
                  type: string
                  description: Unique key for the contact.
                  example: '916'
                  nullable: true
                id:
                  type: string
                  description: ID for the contact.
                  example: Power Aerospace Materials(C1)
                  nullable: true
                tax:
                  type: object
                  title: tax
                  description: Tax-related information for the pay-to contact.
                  properties:
                    taxId:
                      type: string
                      description: Tax ID number for the contact.
                      example: 252-85-7897
                      nullable: true
                    group:
                      type: object
                      description: Tax group associated with the contact.
                      properties:
                        key:
                          type: string
                          description: Unique key for the tax group.
                          example: '288'
                          nullable: true
                        id:
                          type: string
                          description: Unique ID for the tax group.
                          example: Goods Zero Rate - CA
                          nullable: true
                        href:
                          type: string
                          description: URL endpoint for the tax group.
                          readOnly: true
                          example: /objects/tax/contact-tax-group/288
                href:
                  type: string
                  description: URL endpoint of the contact.
                  readOnly: true
                  example: /objects/company-config/contact/1
            returnTo:
              type: object
              description: The vendor contact for return of the purchase.
              title: returnTo
              properties:
                key:
                  type: string
                  description: Unique key for the contact.
                  example: '916'
                id:
                  type: string
                  description: ID for the contact.
                  example: Power Aerospace Materials(C1)
                href:
                  type: string
                  description: URL endpoint of the contact.
                  readOnly: true
                  example: /objects/company-config/contact/1
        referenceNumber:
          type: string
          description: >-
            A number, such as a purchase order or account number, useful for searches or reports. This number appears on the GL Details report and is printed on checks and vendor stubs.
          example: INV-902852
        paymentInformation:
          type: object
          description: Payment information for the adjustment.
          properties:
            paidDate:
              type: string
              format: date
              example: '2021-01-23'
              description: The date when the adjustment was paid.
              readOnly: true
              nullable: true
            totalBaseAmountPaid:
              type: string
              format: decimal-precision-2
              description: Total base amount paid for the adjustment.
              readOnly: true
              example: '100'
              nullable: true
            totalBaseAmountSelected:
              type: string
              format: decimal-precision-2
