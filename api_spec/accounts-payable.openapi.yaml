    metadata-pages:
      description: Metadata for collection response
      type: object
      properties:
        totalCount:
          type: integer
          description: Total number of members in the result set.
          readOnly: true
          example: 3
        start:
          type: integer
          description: First member of the result set included in the current response.
          readOnly: true
          example: 1
        pageSize:
          type: integer
          description: >-
            Maximum number of members included in the current response. The response may contain fewer members if the final page of the result set is smaller than the page size.
          readOnly: true
          example: 100
        next:
          type: integer
          description: First member number of the next page of results.
          readOnly: true
          nullable: true
          example: 101
        previous:
          type: integer
          description: First member number of the previous page of results.
          readOnly: true
          nullable: true
          example: null
    metadata:
      description: Metadata for response
      type: object
      properties:
        totalCount:
          type: integer
          description: Total count
          readOnly: true
          example: 3
        totalSuccess:
          type: integer
          description: Total success
          readOnly: true
          example: 2
        totalError:
          type: integer
          description: Total errors
          readOnly: true
          example: 1
    error-response:
      type: object
      description: Error response
      properties:
        ia::result:
          type: object
          properties:
            ia::error:
              type: object
              properties:
                code:
                  type: string
                  example: invalidRequest
                message:
                  type: string
                  example: Payload contains errors
                supportId:
                  type: string
                  example: sQrM9%7EYdh5oDEWVb80mrn9xuHjoAAAABBQ
                errorId:
                  type: string
                  example: REST-1064
                additionalInfo:
                  type: object
                  properties:
                    messageId:
                      type: string
                      example: IA.PAYLOAD_CONTAINS_ERRORS
                    placeholders:
                      type: object
                      example: {}
                    propertySet:
                      type: object
                      example: {}
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalidRequest
                      message:
                        type: string
                        example: /newDate is not a valid field
                      errorId:
                        type: string
                        example: REST-1043
                      target:
                        type: string
                        example: /newDate
                      additionalInfo:
                        type: object
                        properties:
                          messageId:
                            type: string
                            example: IA.NOT_A_VALID_FIELD
                          placeholders:
                            type: object
                            example: {}
                          propertySet:
                            type: object
                            example: {}
            ia::meta:
              $ref: '#/components/schemas/metadata'
      example:
        ia::result:
          ia::error:
            code: invalidRequest
            message: A POST request requires a payload
            errorId: REST-1028
            additionalInfo:
              messageId: IA.REQUEST_REQUIRES_A_PAYLOAD
              placeholders:
                OPERATION: POST
              propertySet: {}
            supportId: Kxi78%7EZuyXBDEGVHD2UmO1phYXDQAAAAo
        ia::meta:
          totalCount: 1
          totalSuccess: 0
          totalError: 1
    status:
      type: string
      description: >-
