              nullable: true
            txnTotalSelected:
              type: string
              format: decimal-precision-2
              description: The total transaction amount selected for payment.
              readOnly: true
              example: '1000.05'
              nullable: true
            txnTotalPaid:
              type: string
              format: decimal-precision-2
              description: The total transaction amount paid.
              readOnly: true
              example: '2000.50'
              nullable: true
        audit:
          readOnly: true
          type: object
          allOf:
            - $ref: '#/components/schemas/audit.s1'
