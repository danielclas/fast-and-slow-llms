    accounts-payable-payment-detail:
      type: object
      description: >-
        An AP payment detail object provides details about a payment, including information about the bill, adjustment, or advance that was paid and line-item information for the bill, adjustment, or advance.
      properties:
        key:
          type: string
          description: System-assigned unique key for the AP payment detail object.
          readOnly: true
          example: '1083'
