        groupType:
          type: string
          description: "Group membership type. The group type and related fields determine which vendors are included in the group. When creating reports that use vendors in rows or columns, these fields also determine the column headings and row headings that display, and the order in which they will be listed.\n\n* `specificMembers` - Specify the vendors to include and their order in the `groupMembers` array. You can optionally filter the array with the `memberFilter` settings.\n* `allMembers` - All vendors that match the `memberFilter` criteria. \n"
          enum:
            - allMembers
            - specificMembers
          default: allMembers
          example: allMembers
        memberFilter:
          type: object
          description: >-
            One or more filters to select the vendors to include in the vendor group.
          allOf:
            - $ref: '#/components/schemas/member-filter'
            - type: object
        groupMembers:
          type: array
          description: >-
            List of vendors to include in the group when `groupType` is set to `specificMembers`.
          items:
            type: object
            properties:
              key:
                type: string
                description: Unique key for the vendor.
                example: '12'
              id:
                type: string
                description: Unique ID for the vendor.
                example: '12'
              name:
                type: string
                description: Vendor name.
                example: NCS, Inc.
                readOnly: true
              href:
                type: string
                description: URL endpoint for the vendor.
                readOnly: true
                example: /objects/accounts-payable/vendor/12
              status:
                type: string
                description: Vendor status.
                readOnly: true
                enum:
                  - active
                  - activeNonPosting
                  - inactive
                example: active
              sortOrder:
                type: string
                description: Sort order.
                example: '0'
                readOnly: true
        isDimensionStructure:
          type: boolean
          description: >-
            Indicates whether a dimension structure is created from the group. If true, the group can be added to the rows or columns of a financial report.
          default: false
          example: false
        audit:
          $ref: '#/components/schemas/audit.s1'
        entity:
          $ref: '#/components/schemas/entity-ref'
    accounts-payable-vendor-total:
      type: object
      description: >-
        A vendor total object provides information about how much is owed to a vendor.
      readOnly: true
      properties:
        key:
          type: string
          description: System-assigned unique key for the vendor total.
          readOnly: true
          example: '85'
        id:
          type: string
          description: Unique ID for the vendor total.
          readOnly: true
          example: '111'
        href:
          type: string
          description: URL endpoint for the vendor total.
          readOnly: true
          example: /objects/accounts-payable/vendor-total/85
        totalDue:
          type: string
          description: Vendor total due.
          format: decimal-precision-2
          example: '1353.01'
        vendor:
          type: object
          description: The vendor who owes the amount due.
          properties:
            key:
              type: string
              description: Unique key for the vendor.
              example: '48'
            id:
              type: string
              description: Name or other unique ID for the vendor.
              example: Pac Bell
            name:
              type: string
              description: Name of the vendor.
              example: Pac Bell
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/48
        entity:
          type: object
          description: Location of the entity associated with the vendor total.
          allOf:
            - $ref: '#/components/schemas/entity-ref'
            - type: object
              properties:
                id:
                  type: string
                  description: ID for the entity.
                  readOnly: true
                  example: NYC
                name:
                  type: string
                  description: Name of the entity.
                  example: New York City
  responses:
    400error:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error-response'
  securitySchemes:
    OAuth2:
      description: Sage Intacct OAuth 2.0 authorization code flow
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.intacct.com/ia/api/v1/oauth2/authorize
          tokenUrl: https://api.intacct.com/ia/api/v1/oauth2/token
          refreshUrl: https://api.intacct.com/ia/api/v1/oauth2/token
          scopes: {}
