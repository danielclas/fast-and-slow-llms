    accounts-payable-vendor:
      type: object
      description: Vendors
      properties:
        key:
          type: string
          description: System-assigned unique key for the vendor.
          readOnly: true
          example: '518'
        id:
          type: string
          description: >-
            Unique ID for the vendor. You must specify a unique vendor ID when creating a vendor unless document sequencing is configured, in which case the ID is auto-generated.
          example: V-00014
        name:
          type: string
          description: >-
            Name of the vendor as it will appear on lists and menus across your company.
          example: NCS, Inc.
        isOneTimeUse:
          type: boolean
          description: >-
            Set to `true` if this is a one-time or occasional use vendor that you do not want to include in standard vendor lists.
          default: false
          example: true
        href:
          type: string
          description: URL endpoint for the vendor.
          readOnly: true
          example: /objects/accounts-payable/vendor/518
        status:
          $ref: '#/components/schemas/dimension-status'
