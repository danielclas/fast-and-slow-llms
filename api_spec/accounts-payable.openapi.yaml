          description: URL endpoint for the payment detail object.
          readOnly: true
          example: /objects/accounts-payable/payment-detail/1083
        paymentDate:
          type: string
          format: date
          description: Date the payment was made.
          readOnly: true
          nullable: false
          example: '2024-04-04'
        baseCurrency:
          type: object
          description: Payment amounts in the company's base currency.
