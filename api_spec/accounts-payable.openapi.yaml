    accounts-payable-adjustment-tax-entry:
      type: object
      description: >-
        For VAT enabled transactions, adjustment line items will have tax entries.
      allOf:
        - title: Tax entries
          description: Tax entries for line items.
          type: object
          properties:
            key:
              type: string
              description: System-assigned key for the tax entry.
              example: '7149'
              readOnly: true
            id:
              type: string
              description: Unique identifier for the tax entry.
              example: '7149'
              readOnly: true
            baseTaxAmount:
              type: string
              description: Base tax amount.
              format: decimal-precision-2
              example: '100.00'
            txnTaxAmount:
              type: string
              description: >-
                Transaction tax amount. For a PATCH request, set to `null` if you want Sage Intacct to recalculate the amount, or set to the value you want if you don't want the system to recalculate.
              format: decimal-precision-2
              example: '100.00'
            taxRate:
              type: number
              description: Tax rate.
              example: 1.0299
        - type: object
          properties:
            purchasingTaxDetail:
              type: object
              description: Purchasing tax details associated with the adjustment tax entry.
              properties:
                key:
                  type: string
                  description: Unique key for the Purchasing tax detail.
                  example: '1'
                id:
                  type: string
                  description: Unique identifier for the Purchasing tax detail.
                  example: Alaska Tax Detail
                href:
                  type: string
                  description: URL endpoint for the Purchasing tax detail.
                  readOnly: true
                  example: /objects/tax/purchasing-tax-detail/1
            adjustmentLine:
              title: adjustment-line
              description: >-
                Adjustment line item that the adjustment tax entry is associated with.
              readOnly: true
              type: object
              properties:
                id:
                  type: string
                  description: >-
                    Unique identifier for the adjustment line. This value is the same as the `key` for this object.
                  example: '100'
                  readOnly: true
                key:
                  type: string
                  description: Unique key for the adjustment line.
                  example: '100'
                  readOnly: true
                href:
                  type: string
                  description: URL endpoint for the adjustment line.
                  readOnly: true
                  example: /objects/accounts-payable/adjustment-line/100
    accounts-payable-adjustment-line:
      type: object
      description: >-
        Line items in an adjustment represent transactions captured in that adjustment.
      properties:
        id:
          type: string
          description: >-
            Unique identifier for the adjustment line item. This value is the same as the `key` for this object.
          readOnly: true
          example: '1'
        key:
          type: string
          description: System-assigned key for the adjustment line item.
          example: '1'
        href:
          type: string
          description: Endpoint for the AP adjustment line.
          readOnly: true
          example: /objects/accounts-payable/adjustment-line/5296
        baseAmount:
          type: string
          format: decimal-precision-2
          description: >-
            For multi-currency companies, the transaction amount in the base currency.
          example: '100'
        txnAmount:
          type: string
          format: decimal-precision-2
          description: >-
            The transaction amount for the adjustment line item in the currency specified for the transaction.
          example: '100'
        totalTxnAmount:
          type: string
          format: decimal-precision-2
          description: >-
            Total transaction amount, including tax, for tax-inclusive adjustments.
          example: '100.00'
        memo:
          type: string
          description: >-
            Additional notes or comments about the adjustment line item for reference.
          example: Service adjustments
        lineNumber:
          type: string
          description: >-
            The specific line number assigned to the adjustment line item for identification.
          readOnly: true
          example: '1'
        hasForm1099:
          type: string
          description: |
            Set to true to add the line item amount to the vendor 1099 form.
          example: 'false'
        form1099:
          type: object
          description: Details related to the 1099 form for the line item.
          properties:
            type:
              type: string
              description: |
                The type of the 1099 form applicable to the line item.
              example: NEC
              nullable: true
            box:
              type: string
              description: "The specific box number on the 1099 form where the amount for this line item is reported. Each type of the 1099 form has different box numbers for reporting various types of income. \n"
              example: 15A
              nullable: true
        adjustmentType:
          type: string
          description: Adjustment type for the line item.
          readOnly: true
          example: pa
        glAccount:
          $ref: '#/components/schemas/gl-account-ref'
        overrideOffsetGLAccount:
          type: object
          description: The general ledger account where the system posts offsets.
          properties:
            key:
              type: string
              description: System-assigned key for the offset account number.
              example: '384'
            id:
              type: string
              description: Unique identifier for the offset account number.
              example: '1234.36'
            name:
              type: string
              description: The name of the offset account used in the transaction.
              readOnly: true
              example: AP ACCOUNT
            href:
              type: string
              description: URL endpoint for the offset account.
              readOnly: true
              example: /objects/general-ledger/account/384
        accountLabel:
          type: object
          description: Meaningful name of the account.
          properties:
            key:
              type: string
              description: System-assigned key for the account label.
              example: '14'
              nullable: true
            id:
              type: string
              description: Unique identifier for the account label.
              example: Accounting Fees
              nullable: true
            href:
              type: string
              readOnly: true
              example: /objects/accounts-payable/account-label/14
        dimensions:
          type: object
          allOf:
            - $ref: '#/components/schemas/dimension-ref'
            - type: object
              properties:
                department:
                  type: object
                  description: Department to assign the expense to.
                  properties:
                    key:
                      type: string
                      description: System-assigned key for the department.
                      example: '1'
                      nullable: true
                    id:
                      type: string
                      description: >-
                        Unique identifier for the department. This value is the same as the `key` for this object.
                      example: '1'
                      nullable: true
                    name:
                      type: string
                      description: The name of the department assigned to the transaction.
                      readOnly: true
                      example: Accounting
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint of the department.
                      readOnly: true
                      example: /objects/company-config/department/1
                location:
                  type: object
                  description: Location to assign the expense to.
                  properties:
                    key:
                      type: string
                      description: System-assigned key for the location.
                      example: '1'
                      nullable: true
                    id:
                      type: string
                      description: >-
                        Unique identifier for the location. This value is the same as the `key` for this object.
                      example: '1'
                      nullable: true
                    name:
                      type: string
                      description: The name of the location assigned to the transaction.
                      readOnly: true
                      example: India
                      nullable: true
                    href:
                      type: string
                      description: URL endpoint of the location.
                      readOnly: true
                      example: /objects/company-config/location/1
        currency:
          type: object
          description: Currency details for multi-currency companies.
          properties:
            baseCurrency:
              type: string
              description: The base currency in which the line item is denominated.
              readOnly: true
              example: USD
            txnCurrency:
              type: string
              description: The currency used for the transaction.
              readOnly: true
              example: USD
            exchangeRate:
              type: object
              description: Exchange rate details used to calculate the base amount.
              title: exchangeRate
              properties:
                date:
                  type: string
                  format: date
                  example: '2021-01-23'
                  description: >-
                    Exchange rate date for this transaction. Can be the current date, the date the transaction was issued, or the date the transaction will be paid.
                  nullable: true
                rate:
                  type: string
                  description: >-
                    Exchange rate used to calculate the base amount from the transaction amount.
                  example: '1.0789'
                typeId:
                  type: string
                  description: >-
                    The type of exchange rate used to calculate the base amount from the transaction amount.
                  example: Intacct Daily Rate
                  nullable: true
        paymentInformation:
          type: object
          description: Payment information for the adjustment line item.
          properties:
            totalBaseAmountPaid:
              type: string
