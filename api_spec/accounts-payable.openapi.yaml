    accounts-payable-vendor-bank-file-setup:
      type: object
      description: >-
        A bank file enables electronic payments to be made to vendors using a local bank file format. Bank files are standard files used by banks to make multiple payments.
      properties:
        key:
          type: string
          description: System-assigned key for the vendor bank file setup.
          readOnly: true
          example: '1'
        id:
          type: string
          description: >-
            ID for the vendor bank file setup. This value is the same as the `key` for this object.
          readOnly: true
          example: '1'
        bankAccountNumber:
          type: string
          description: Bank account number for the bank file payment.
          example: IE26SCT666666
        bankAccountName:
          type: string
          description: Bank account name for the bank file payment.
          example: Jane Blogs Corp.
        bsbNumber:
          type: string
          description: >-
            Six-digit number that identifies a particular branch of a bank. Supported countries - Australia (AU).
          example: 047-359
        sortCode:
          type: string
          description: >-
            Six-digit sort code for the bank and branch where the account is held. Supported countries - United Kingdom (GB).
          example: '204718'
        paymentReference:
          type: string
          description: >-
            Payment reference number to connect the bank file and the bills to be paid. Supported countries - Australia (AU) and South Africa (ZA).
          example: EB32131016
        branchCode:
          type: string
          description: >-
            Branch code for the vendor bank account to which payments are made. Supported countries - South Africa (ZA).
          example: '213456'
        bankAccountType:
          type: string
          description: >-
            Account type for the vendor bank account to which payments are made. Value must be 1, 2, 3, or 4. Supported countries - South Africa (ZA).
          example: '4'
        bankAccountCode:
          type: string
          description: Account code for the vendor bank account to which payments are made.
          example: '345624'
        printPaymentProof:
          type: boolean
          description: >-
            Specify whether to print the proof of payment when the bank file payment batch is authorized. Supported countries - South Africa (ZA).
          default: true
          example: true
        businessIdCode:
          type: string
          description: >-
            Creditor bank identifier code for the bank account. Supported countries - All European countries where Generic-SEPA file format is supported.
          example: AIBKIE2D491
        creditorCode:
          type: string
          description: >-
            Creditor code for the bank account. Supported countries - Canada (CA).
          example: '1234567891234567'
        secondaryIdentifier:
          type: string
          description: >-
            Bank number, as assigned by the account CAD financial institution.  Supported countries - Canada (CA).
          example: '00710423598'
        accountClassification:
          type: string
          description: "(This field applies only to companies in the United States.) Specifies the account classification for ACH transactions. \nUse PPD (Prearranged Payment and Deposit) for transactions with individual or consumer accounts. \nUse CCD (Corporate Credit or Debit) for transactions with business or corporate accounts.\n"
          enum:
            - null
            - ppd
            - ccd
          example: ccd
          default: ccd
          nullable: true
        vendor:
          type: object
          description: Vendor associated with the bank file.
          properties:
            key:
              type: string
              description: Unique key for the vendor.
              example: '518'
            id:
              type: string
              description: Unique ID for the vendor.
              example: V-00014
            href:
              type: string
              description: URL endpoint for the vendor.
              readOnly: true
              example: /objects/accounts-payable/vendor/518
        href:
          type: string
          description: URL endpoint for the vendor bank file setup.
          readOnly: true
          example: /objects/accounts-payable/vendor-bank-file-setup/25
