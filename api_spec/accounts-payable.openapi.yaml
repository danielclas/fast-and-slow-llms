          type: string
          description: >-
            Unique identifier for the adjustment summary. This value is the same as the `key` for this object.
          readOnly: true
          example: '1'
        href:
          type: string
          description: URL endpoint of the adjustment summary.
          readOnly: true
          example: /objects/accounts-payable/adjustment-summary/1
        name:
          type: string
          description: >-
            Name of the adjustment summary. This name is used to identify the summary throughout the Accounts Payable application.
          example: Adjustment Batch Jan 2021
        summaryCreationType:
          type: string
          enum:
            - system
            - manual
          description: >-
            Indicates how the summary was created. If set to `manual`, the summary was created by a user. If set to `system`, the summary was automatically created by Intacct based on the summary frequency.
          default: manual
          example: manual
          readOnly: true
        status:
          $ref: '#/components/schemas/status'
        recordType:
          $ref: '#/components/schemas/ap-record-type'
          description: Record type to identify the type of transaction.
          readOnly: true
          example: apAdjustments
        totalAmount:
          type: string
          format: decimal-precision-2
          description: >-
            The total amount of all adjustments included in the adjustment summary.
          readOnly: true
          example: '656.82'
        parent:
          type: object
          description: Parent adjustment summary.
          properties:
            key:
              type: string
              description: System-assigned key for the parent adjustment summary.
              example: '22'
              nullable: true
            id:
              type: string
              description: >-
                Unique identifier for the parent adjustment summary. This value is the same as the `key` for this object.
              example: '22'
              nullable: true
            href:
              type: string
              description: URL endpoint of the adjustment summary.
              readOnly: true
              example: /objects/accounts-payable/summary/22
        preventGLPosting:
          type: boolean
          description: Specifies whether to allow posting to the general ledger (GL).
          default: false
          readOnly: true
          example: false
        bankAccountId:
          type: object
          description: Bank account ID.
          properties:
            key:
              type: string
              description: System-assigned key for the bank account.
              example: '1'
              nullable: true
            id:
              type: string
              description: >-
                Unique identifier for the bank account. This value is the same as the `key` for this object.
              example: '1'
              nullable: true
            href:
              type: string
              description: URL endpoint of the bank account.
              readOnly: true
              example: /objects/cash-management/bank-account/23
        glPostingDate:
          type: string
          format: date
          description: >-
            The date that the items in the adjustment summary should post to the general ledger.
          example: '2022-08-02'
        state:
          type: string
          enum:
            - open
            - closed
          description: >-
            State of the adjustment summary, which can be `open` or `closed`. An open adjustment summary can have items added to it.
          example: open
          default: open
        isQuickPaymentSummary:
          type: boolean
          description: >-
            This field is set to `true` only for manual and quick payment summaries. It is set to `false` for transactions of the type `bill/adjustment`.
          default: false
          example: false
    accounts-payable-advanceRequiredProperties:
      type: object
      required:
        - paymentMethod
        - financialEntity
        - advanceDate
      properties:
        vendor:
          type: object
          required:
            - id
        currency:
          type: object
          required:
            - txnCurrency
        lines:
          type: array
          items:
            required:
              - txnAmount
              - glAccount
    location-ref:
      type: object
      properties:
        key:
          type: string
          description: Location key
          example: '1'
        id:
          type: string
          description: Location ID
          example: US
        name:
          type: string
          description: Location name
          readOnly: true
          example: United States of America
        href:
          type: string
          description: URL endpoint for the location.
          example: /objects/company-config/location/1
          readOnly: true
    accounts-payable-advance-line:
      type: object
      description: >-
        Line items in an AP advance represent transactions captured in that advance.
      properties:
        key:
          type: string
          description: System-assigned key for the AP advance line.
          readOnly: true
          example: '23'
        id:
          type: string
          description: >-
            Unique identifier for the AP advance line. This value is the same as the `key` for this object.
          readOnly: true
          example: '23'
        href:
          type: string
          description: URL endpoint for the AP advance line.
          readOnly: true
          example: /objects/accounts-payable/advance-line/23
        baseAmount:
          type: string
          format: decimal-precision-2
          description: >-
            For multi-currency companies, the transaction amount in the base currency.
          readOnly: true
          example: '100.00'
        txnAmount:
          type: string
          format: decimal-precision-2
          description: >-
            The transaction amount for the AP advance line item in the currency specified for the transaction.
          example: '100'
        dimensions:
          type: object
          allOf:
            - $ref: '#/components/schemas/dimension-ref'
            - type: object
              properties:
                department:
                  type: object
