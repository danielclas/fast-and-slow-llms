        contactList:
          type: array
          description: Contact list for the vendor.
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-contact'
        vendorEmailTemplates:
          type: array
          description: >-
            Templates used to automate standard messages sent to multiple vendors.
          nullable: true
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-email-template'
        vendorPaymentProviders:
          type: array
          description: Payment providers for the vendor.
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-payment-provider'
        vendorBankFileSetup:
          type: array
          description: >-
            Enable electronic payments to be made to vendors using a local bank file format.
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-bank-file-setup'
        vendorAccountNumberList:
          type: array
          description: >-
            In a multi-entity company, the vendor account number associated with entity locations.
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-account-number'
        preferredPaymentMethod:
          type: string
          description: >
            Preferred payment method when you select a bill to pay for the vendor.

          enum:
            - printedCheck
            - chargeCard
            - EFT
            - cash
            - ACH
            - wellsFargoCheck
            - wellsFargoUSDWire
            - wellsFargoDomesticACH
            - null
          example: EFT
          nullable: true
          default: null
        mergePaymentRequests:
          type: boolean
          description: >
            If `true`, merge multiple selected bills into one payment request for the vendor. If `false`, have one payment request created for each bill.

          default: true
          example: true
        sendPaymentNotification:
          type: boolean
          description: >
            If `true`, automatically send payment notifications to the email address for the `payTo` contact.

          default: false
          example: true
        billingType:
          type: string
          description: >
            Billing type to use on vendor statements.

            - `openItem` - Shows all bills, adjustments, and payments as line items on a statements.

            - `balanceForward` - Consolidates previous months bills, adjustments, and payments to a single line item.

          enum:
            - null
            - openItem
            - balanceForward
          example: openItem
          nullable: true
          default: null
        paymentPriority:
          type: string
          description: >
            Optional default payment priority to assign new bills from the vendor.

          enum:
            - null
            - urgent
            - high
            - normal
            - low
          example: low
          nullable: true
          default: null
        currency:
          type: string
          description: Default currency.
          nullable: true
          example: USD
        displayTermDiscountOnCheckStub:
          type: boolean
          description: |
            If `true`, include any associated term discount on check stubs.
          default: true
          example: true
        term:
          type: object
          description: >-
            AP term or rules the vendor has established for extending credit to you.
          properties:
            key:
              type: string
              description: Unique key for the AP term.
              nullable: true
              example: '7'
            id:
              type: string
              description: Name of the AP term.
              nullable: true
              example: Net 30
            href:
              type: string
              description: URL endpoint for the AP term.
              readOnly: true
              example: /objects/accounts-payable/term/7
        billPayment:
          type: object
          properties:
            defaultDateOptions:
              type: string
              description: >-
                The Default bill payment date defines how the Recommended to pay on date is calculated for vendor bills. * `none`- Leaves the default unset, which allows you to choose the value from a different date field. * `dueDate` - Calculates the due date based on the selected `term`, then adjusts based on the number of days specified as an offset. * `billDate` - Uses the date entered for the bill, adjusted for the number of days specified as an offset. Does not require that a `term` be defined. * `discountDate` - Uses the discount details in the specified `term` to calculate the discount date. No offset is used.
              enum:
                - none
                - dueDate
                - billDate
                - discountDate
                - null
              example: none
              nullable: true
              default: null
            offsetTypePlusMinus:
              type: string
              description: >-
                Specify whether to add (`+`) or subtract (`-`) days for the offset.
              enum:
                - +
                - '-'
                - null
              nullable: true
              example: +
            dueNumberOfDays:
              type: integer
              description: >-
                The number of days to use as an offset from the default payment due date.
              nullable: true
              example: 5
            billNumberOfDays:
              type: integer
              description: >-
                The number of days to use as an offset from the default payment bill date.
              nullable: true
              example: 10
        vendorAccountNumber:
          type: string
          description: >
            The account number that the vendor has assigned to the company or the top level of a multi-entity company. Account numbers help match payment information to bills being paid.

          nullable: true
          example: '203'
        displayVendorAccountOnCheckStub:
          type: boolean
          description: >
            Set to `true` to display the vendor-assigned account number, per entity, on check stubs.

          default: false
          example: false
        totalDue:
          type: string
          description: Total amount due.
          readOnly: true
          format: decimal-precision-2
          example: '100.00'
        lastBillCreatedDate:
          type: string
          format: date
          description: Date the last bill was created.
          readOnly: true
          nullable: true
          example: '2022-07-31'
        lastPaymentMadeDate:
          type: string
          format: date
          description: Date the last payment was made.
          readOnly: true
          nullable: true
          example: '2002-08-31'
        ach:
          type: object
          properties:
            enablePayments:
              type: boolean
              description: |
                Set to `true` to enable ACH payments for the vendor.
              default: false
              example: false
            routingNumber:
              type: string
              description: |
                ACH routing number for the vendor.
              nullable: true
              example: '061080227'
            accountNumber:
              type: string
              description: |
                ACH account number for the vendor.
              nullable: true
              example: '7624832485'
            accountType:
              type: string
              description: |
                ACH account type for the vendor.
              enum:
                - null
                - checkingAccount
                - savingsAccount
              example: checkingAccount
              nullable: true
              default: null
            remittanceType:
              type: string
              description: "ACH account classification for the vendor. Specify the classification code that the related bank uses for ACH payments: \n- `businessCTX` - Business account that is a Corporate Trade Exchange (CTX) account.\n- `personalPPD` - An individual contractor's personal account.\n- `businessCCD` - Business account that is a Cash Concentration or Disbursement (CCD) corporate account.\n"
              enum:
                - null
                - businessCTX
                - personalPPD
                - businessCCD
              example: businessCTX
              nullable: true
              default: null
        vendorRestriction:
          type: string
          description: Vendor visibility type.
          example: restricted
          default: unrestricted
          enum:
            - unrestricted
            - rootOnly
            - restricted
        restrictedLocations:
          type: array
          description: Restricted locations for the vendor.
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-restricted-location'
        restrictedDepartments:
          type: array
          description: Restricted departments for the vendor.
          items:
            $ref: '#/components/schemas/accounts-payable-vendor-restricted-department'
        audit:
          $ref: '#/components/schemas/audit.s1'
        entity:
          $ref: '#/components/schemas/entity-ref'
