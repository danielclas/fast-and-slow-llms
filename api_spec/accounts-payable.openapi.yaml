openapi: 3.0.3
info:
  title: Accounts Payable
  description: "Accounts Payable (AP) enables you to keep track of your vendor accounts and bills. \nBasically, you enter and edit your vendor transactions, and then pay them.\n"
  version: '1'
servers:
  - url: https://api.intacct.com/ia/api/v1
tags:
  - name: Account labels
    description: >-
      Account labels give accounts more descriptive names that are displayed anywhere the accounts are referenced in the product and in reports. Account labels is an optional feature that must be enabled when configuring Accounts Payable.
  - name: Adjustments
    description: >-
      Adjustments allow you to modify the amount owed to a vendor, either increasing or decreasing it as necessary.
  - name: Adjustment lines
    description: >-
      Line items in an adjustment represent transactions captured in that adjustment.
  - name: Adjustment tax entries
    description: >-
      For VAT enabled transactions, an adjustment tax entry provides tax information about the adjustment line item it is associated with. Create and maintain adjustment tax entries from the owning [AP adjustment line](/openapi/ap/accounts-payable.adjustment-line/tag/Adjustment-lines) object.
  - name: Adjustment summaries
    description: >-
      Adjustment summaries are collections of similar transactions grouped together for streamlined processing in Accounts Payable.
  - name: Advances
    description: >-
      Advances allow you to make a payment to a vendor in advance of receiving a bill. For example, if a vendor requires an up-front deposit, create an advance payment and post it to an established prepayment account.
  - name: Advance lines
    description: >-
      Line items in an advance represent transactions such as down payments or deposits.
  - name: Bills
    description: "An AP bill is a statement of charges for money owed to a vendor for goods or services. After creating a bill, you can move it along the normal Accounts Payable (AP) workflow. For example, that might mean approving the bill, creating a payment request for the bill, and paying the bill. For more information about bills, see [About paying bills](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Learn_about_Pay_Bills) in the Sage Intacct Help Center. \n"
  - name: Bill lines
    description: Line items in a bill represent charges for purchased items or services.
  - name: Bill tax entries
    description: >-
      For VAT enabled transactions, a bill tax entry provides tax information about the bill line item it is associated with. Create and maintain bill tax entries from the owning [AP bill line](/openapi/ap/accounts-payable.bill-line/tag/Bill-lines) object.
  - name: Bill summaries
    description: >-
      Bill summaries are collections of the same type of transactions, grouped together for processing.
  - name: Joint payees
    description: >-
      The joint payee object tracks AP bills and joint payees to allow for joint check payments. See [Joint check basics](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Constr_JointCheck-basics) in the Sage Intacct Help Center for more information.
  - name: Payments
    description: >-
      An AP payment is a transaction that records a payment against a bill or an adjustment.
  - name: Payment lines
    description: >-
      Payment line items represent entries in a payment object. AP payment line is an owned object of [AP payment](/openapi/ap/accounts-payable.payment/tag/Payments).
  - name: Payment details
    description: >-
      An AP payment detail object provides details about a payment, including information about the bill, adjustment, or advance that was paid and line-item information for the bill, adjustment, or advance. AP payment detail is an owned object of [AP payment](/openapi/ap/accounts-payable.payment/tag/Payments).
  - name: Recurring bills
    description: >-
      An AP recurring bill provides the ability to schedule and automate the process of creating AP bills. It is commonly used for regularly-recurring, fixed-amount bills. For more information, refer to [Recurring bills](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=TOC_recurring_bills) in the Sage Intacct Help Center.
  - name: Recurring bill lines
    description: >-
      Line items in a recurring bill represent transactions captured in that recurring bill. For more information, see [Recurring bills](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=TOC_recurring_bills) in the Sage Intacct Help Center.
  - name: Recurring bill tax entries
    description: "For VAT enabled transactions, recurring bill lines include tax entries. Create and update tax entries by creating and updating the [recurring-bill-line objects](/openapi/ap/accounts-payable.recurring-bill-line/tag/Recurring-bill-lines) that contain the entries. \n"
  - name: Summaries
    description: "Summaries are collections of the same type of transactions grouped together for processing. To learn more, see [Accounts Payable summary overview](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=AP_summary_overview) in the Sage Intacct Help Center.     "
  - name: Terms
    description: >-
      An Accounts Payable term is a rule that a vendor establishes for extending credit to your company. Terms can be associated with transactions or with specific vendors.
  - name: Check runs
    description: "Use a check run to process up to 1,000 checks at a time in an offline process. First create a check run, then add payment requests to the check run. A check run's configuration determines how the checks for the payments in a run are processed.\n\nFor more information, see [Check run overview](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Check_run_overview) in the Sage Intacct Help Center.  \n"
  - name: Vendors
    description: "Vendors are individuals or companies that you pay for goods and services. \n\nWhen you create a vendor, you provide a name and a unique identifier (unless the company is configured to auto-generate identifiers). \n\nYou can also designate a credit limit, set a payment priority, establish the payment method for the vendor, and so forth. For more information, see [Create a vendor](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Adding_a_Vendor) in the Sage Intacct Help Center. \n"
  - name: Vendor account numbers
    description: >-
      The account number that a vendor assigns to an entity in a multi-entity company. For example, a telephone company might assign a phone number as a vendor account number. Account numbers help match payment information to bills being paid.
  - name: Vendor bank file setups
    description: >-
      A bank file enables electronic payments to be made to vendors using a local bank file format. Bank files are standard files used by banks to make multiple payments. For more information, see [About bank files](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Bank_file_payment) in the Sage Intacct Help Center.
  - name: Vendor contacts
    description: >-
      Use contacts to manage multiple addresses for individuals and locations associated with a vendor. To learn more, see [Vendor contact information](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Vendor_contact_information) in the Sage Intacct Help Center.
  - name: Vendor email templates
    description: >-
      Vendor email templates are an efficient way to automate sending document attachments with a standard message to multiple vendors. For more information, see [Email templates](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=Creating_an_email_template) in the Sage Intacct Help Center.
  - name: Vendor payment providers
    description: >
      Models a payment provider associated with a vendor. You can link a vendor with a payment provider using the create and update operations for this object.

      Payment provider services, like Vendor Payments powered by CSI, are only for US vendors accepting USD. See [Compare payment methods](https://www.intacct.com/ia/docs/en_US/help_action/Cash_Management/Payment_Methods/select-a-payment-method.htm) for more information.

  - name: Vendor restricted departments
    description: "In shared multi-entity companies, vendors can be restricted to specific departments or department groups to prevent the vendor from being used in the wrong entity. \n\nCreate and maintain vendor restricted departments from the owning [vendor](/openapi/ap/accounts-payable.vendor/tag/Vendors) object.\n"
  - name: Vendor restricted locations
    description: >
      In shared multi-entity companies, vendors can be restricted to specific locations or location groups to prevent the vendor from being used in the wrong entity.


      Create and maintain vendor restricted locations from the owning [vendor](/openapi/ap/accounts-payable.vendor/tag/Vendors) object.

  - name: Vendor types
    description: >
      Vendor types organize vendors into categories that are used for reporting. To share vendor types across entities, create vendor types at the top level. Creating vendor types in an entity restricts them to that entity. For more information, see [Vendor types](https://www.intacct.com/ia/docs/en_US/help_action/Accounts_Payable/Setup/Vendor_Types/aa-TOC-vendor-types.htm?tocpath=Applications%7CAccounts%20Payable%7CVendors%7CVendors%20list%7CVendor%20types%7C_____0).

  - name: Vendor groups
    description: >-
      A vendor group categorizes vendor dimension records, mainly for the purpose of structuring financial reports. For more information, see [Vendor groups](https://www.intacct.com/ia/docs/en_US/help_action/Purchasing/Setting_up_Purchasing/vendor-dimension-groups-po-ns.htm?tocpath=Applications%7CPurchasing%7CSetup%7C_____12) in the Sage Intacct Help Center.
  - name: Vendor totals
    description: >-
      A vendor total object provides information about how much is owed to a vendor.
paths:
  /objects/accounts-payable/account-label:
    get:
      summary: List account labels
      description: >
        Returns up to 100 object references from the collection with a key, ID, and link for each label. This operation is mostly for use in testing; use the [query service](/openapi/common/core.query/tag/Query) to find objects that meet certain criteria and to specify properties that are returned.

      tags:
        - Account labels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: List of account-label objects
                properties:
                  ia::result:
                    type: array
                    items:
                      $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata-pages'
              examples:
                List account labels:
                  value:
                    ia::result:
                      - key: '32'
                        id: Ref Matls
                        href: /objects/accounts-payable/account-label/32
                      - key: '33'
                        id: Rent
                        href: /objects/accounts-payable/account-label/33
                      - key: '34'
                        id: Repairs and Maintenance
                        href: /objects/accounts-payable/account-label/34
                    ia::meta:
                      totalCount: 3
                      start: 1
                      pageSize: 100
                      next: null
                      previous: null
        '400':
          $ref: '#/components/responses/400error'
      operationId: list-accounts-payable-account-label
      security:
        - OAuth2: []
    post:
      summary: Create an account label
      description: Creates a new account label.
      tags:
        - Account labels
      operationId: create-accounts-payable-account-label
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                title: New account-label
                properties:
                  ia::result:
                    $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Create an account label:
                  value:
                    ia::result:
                      key: '37'
                      id: Sales
                      href: /objects/accounts-payable/account-label/37
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/accounts-payable-account-label'
                - $ref: '#/components/schemas/accounts-payable-account-labelRequiredProperties'
            examples:
              Create an account label:
                value:
                  id: Sales
                  description: Sales team expenses
                  status: active
                  glAccount:
                    id: 4000--Sales
                  offsetGLAccount:
                    id: 4001--Miscellaneous - Sales
      security:
        - OAuth2: []
  /objects/accounts-payable/account-label/{key}:
    parameters:
      - schema:
          type: string
        name: key
        in: path
        required: true
        description: System-assigned key for the account label.
        example: '99'
    get:
      summary: Get an account label
      description: Returns detailed information for a specified account label.
      operationId: get-accounts-payable-account-label-key
      tags:
        - Account labels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Details of the account-label
                properties:
                  ia::result:
                    $ref: '#/components/schemas/accounts-payable-account-label'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Get an account label:
                  value:
                    ia::result:
                      key: '8'
                      id: Accounting Fees
                      description: Accounting Fees
                      glAccount:
                        id: 6600.01--Accounting Fees
                        key: '318'
                        href: /objects/general-ledger/account/318
                      status: active
                      offsetGLAccount:
                        id: null
                        key: null
                      form1099Type: DIV
                      form1099Box: 1B
                      href: /objects/accounts-payable/account-label/8
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
    patch:
      summary: Update an account label
      operationId: update-accounts-payable-account-label-key
      description: >-
        Updates an existing account label by setting field values. Any fields not provided remain unchanged.
      tags:
        - Account labels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Updated account-label
                properties:
                  ia::result:
                    $ref: '#/components/schemas/object-reference'
                  ia::meta:
                    $ref: '#/components/schemas/metadata'
              examples:
                Update an account label:
                  value:
                    ia::result:
                      key: '37'
                      id: Sales
                      href: /objects/accounts-payable/account-label/37
                    ia::meta:
                      totalCount: 1
                      totalSuccess: 1
                      totalError: 0
        '400':
          $ref: '#/components/responses/400error'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/accounts-payable-account-label'
                - type: object
                  properties:
                    id:
                      readOnly: true
            examples:
              Update an account label:
                value:
                  description: This is Sales Account label
                  status: active
                  offsetGLAccount:
                    id: 4000.03--Sales-Others
      security:
        - OAuth2: []
    delete:
      summary: Delete an account label
      description: Deletes an account label.
      tags:
        - Account labels
      operationId: delete-accounts-payable-account-label-key
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/400error'
      security:
        - OAuth2: []
