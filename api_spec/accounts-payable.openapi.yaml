  /workflows/accounts-payable/vendor/approve:
    post:
      summary: Approve a vendor
      description: "When vendor approval is enabled, new and recently edited vendors are automatically submitted to an approval queue. Vendors submitted to the approval queue have a state of `submitted`. Designated approvers review those vendors and either approve or decline them. When a vendor is approved, the state for that vendor changes from `submitted` to `approved`. \n\nFor more information, see [About vendor approvals](https://www.intacct.com/ia/docs/en_US/help_action/Default.htm#cshid=About_vendor_approvals) in the Sage Intacct Help Center.\n"
      tags:
        - Vendors
      operationId: approve-accounts-payable-vendor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accounts-payable-vendor-actions-approve-request'
      responses:
